<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Denizen Discord Map — Pixel Spaces</title>
  <style>
    :root {
      --ink: #1a1f2e;
      --fog: #e8eef7;
      --accent: #3d8bfd;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(1200px 700px at 20% 0%, #2a3550 0%, var(--ink) 55%);
      color: var(--fog);
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    #wrap {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 16px 16px;
      gap: 10px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 16px;
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 0;
      opacity: 0.75;
      font-size: 0.88rem;
    }
    #hud {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      padding: 8px 14px;
      color: #f4f7ff;
    }
    #room-label {
      color: #fff;
      font-weight: 700;
    }
    #presence-status {
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0.9;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(88, 101, 242, 0.35);
    }
    #presence-status[data-ok="0"] {
      background: rgba(180, 60, 60, 0.45);
    }
    #enter-hint {
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0.85;
      color: #c8d4ff;
    }
    #game-host {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      background: #0d111a;
      min-height: 0;
    }
    #game-host canvas {
      display: block;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <header>
      <h1>dorabian</h1>
      <p>Rooms = Discord channels · A/D walk · Shift run · ↑ enter · ↓ leave · 1-0 fast travel</p>
      <div id="hud">
        <span>Channel: <span id="room-label">lobby</span></span>
        <span id="enter-hint"></span>
        <span id="presence-status" data-ok="0">connecting…</span>
      </div>
    </header>
    <div id="game-host"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="./game.js?v=live-district-1"></script>
</body>
</html>
