# Denizen app server on Synology NAS (co-located with Supabase).
# Deploy: py infra/deploy-denizen-to-nas.py (from repo root on your PC)
services:
  denizen:
    image: denizen-server:latest
    container_name: denizen-server
    restart: unless-stopped
    # Host networking lets the container reach Kong/Postgres on 127.0.0.1 (same NAS).
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./desktop:/app/desktop
      - ./data:/app/data
    environment:
      NODE_ENV: production
      PORT: "8888"
      # Passthrough — full config lives in .env (see .env.production.template)
      DENIZEN_ECONOMY_MODE: "false"
      DENIZEN_COFOUNDER_LLM: "true"
      DENIZEN_REAL_WORK_MODE: "true"
      # WSL/Kali nmap patrol is Windows-only; container mode uses TCP probes on NAS.
      BOUNCER_PATROL: "container"
      # Route NPC research to visible browser on mesh desktop (LM Studio GPU PC).
      DENIZEN_MESH_BROWSER: "1"
      DENIZEN_MESH_BROWSER_HOST: "192.168.1.232"
      DENIZEN_HOST_IP: "192.168.1.232"
      BOUNCER_INVESTIGATION_URL: "http://192.168.1.232:8890"
