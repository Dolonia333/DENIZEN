<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Permission request</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #020617;
      color: #e2e8f0;
    }
    .card {
      width: min(380px, calc(100vw - 24px));
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      background: rgba(15, 23, 42, 0.98);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 17px;
      line-height: 1.3;
    }
    p {
      margin: 0 0 18px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    button {
      border: 1px solid #475569;
      background: #1e293b;
      color: #f8fafc;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    button.primary { background: #2563eb; border-color: #3b82f6; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: #fca5a5; font-size: 12px; min-height: 16px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="perm-title">Permission request</h1>
    <p id="perm-detail">Denizen is asking to perform an action on this machine.</p>
    <div class="actions">
      <button id="btn-no" type="button">No</button>
      <button id="btn-yes" class="primary" type="button">Yes</button>
    </div>
    <div class="error" id="perm-error"></div>
  </div>

  <script>
    let pending = null;

    function setError(msg) {
      const el = document.getElementById('perm-error');
      if (el) el.textContent = msg || '';
    }

    function renderPending(next) {
      pending = next || null;
      const title = document.getElementById('perm-title');
      const detail = document.getElementById('perm-detail');
      if (title) title.textContent = pending?.title || 'Permission request';
      if (detail) {
        detail.textContent = pending?.detail
          || pending?.description
          || 'Denizen is asking to perform an action on this machine.';
      }
      setError('');
    }

    async function respond(approved) {
      if (!pending?.id) return;
      const yes = document.getElementById('btn-yes');
      const no = document.getElementById('btn-no');
      if (yes) yes.disabled = true;
      if (no) no.disabled = true;
      setError('');
      try {
        await window.DenizenDesktop?.respondPermission?.({
          requestId: pending.id,
          approved,
        });
        window.close();
      } catch (err) {
        setError(err?.message || String(err));
        if (yes) yes.disabled = false;
        if (no) no.disabled = false;
      }
    }

    document.getElementById('btn-yes')?.addEventListener('click', () => respond(true));
    document.getElementById('btn-no')?.addEventListener('click', () => respond(false));

    window.DenizenDesktop?.onPermissionPending?.((data) => renderPending(data));

    window.DenizenDesktop?.getPendingPermission?.()
      .then((data) => {
        if (data?.pending) renderPending(data.pending);
      })
      .catch(() => {});
  </script>
</body>
</html>
