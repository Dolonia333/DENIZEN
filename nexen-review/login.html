<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unlock NEXEN</title><link rel="icon" href="/branding/NEXEN.ico"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 40% 10%,#174a70,transparent 60%),#071523;color:#e7f4fd;font:15px/1.6 'Segoe UI',sans-serif}main{width:min(450px,calc(100vw - 36px));padding:40px;border:1px solid #99d3ed35;border-radius:25px;background:#15364a70;box-shadow:0 35px 100px #0005;backdrop-filter:blur(22px)}img{width:80px;height:80px}h1{font:600 36px/1.1 Bahnschrift,sans-serif;letter-spacing:-1px;margin:23px 0 12px}p{color:#a8c6d9}label{display:block;font-size:13px;margin:16px 0 7px}input,button{font:inherit;width:100%;border-radius:10px;padding:13px}input{background:#071d2e;border:1px solid #88c9e450;color:inherit}button{margin-top:22px;background:#b4eaff;color:#0b2c45;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.small{font-size:12px}#status{min-height:30px;color:#ffd7a1}input:focus-visible,button:focus-visible{outline:2px solid #c4efff;outline-offset:3px}.pill{font-size:10px;letter-spacing:2px;color:#a1ddf5}</style></head><body><main><img src="/branding/NEXEN-logo.png" alt="NEXEN"><div class="pill">YOUR PRIVATE WORKSPACE</div><h1 id="title">Unlock NEXEN.</h1><p id="intro">Checking your local password setup…</p><form id="form"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="12" maxlength="256" required><div id="confirm-wrap" hidden><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="256"></div><button id="submit" disabled>Unlock</button></form><p id="status" role="status"></p><p class="small">Your password is hashed. NEXEN uses an expiring browser session. Tailscale access stays private; this lock does not encrypt existing files on F:.</p></main><script>
const requestedPage=new URLSearchParams(location.search).get('next');let returnPage='/',configured=true;const $=id=>document.getElementById(id);
fetch('/api/auth/session').then(r=>{if(!r.ok)throw Error('Session unavailable');return r.json()}).then(d=>{const targets=Array.isArray(d.supported_destinations)?d.supported_destinations:[];returnPage=typeof requestedPage==='string'&&/^\/(?!\/)/.test(requestedPage)&&!requestedPage.includes('\\')&&targets.includes(requestedPage)?requestedPage:'/';configured=d.configured;$('title').textContent=configured?'Unlock NEXEN.':'Protect your NEXEN.';$('intro').textContent=configured?'Enter your password to open your plans, tools and WDR City.':'Create a password of at least 12 characters here on your PC.';$('confirm-wrap').hidden=configured;$('confirm').required=!configured;$('password').autocomplete=configured?'current-password':'new-password';$('submit').textContent=configured?'Unlock NEXEN':'Set password & enter';$('submit').disabled=!configured&&!d.can_setup;if(!d.can_setup&&!configured)$('status').textContent='Set the first password on your NEXEN PC before using your phone.';if(d.authenticated)location.replace(returnPage)}).catch(()=>{$('status').textContent='NEXEN authentication is unavailable. Try again shortly.'});
$('form').onsubmit=async e=>{e.preventDefault();if(!configured&&$('password').value!==$('confirm').value){$('status').textContent='The passwords do not match.';return}$('submit').disabled=true;$('status').textContent='Checking…';try{const r=await fetch(configured?'/api/auth/login':'/api/auth/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Unable to unlock.');$('password').value='';$('confirm').value='';location.replace(returnPage)}catch(e){$('status').textContent=e.message;$('password').value=''}finally{$('submit').disabled=false}};
</script></body></html>
