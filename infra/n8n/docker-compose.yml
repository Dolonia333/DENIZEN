services:
  n8n:
    image: n8nio/n8n:2.26.6
    container_name: denizen-n8n
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      - N8N_HOST=n8n.dolonia.cloud
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - WEBHOOK_URL=https://n8n.dolonia.cloud
      - N8N_EDITOR_BASE_URL=https://n8n.dolonia.cloud
      - N8N_SECURE_COOKIE=true
      - N8N_PROXY_HOPS=1
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
      - N8N_RUNNERS_ENABLED=false
      - N8N_MCP_REGISTRY_ENABLED=false
      - GENERIC_TIMEZONE=America/Chicago
      - TZ=America/Chicago
    volumes:
      - /volume1/docker/n8n:/home/node/.n8n
