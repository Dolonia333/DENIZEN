# Lavalink v4 — https://github.com/lavalink-devs/Lavalink
# Docs: https://lavalink.dev/configuration/
#
# Run (Docker):
#   docker compose -f docker-compose.lavalink.yml up -d
#
# Point Denizen bot at it:
#   LAVALINK_HOST=127.0.0.1
#   LAVALINK_PORT=2333
#   LAVALINK_PASSWORD=youshallnotpass

server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # YouTube source (required for ytsearch: / most YouTube URLs)
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.13.3"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "youshallnotpass"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 50
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
