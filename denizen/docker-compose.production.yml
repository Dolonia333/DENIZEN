services:
  denizen:
    image: denizen-server:latest
    container_name: denizen-server
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8888}
    volumes:
      - ./data:/app/data
      - ./layouts:/app/layouts
      - ./desktop:/app/desktop
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||8888)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
