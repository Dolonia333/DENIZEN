<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10182c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Discord Spaces Map</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0d111a;
      color: #e8eef7;
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    #wrap {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
    }
    header {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: #10182c;
      font-size: 0.82rem;
    }
    .back-setup {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: #e8eef7;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 650;
      text-decoration: none;
      white-space: nowrap;
    }
    .back-setup:hover { border-color: #5865f2; color: #c9d4ff; }
    header h1 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
    }
    #hud {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 5px 10px;
    }
    #room-label { font-weight: 700; }
    #presence-status {
      font-size: 0.75rem;
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(88, 101, 242, 0.35);
    }
    #presence-status[data-ok="0"] { background: rgba(180, 60, 60, 0.45); }
    #enter-hint { font-size: 0.75rem; opacity: 0.85; color: #c8d4ff; }
    #game-host {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      background: #7ec8e8;
      position: relative;
    }
    #game-host canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      image-rendering: pixelated;
    }
    @media (max-width: 640px) {
      header {
        padding: 8px 10px;
        padding-top: max(8px, env(safe-area-inset-top, 0px));
        gap: 6px;
      }
      header h1 { font-size: 0.85rem; max-width: 38vw; overflow: hidden; text-overflow: ellipsis; }
      #hud {
        flex: 1 1 100%;
        margin-left: 0;
        justify-content: space-between;
        font-size: 0.72rem;
      }
      .back-setup { padding: 8px 10px; min-height: 44px; display: inline-flex; align-items: center; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <header>
      <a class="back-setup" href="/discord-map/" target="_parent">← Setup</a>
      <h1 id="map-title">Discord Spaces</h1>
      <div id="hud">
        <span>Channel: <span id="room-label">lobby</span></span>
        <span id="enter-hint"></span>
        <span id="presence-status" data-ok="0">connecting…</span>
      </div>
    </header>
    <div id="game-host"></div>
  </div>
  <script>
    try {
      const cfg = JSON.parse(localStorage.getItem('denizen-discord-map') || '{}');
      if (cfg.label) document.getElementById('map-title').textContent = cfg.label;
    } catch (_) {}
  </script>
  <script src="./mobile-touch.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="./game.js?v=spaces-live1"></script>
</body>
</html>
