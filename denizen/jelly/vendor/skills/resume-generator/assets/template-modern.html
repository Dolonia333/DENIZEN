<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{name}} — Resume</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @page { margin: 0; size: Letter; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 10.5pt;
    line-height: 1.45;
    color: #1a1a2e;
    background: #fff;
  }
  .page {
    width: 8.5in;
    min-height: 11in;
    padding: 0.5in 0.6in;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 2.5px solid #2563eb;
    padding-bottom: 12px;
    margin-bottom: 16px;
  }
  .header-left h1 {
    font-size: 22pt;
    font-weight: 700;
    color: #1a1a2e;
    letter-spacing: -0.5px;
  }
  .header-left .summary {
    color: #4a5568;
    font-size: 9.5pt;
    margin-top: 4px;
    max-width: 420px;
  }
  .header-right {
    text-align: right;
    font-size: 9pt;
    color: #4a5568;
    line-height: 1.6;
  }
  .header-right a { color: #2563eb; text-decoration: none; }

  /* Section headings */
  .section { margin-bottom: 14px; }
  .section-title {
    font-size: 10.5pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #2563eb;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 3px;
    margin-bottom: 8px;
  }

  /* Skills */
  .skills-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .skill {
    display: inline-block;
    background: #f0f4ff;
    color: #2563eb;
    font-size: 8.5pt;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 3px;
    border: 1px solid #dbeafe;
  }
  .skill.matched {
    background: #2563eb;
    color: #fff;
    border-color: #2563eb;
  }

  /* Experience */
  .experience-item { margin-bottom: 12px; }
  .exp-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .exp-title { font-weight: 600; font-size: 10.5pt; }
  .exp-dates { font-size: 9pt; color: #718096; }
  .exp-company { font-size: 9.5pt; color: #4a5568; margin-bottom: 3px; }
  .exp-bullets {
    padding-left: 18px;
    font-size: 9.5pt;
    color: #2d3748;
  }
  .exp-bullets li { margin-bottom: 2px; }

  /* Education */
  .education-item { margin-bottom: 8px; }
  .edu-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .edu-degree { font-weight: 600; font-size: 10pt; }
  .edu-date { font-size: 9pt; color: #718096; }
  .edu-school { font-size: 9.5pt; color: #4a5568; }

  /* Certifications */
  .cert-item { font-size: 9.5pt; margin-bottom: 3px; }

  /* Projects */
  .project-item { margin-bottom: 8px; }
  .proj-name { font-weight: 600; font-size: 9.5pt; }
  .proj-name a { color: #2563eb; text-decoration: none; }
  .proj-desc { font-size: 9pt; color: #4a5568; }
  .proj-tech { font-size: 8.5pt; color: #718096; font-style: italic; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-left">
      <h1>{{name}}</h1>
      <div class="summary">{{summary}}</div>
    </div>
    <div class="header-right">
      {{email}}<br>
      {{phone}}<br>
      {{location}}<br>
      <a href="{{linkedin}}">LinkedIn</a><br>
      <a href="{{github}}">GitHub</a>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Skills</div>
    <div class="skills-grid">
      {{skills}}
    </div>
  </div>

  <div class="section">
    <div class="section-title">Experience</div>
    {{experience}}
  </div>

  <div class="section">
    <div class="section-title">Education</div>
    {{education}}
  </div>

  <div class="section">
    <div class="section-title">Certifications</div>
    {{certifications}}
  </div>

  <div class="section">
    <div class="section-title">Projects</div>
    {{projects}}
  </div>
</div>
</body>
</html>
