    <script>
    /* Movement bootstrap — runs before any deferred bundle; keys always reach the game. */
    (function () {
      window.__DenizenMoveFix = 'v7';
      if (!window.__DenizenRawMoveKeys) {
        window.__DenizenRawMoveKeys = { up: false, down: false, left: false, right: false };
        var map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', W: 'up', s: 'down', S: 'down', a: 'left', A: 'left', d: 'right', D: 'right' };
        function setKey(e, on) { var d = map[e.key]; if (d) window.__DenizenRawMoveKeys[d] = on; }
        window.addEventListener('keydown', function (e) { setKey(e, true); }, true);
        window.addEventListener('keyup', function (e) { setKey(e, false); }, true);
        window.addEventListener('blur', function () {
          Object.keys(window.__DenizenRawMoveKeys).forEach(function (k) { window.__DenizenRawMoveKeys[k] = false; });
        });
      }
    })();
    </script>

    <script>
      (function () {
        // ?touch=1 / ?touch=0 forces touch mode on or off (testing narrow layouts in a desktop browser)
        // ?desktop=1 — Electron app: treat as desktop even when the machine has a touchscreen
        var force = null;
        try {
          var params = new URLSearchParams(window.location.search);
          var q = params.get('touch');
          if (q === '1' || q === 'true') force = true;
          else if (q === '0' || q === 'false') force = false;
          var desktop = params.get('desktop');
          if (desktop === '1' || desktop === 'true') force = false;
        } catch (_) {}
        window.__DenizenForceTouch = force;
        try {
          window.__DenizenIsTouch = force !== null ? force : (
            window.matchMedia('(pointer: coarse)').matches
            || (navigator.maxTouchPoints > 0
              && Math.min(window.innerWidth, window.innerHeight) < 520)
          );
        } catch (_) {
          window.__DenizenIsTouch = force === true;
        }
      })();
    </script>
    <script>
      // Log runtime errors to console; on-screen overlay is dev-only (not shown to visitors).
      (function () {
        function showErrorOverlay() {
          try {
            const h = String(window.location.hostname || '').toLowerCase();
            if (h === 'localhost' || h === '127.0.0.1' || h === '[::1]') return true;
            const q = new URLSearchParams(window.location.search || '');
            return q.has('debug') || q.get('debug') === 'errors';
          } catch (_) {
            return false;
          }
        }

        function ensureOverlay() {
          let wrap = document.getElementById('runtime-error-wrap');
          if (!wrap) {
            wrap = document.createElement('div');
            wrap.id = 'runtime-error-wrap';
            wrap.style.cssText = 'position:fixed;left:12px;top:12px;right:12px;z-index:999999;'
              + 'background:rgba(2,6,23,0.92);border:1px solid #7f1d1d;border-radius:8px;';

            const bar = document.createElement('div');
            bar.style.cssText = 'display:flex;align-items:center;justify-content:space-between;'
              + 'padding:6px 12px;border-bottom:1px solid #7f1d1d;color:#fca5a5;'
              + 'font:600 12px/1.2 system-ui,sans-serif;';
            bar.innerHTML = '<span>Something went wrong — the office keeps running. Details below.</span>';

            const close = document.createElement('button');
            close.type = 'button';
            close.textContent = '✕ Dismiss';
            close.setAttribute('aria-label', 'Dismiss error details');
            close.style.cssText = 'margin-left:12px;padding:4px 10px;border-radius:6px;cursor:pointer;'
              + 'background:#1e293b;border:1px solid #475569;color:#e2e8f0;'
              + 'font:600 11px/1.2 system-ui,sans-serif;flex-shrink:0;';
            close.addEventListener('click', function () {
              wrap.remove();
            });
            bar.appendChild(close);
            wrap.appendChild(bar);

            const el = document.createElement('pre');
            el.id = 'runtime-error';
            el.style.cssText = 'max-height:32vh;overflow:auto;padding:10px 12px;margin:0;'
              + 'color:#fecaca;font-size:12px;white-space:pre-wrap;'
              + 'font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;';
            wrap.appendChild(el);
            document.body.appendChild(wrap);
          }
          return wrap.querySelector('#runtime-error');
        }

        function reportError(kind, text) {
          console.error(`[Denizen ${kind}]`, text);
          if (!showErrorOverlay()) return;
          const el = ensureOverlay();
          el.textContent += `[${kind}] ${text}\n\n`;
        }

        window.addEventListener('error', function (ev) {
          reportError('error', `${ev.message}\n${ev.filename || ''}:${ev.lineno || ''}:${ev.colno || ''}`);
        });
        window.addEventListener('unhandledrejection', function (ev) {
          const reason = ev.reason;
          const stack = reason && typeof reason === 'object' && reason.stack
            ? `\n${reason.stack}`
            : '';
          reportError('unhandledrejection', `${String(reason)}${stack}`);
        });
      })();
    </script>

    <!-- Phaser 3 — Brave/extensions often define module/exports/define and steal the UMD global -->
    <script>
      (function () {
        var urls = [
          '/vendor/phaser/phaser.min.js?v=380c',
          'https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js'
        ];
        var idx = 0;
        window.__DenizenPhaserReady = false;
        window.__DenizenPhaserLoadDone = false;

        function stashGlobals() {
          try {
            window.__dzModule = window.module;
            window.__dzExports = window.exports;
            window.__dzDefine = window.define;
            window.module = undefined;
            window.exports = undefined;
            // AMD `define` also steals UMD — common with Brave extensions
            if (typeof window.define === 'function') window.define = undefined;
          } catch (_) {}
        }

        function restoreGlobals() {
          try {
            if (window.__dzModule !== undefined) window.module = window.__dzModule;
            else try { delete window.module; } catch (_) { window.module = undefined; }
            if (window.__dzExports !== undefined) window.exports = window.__dzExports;
            else try { delete window.exports; } catch (_) { window.exports = undefined; }
            if (window.__dzDefine !== undefined) window.define = window.__dzDefine;
            else try { delete window.define; } catch (_) { window.define = undefined; }
          } catch (_) {}
        }

        function claimPhaser() {
          if (typeof window.Phaser !== 'undefined') return true;
          try {
            var ex = window.__dzExports;
            if (ex && (ex.Phaser || ex.Game)) window.Phaser = ex.Phaser || ex;
          } catch (_) {}
          try {
            if (typeof window.Phaser === 'undefined' && window.module && window.module.exports) {
              window.Phaser = window.module.exports.Phaser || window.module.exports;
            }
          } catch (_) {}
          return typeof window.Phaser !== 'undefined';
        }

        function paintHud(msg) {
          try {
            var line = document.getElementById('denizen-boot-hud-line');
            if (line) line.textContent = msg;
          } catch (_) {}
        }

        function finish(ok, src) {
          restoreGlobals();
          claimPhaser();
          ok = typeof window.Phaser !== 'undefined';
          window.__DenizenPhaserReady = ok;
          window.__DenizenPhaserLoadDone = true;
          console.log('[DenizenBoot] Phaser=', typeof window.Phaser,
            window.Phaser && window.Phaser.VERSION, 'src=', src || '(none)');
          paintHud(ok
            ? ('Phaser ' + (window.Phaser.VERSION || 'ok') + ' ready')
            : 'Phaser MISSING — click Brave lion → Shields Down for this site, then Ctrl+Shift+R');
          try {
            if (typeof window.__onDenizenPhaserReady === 'function') {
              window.__onDenizenPhaserReady(ok);
            }
          } catch (_) {}
        }

        function tryNext() {
          if (idx >= urls.length) {
            finish(false, null);
            return;
          }
          var url = urls[idx++];
          paintHud('loading Phaser… ' + (idx === 1 ? 'local' : 'cdn fallback'));
          stashGlobals();
          var s = document.createElement('script');
          s.src = url;
          s.async = false;
          s.onload = function () {
            if (claimPhaser()) finish(true, url);
            else {
              console.warn('[DenizenBoot] script loaded but Phaser global missing:', url);
              restoreGlobals();
              tryNext();
            }
          };
          s.onerror = function () {
            console.warn('[DenizenBoot] Phaser failed to load:', url);
            restoreGlobals();
            tryNext();
          };
          document.head.appendChild(s);
        }

        tryNext();
      })();
    </script>

    <!-- Inline boot HUD (not in an external JS file — survives Brave cache of old bundles) -->
    <div id="denizen-boot-hud" style="position:fixed;left:8px;bottom:8px;z-index:2147483647;max-width:min(520px,92vw);padding:10px 12px;border-radius:8px;background:rgba(0,0,0,0.88);color:#e2e8f0;font:12px/1.4 ui-monospace,Consolas,monospace;border:1px solid #334155;pointer-events:none;">
      <div style="color:#4ade80;font-weight:700;">Denizen boot v7</div>
      <div id="denizen-boot-hud-line">checking Phaser…</div>
    </div>
    <script>
      (function () {
        var line = document.getElementById('denizen-boot-hud-line');
        var hud = document.getElementById('denizen-boot-hud');
        var n = 0;
        var t = setInterval(function () {
          n += 1;
          var phaser = typeof window.Phaser;
          var game = !!window.game;
          var canvas = !!document.querySelector('#game-container canvas');
          var msg = 'Phaser=' + phaser
            + (window.Phaser && window.Phaser.VERSION ? ' ' + window.Phaser.VERSION : '')
            + ' | game=' + game
            + ' | canvas=' + canvas
            + ' | t=' + n + 's';
          if (line) line.textContent = msg;
          if (hud) {
            hud.style.borderColor = (game && canvas) ? '#4ade80' : (phaser === 'undefined' ? '#ef4444' : '#f59e0b');
          }
          if ((game && canvas) || n >= 20) {
            clearInterval(t);
            if (game && canvas && hud) {
              setTimeout(function () { hud.style.display = 'none'; }, 2500);
            } else if (hud && line) {
              line.textContent = msg + ' — STUCK. Click Brave lion → Shields Down, then Ctrl+Shift+R. Screenshot this box.';
            }
          }
        }, 1000);
      })();
    </script>
