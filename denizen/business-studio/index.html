<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Business Studio · Founder OS · Denizen</title>
<style>
:root{
  --bg:#0c1219;
  --bg-2:#121a24;
  --surface:#162030;
  --surface-2:#1c2a3c;
  --surface-3:#243447;
  --ink:#e8eef4;
  --ink-2:#b4c2d0;
  --muted:#7a8fa3;
  --muted-2:#5a7085;
  --line:rgba(184,204,220,.12);
  --line-2:rgba(184,204,220,.07);
  --gold:#f0b429;
  --gold-dim:rgba(240,180,41,.14);
  --gold-press:#d49a1a;
  --forest:#2a6a55;
  --forest-2:#1e4f40;
  --forest-tint:rgba(42,106,85,.18);
  --danger:#c94f38;
  --danger-tint:rgba(201,79,56,.14);
  --warn:#d28e2e;
  --ok:#3d9b74;
  --info:#3f6fa8;
  --font-ui:'Segoe UI',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --font-display:'Segoe UI Semibold','Segoe UI',ui-sans-serif,system-ui,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 4px 16px rgba(0,0,0,.2);
  --shadow-modal:0 24px 64px rgba(0,0,0,.55);
  --radius:12px;
  --sidebar-w:220px;
  --bottom-nav-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg)}
body{
  font-family:var(--font-ui);color:var(--ink);background:
    radial-gradient(1200px 600px at 10% -10%, rgba(42,106,85,.18), transparent 55%),
    radial-gradient(900px 500px at 100% 0%, rgba(240,180,41,.08), transparent 50%),
    var(--bg);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100dvh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-dim)}
textarea{min-height:88px;resize:vertical}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== App chrome ===== */
.dz-app-chrome{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;
  padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));
  background:rgba(12,18,25,.94);border-bottom:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.dz-app-chrome a{color:var(--ink);text-decoration:none;font-size:12.5px;font-weight:600;
  padding:6px 10px;border-radius:8px;border:1px solid var(--line);white-space:nowrap}
.dz-app-chrome a:hover{border-color:var(--gold);color:var(--gold)}
.dz-app-chrome .dz-app-title{color:var(--muted);font-size:12px;margin-left:4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dz-app-chrome .dz-app-spacer{flex:1;min-width:8px}
html.embed .dz-app-chrome{display:none}

/* ===== Shell ===== */
.shell{display:flex;min-height:calc(100vh - 44px);min-height:calc(100dvh - 44px)}
.sidebar{
  width:var(--sidebar-w);flex:none;background:var(--bg-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:16px 12px;gap:4px;position:sticky;top:44px;height:calc(100vh - 44px);height:calc(100dvh - 44px);overflow:auto
}
.side-brand{padding:4px 8px 14px;border-bottom:1px solid var(--line-2);margin-bottom:10px}
.side-brand h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.02em;color:var(--ink);font-family:var(--font-display)}
.side-brand small{color:var(--muted);font-size:11.5px}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;
  color:var(--ink-2);font-size:13px;font-weight:500;text-align:left;width:100%;transition:.12s
}
.nav-item:hover{background:var(--surface);color:var(--ink)}
.nav-item.active{background:var(--gold-dim);color:var(--gold)}
.nav-item .ico{width:18px;text-align:center;opacity:.85;font-size:13px}
.nav-sec{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);padding:14px 10px 6px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.main-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:22px clamp(14px,2.5vw,28px) 40px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h2{margin:0;font-size:22px;font-weight:650;letter-spacing:-.025em;font-family:var(--font-display)}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px;max-width:52ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:.12s;white-space:nowrap
}
.btn:hover{border-color:var(--muted);background:var(--surface-2)}
.btn-primary{background:var(--gold);color:#1a1408;border-color:var(--gold)}
.btn-primary:hover{background:var(--gold-press);border-color:var(--gold-press)}
.btn-forest{background:var(--forest);color:#f0f7f4;border-color:var(--forest)}
.btn-forest:hover{background:var(--forest-2)}
.btn-ghost{background:transparent}
.btn-danger{background:var(--danger-tint);color:#f0b4a8;border-color:rgba(201,79,56,.35)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn-why{color:var(--gold);border-color:rgba(240,180,41,.35);background:var(--gold-dim);font-size:11.5px;padding:4px 9px}

.panel{
  background:linear-gradient(180deg,var(--surface),var(--bg-2));
  border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)
}
.panel h3{margin:0 0 10px;font-size:14px;font-weight:650;letter-spacing:-.01em}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:980px){.grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

.health-card{padding:14px 15px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2)}
.health-card .hc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.health-card .hc-name{font-weight:600;font-size:13.5px}
.health-card .hc-reason{color:var(--ink-2);font-size:12.5px;line-height:1.4}
.status{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  font-size:11px;font-weight:650;text-transform:capitalize;letter-spacing:.01em
}
.status::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.status-on_track,.status-complete,.status-done,.status-accepted{color:#7dcea0;background:rgba(61,155,116,.16)}
.status-needs_attention,.status-blocked,.status-declined{color:#f0a090;background:var(--danger-tint)}
.status-in_progress,.status-active,.status-testing,.status-pending{color:#f0c96a;background:var(--gold-dim)}
.status-unknown,.status-not_started,.status-todo{color:var(--muted);background:rgba(122,143,163,.14)}
.status-insufficient{color:#f0a090;background:var(--danger-tint)}
.status-sufficient_to_decide{color:#7dcea0;background:rgba(61,155,116,.16)}

.list{display:flex;flex-direction:column;gap:8px}
.row-item{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:12px 13px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2)
}
.row-item .rt{font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.row-item .rm{color:var(--muted);font-size:12px;margin-top:3px}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;flex:none}

.empty{
  padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);
  border-radius:var(--radius);background:rgba(22,32,48,.4)
}
.empty strong{display:block;color:var(--ink-2);margin-bottom:4px;font-size:14px}
.stub-phase2{
  padding:32px 20px;text-align:center;border:1px dashed rgba(240,180,41,.35);
  border-radius:var(--radius);background:rgba(240,180,41,.05);color:var(--ink-2)
}
.stub-phase2 h3{margin:0 0 8px;color:var(--gold);font-size:16px}
.form-grid{display:grid;gap:10px;margin-top:12px}
.form-grid label{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--ink-2)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.form-row{grid-template-columns:1fr}}
.field-hint{font-size:11.5px;color:var(--muted);font-weight:400}

.progress-bar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden;border:1px solid var(--line-2)}
.progress-bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--forest),var(--gold));border-radius:999px}
.meta-line{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px;margin-top:8px}

/* Roadmap stages */
.stage-rail{display:flex;gap:0;overflow-x:auto;padding:8px 0 4px;-webkit-overflow-scrolling:touch}
.stage-node{
  flex:1 0 120px;min-width:110px;position:relative;padding:14px 12px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface-2);text-align:left;transition:.12s
}
.stage-node:first-child{border-radius:10px 0 0 10px}
.stage-node:last-child{border-radius:0 10px 10px 0}
.stage-node:hover,.stage-node:focus{background:var(--surface-3);z-index:1}
.stage-node .sn-name{font-weight:650;font-size:13px}
.stage-node .sn-status{margin-top:6px}
.stage-node.complete{border-color:rgba(61,155,116,.45);background:rgba(61,155,116,.1)}
.stage-node.active{border-color:rgba(240,180,41,.5);background:var(--gold-dim)}

/* Strategy SVG */
.strategy-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-2);max-height:70vh}
.strategy-wrap svg{display:block;min-width:320px}
.strategy-wrap .node-hit{cursor:pointer}
.strategy-wrap .node-hit:hover rect{stroke:var(--gold)}

/* Copilot */
.copilot{
  border:1px solid rgba(240,180,41,.28);background:linear-gradient(160deg,rgba(240,180,41,.1),rgba(42,106,85,.08));
  border-radius:var(--radius);padding:16px 18px
}
.copilot .cp-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.copilot .cp-body{font-size:14px;line-height:1.5;color:var(--ink)}
.copilot .cp-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* Toggle */
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.toggle input{width:auto;accent-color:var(--gold)}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;z-index:100;background:rgba(4,8,12,.72);
  display:flex;align-items:center;justify-content:center;padding:16px;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)
}
.modal-backdrop[hidden]{display:none!important}
.modal{
  width:min(520px,100%);max-height:min(88vh,720px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-modal);padding:18px 20px
}
.modal h3{margin:0 0 8px;font-size:17px;letter-spacing:-.02em}
.modal .why-block{margin-top:12px;padding:12px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line-2)}
.modal .why-block dt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:10px}
.modal .why-block dt:first-child{margin-top:0}
.modal .why-block dd{margin:4px 0 0;color:var(--ink-2);font-size:13px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* Toast */
.toast-wrap{position:fixed;bottom:24px;right:16px;z-index:120;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;padding:10px 14px;border-radius:10px;background:var(--surface-3);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px;color:var(--ink);max-width:320px}
@media(max-width:720px){.toast-wrap{bottom:calc(var(--bottom-nav-h) + 16px + env(safe-area-inset-bottom,0px));left:12px;right:12px}}

/* Onboarding */
.welcome{
  max-width:560px;margin:40px auto;padding:28px 24px;border-radius:16px;
  border:1px solid var(--line);background:linear-gradient(165deg,var(--surface),var(--bg-2));
  box-shadow:var(--shadow);text-align:center
}
.welcome h2{margin:0 0 8px;font-size:24px;letter-spacing:-.03em;font-family:var(--font-display)}
.welcome p{color:var(--muted);margin:0 0 20px}
.welcome .actions{justify-content:center}

/* Bottom nav (mobile) */
.bottom-nav{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:45;
  height:calc(var(--bottom-nav-h) + env(safe-area-inset-bottom,0px));
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  background:rgba(12,18,25,.96);border-top:1px solid var(--line);
  grid-template-columns:repeat(5,1fr);gap:2px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)
}
.bn-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;font-weight:600;color:var(--muted);border-radius:10px;padding:4px 2px;touch-action:manipulation
}
.bn-item.active{color:var(--gold);background:var(--gold-dim)}
.bn-item .bn-ico{font-size:16px;line-height:1}
.bn-plus{
  width:44px;height:44px;border-radius:50%;background:var(--gold);color:#1a1408;
  display:grid;place-items:center;font-size:24px;font-weight:700;margin:-10px auto 0;box-shadow:0 4px 14px rgba(240,180,41,.35)
}
.more-sheet{
  position:fixed;inset:0;z-index:60;background:rgba(4,8,12,.65);display:none;align-items:flex-end
}
.more-sheet.open{display:flex}
.more-panel{
  width:100%;max-height:78vh;overflow:auto;background:var(--bg-2);border-radius:16px 16px 0 0;
  border:1px solid var(--line);padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));
}
.more-panel h3{margin:0 0 10px;font-size:15px}
.more-panel .nav-item{padding:12px 10px}

.crm-frame{width:100%;height:min(70vh,640px);border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.chip{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--forest-tint);color:#9fd4be}
.kbd{font-size:11px;color:var(--muted)}

@media (max-width:720px){
  html,body{height:100%;height:100dvh;overflow:hidden}
  body.standalone{display:flex;flex-direction:column;min-height:100dvh;height:100dvh;overflow:hidden}
  .dz-app-chrome{position:relative;flex-shrink:0;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));gap:8px}
  .dz-app-chrome a{padding:5px 8px;font-size:12px}
  .dz-app-chrome .dz-app-title{font-size:11px;max-width:36vw}
  .shell{flex:1;min-height:0;overflow:hidden}
  .sidebar{display:none}
  .main{min-height:0}
  .main-scroll{
    padding:12px 12px calc(var(--bottom-nav-h) + 20px + env(safe-area-inset-bottom,0px));
    -webkit-overflow-scrolling:touch
  }
  .bottom-nav{display:grid}
  .page-head h2{font-size:19px}
  .stage-node{flex:0 0 130px}
}
@media (min-width:721px){
  .bottom-nav,.more-sheet{display:none!important}
}
</style>
</head>
<body>
<div class="dz-app-chrome" role="navigation" aria-label="Business Studio app bar">
  <a href="/">← Back to office</a>
  <span class="dz-app-title">Business Studio · Founder OS</span>
  <span class="dz-app-spacer"></span>
  <a href="/crm/">Open CRM</a>
  <a href="/studio-board/">Studio Board</a>
</div>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Primary"></aside>
  <div class="main">
    <div class="main-scroll" id="main"></div>
  </div>
</div>

<nav class="bottom-nav" aria-label="Mobile">
  <button class="bn-item" data-view="overview" type="button"><span class="bn-ico">⌂</span>Home</button>
  <button class="bn-item" data-view="programs" type="button"><span class="bn-ico">▣</span>Plan</button>
  <button class="bn-item" data-action="quickadd" type="button" aria-label="Quick add"><span class="bn-plus">+</span></button>
  <button class="bn-item" data-view="metrics" type="button"><span class="bn-ico">▦</span>Metrics</button>
  <button class="bn-item" data-action="more" type="button"><span class="bn-ico">⋯</span>More</button>
</nav>

<div class="more-sheet" id="moreSheet" hidden>
  <div class="more-panel" id="morePanel"></div>
</div>

<div class="modal-backdrop" id="modalRoot" hidden></div>
<div class="toast-wrap" id="toasts"></div>

<script>
/* ========================================================================
   DENIZEN Business Studio — Phase 1 Founder OS
   Single-file SPA: CSS above + JS sections below.
   ======================================================================== */

/* ---------- 0. Embed / standalone ---------- */
(function(){
  try{
    var q = new URLSearchParams(location.search);
    if(q.get('embed')==='1' || q.get('embed')==='true') document.documentElement.classList.add('embed');
    else document.body.classList.add('standalone');
  }catch(e){}
})();

/* ---------- 1. Storage shim (dz-bs:) ---------- */
window.storage = {
  getItem(k){ return localStorage.getItem('dz-bs:'+k); },
  setItem(k,v){ localStorage.setItem('dz-bs:'+k, v); },
  removeItem(k){ localStorage.removeItem('dz-bs:'+k); }
};

/* ---------- 2. Utilities ---------- */
function uid(prefix){
  return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
}
function nowISO(){ return new Date().toISOString(); }
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtDate(iso){
  if(!iso) return '—';
  try{
    const d=new Date(iso);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }catch(e){ return '—'; }
}
function toast(msg){
  const wrap=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast';
  el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); },3200);
}
function weekBounds(){
  const d=new Date();
  const day=d.getDay();
  const start=new Date(d); start.setHours(0,0,0,0); start.setDate(d.getDate()-(day===0?6:day-1));
  const end=new Date(start); end.setDate(start.getDate()+7);
  return {start,end};
}

/* ---------- 3. Empty state / config ---------- */
function emptyConfig(){
  return {
    healthCategories:['product','customer_discovery','market_validation','sales','financial','operations','program','technical'],
    mentorShareDefaults:{
      programs:true,roadmap:true,goals:true,experiments:true,evidence:true,metrics:true,
      pave:true,deliverables:true,meetings:true,founderQuestions:true,
      financials:false,crm:false,privateNotes:false
    },
    advisorMode:false
  };
}
function emptyState(){
  return {
    business:null,
    programs:[],
    goals:[],
    milestones:[],
    tasks:[],
    strategyNodes:[],
    strategyEdges:[],
    assumptions:[],
    experiments:[],
    evidence:[],
    findings:[],
    decisions:[],
    metrics:[],
    advisors:[],
    comments:[],
    recommendations:[],
    relations:[],
    meetings:[],
    activity:[],
    config:emptyConfig(),
    documents:[],
    workbooks:[]
  };
}
function sanitizeState(raw){
  const out=emptyState();
  if(!raw || typeof raw!=='object') return out;
  if(raw.business && typeof raw.business==='object') out.business={...raw.business};
  const keys=['programs','goals','milestones','tasks','strategyNodes','strategyEdges','assumptions',
    'experiments','evidence','findings','decisions','metrics','advisors','comments','recommendations',
    'relations','meetings','activity','documents','workbooks'];
  keys.forEach(k=>{ if(Array.isArray(raw[k])) out[k]=raw[k]; });
  if(raw.config && typeof raw.config==='object') out.config={...out.config,...raw.config};
  return out;
}

/* ---------- 4. E3 / PAVE template (inline, mirrors denizen-business-studio-e3-template.js) ---------- */
function buildE3Template(opts){
  opts=opts||{};
  const businessName=opts.businessName||'My Business';
  const founderName=opts.founderName||'Founder';
  const now=nowISO();
  const programId=uid('prog');

  const stages=[
    {id:'idea',name:'Idea',order:1,status:'complete'},
    {id:'prototype',name:'Prototype',order:2,status:'complete'},

/* ---------- 5. Progress & health (explainable — no fake %) ---------- */
function evidenceForRequirement(st, req){
  const evidence=Array.isArray(st.evidence)?st.evidence:[];
  return evidence.filter(function(e){
    if(!e) return false;
    if(Array.isArray(e.linkedRequirementIds) && e.linkedRequirementIds.indexOf(req.id)>=0) return true;
    if(Array.isArray(e.linkedAssumptionKeys) && req.linkedAssumptionKey
      && e.linkedAssumptionKeys.indexOf(req.linkedAssumptionKey)>=0) return true;
    if(e.requirementKey && e.requirementKey===req.key) return true;
    return false;
  });
}
function requirementProgress(st, req){
  const linked=evidenceForRequirement(st, req);
  const count=linked.length;
  const target=Math.max(1, Number(req.targetCount)||1);
  const complete=count>=target;
  return {
    id:req.id,key:req.key,title:req.title,count,target,complete,
    evidenceIds:linked.map(function(e){return e.id;}),
    missing:Math.max(0,target-count),
    why: complete
      ? count+'/'+target+' required evidence items attached.'
      : count+' of '+target+' required evidence items attached; '+Math.max(0,target-count)+' still missing.'
  };
}
function programProgress(st, program){
  if(!program){
    return {percent:null,label:'No program',why:'No active program selected.',requirements:[],stageStatuses:[]};
  }
  const reqs=Array.isArray(program.requirements)?program.requirements:[];
  const reqProgress=reqs.map(function(r){ return requirementProgress(st,r); });
  const done=reqProgress.filter(function(r){return r.complete;}).length;
  const total=reqProgress.length;
  const percent=total===0?null:Math.round((done/total)*100);
  const stages=Array.isArray(program.stages)?program.stages:[];
  const stageStatuses=stages.map(function(stage){
    const stageReqs=reqProgress.filter(function(r){
      const raw=reqs.find(function(x){return x.id===r.id;});
      return raw && raw.stageId===stage.id;
    });
    var status=stage.status||'not_started';
    var why='Stage marked '+status+'.';
    if(stageReqs.length){
      const sDone=stageReqs.filter(function(r){return r.complete;}).length;
      if(sDone===stageReqs.length){ status='complete'; why='All '+stageReqs.length+' requirements have enough evidence.'; }
      else if(sDone>0 || stage.status==='active'){ status='active'; why=sDone+'/'+stageReqs.length+' requirements evidenced.'; }
      else if(stage.status==='complete'){ status='complete'; why='Marked complete (no requirements gated).'; }
      else { status=stage.status||'not_started'; why='0/'+stageReqs.length+' requirements evidenced.'; }
    }
    return {id:stage.id,name:stage.name,status,why,requirements:stageReqs};
  });
  return {
    programId:program.id,programName:program.name,percent,
    label:percent==null?'No gated requirements':done+'/'+total+' requirements evidenced',
    why:total===0?'Program has no evidence-gated requirements yet.':done+' of '+total+' program requirements have sufficient linked evidence.',
    requirements:reqProgress,stageStatuses
  };
}
function experimentProgress(exp, st){
  const evidence=(st.evidence||[]).filter(function(e){
    return (Array.isArray(e.linkedExperimentIds)&&e.linkedExperimentIds.indexOf(exp.id)>=0) || e.experimentId===exp.id;
  });
  const count=Math.max(Number(exp.completedCount)||0, evidence.length);
  const target=Math.max(1, Number(exp.targetCount)||1);
  const complete=count>=target;
  return {
    id:exp.id,title:exp.title,count,target,complete,
    confidence:complete?'sufficient_to_decide':'insufficient',
    why:complete
      ? count+'/'+target+' experiment samples collected — ready for a decision (not auto-validated).'
      : count+'/'+target+' samples — insufficient evidence to validate the linked assumption.',
    evidenceIds:evidence.map(function(e){return e.id;})
  };
}
function businessHealth(st){
  const programs=Array.isArray(st.programs)?st.programs:[];
  const activeProgram=programs.find(function(p){return p.status==='active';})||programs[0]||null;
  const prog=programProgress(st, activeProgram);
  const experiments=(st.experiments||[]).map(function(e){return experimentProgress(e,st);});
  const openTasks=(st.tasks||[]).filter(function(t){return t && t.status!=='done' && t.status!=='cancelled';});
  const overdueTasks=openTasks.filter(function(t){return t.due && new Date(t.due)<new Date();});
  const categories=[];

  const discoveryExp=experiments.find(function(e){return /interview|discovery/i.test(e.title);})||experiments[0];
  if(discoveryExp){
    categories.push({
      id:'customer_discovery',name:'Customer Discovery',
      status:discoveryExp.complete?'on_track':'needs_attention',
      reason:discoveryExp.why,evidenceIds:discoveryExp.evidenceIds,
      missing:discoveryExp.complete?[]:[ (discoveryExp.target-discoveryExp.count)+' more interviews/evidence' ],
      recommendedAction:discoveryExp.complete?'Record a decision on the linked assumption.':'Schedule additional discovery interviews and attach evidence.'
    });
  } else {
    categories.push({
      id:'customer_discovery',name:'Customer Discovery',status:'unknown',
      reason:'No discovery experiment defined.',evidenceIds:[],
      missing:['Create a discovery experiment'],
      recommendedAction:'Create an experiment tied to a core assumption.'
    });
  }

  if(activeProgram){
    const behind=(prog.requirements||[]).some(function(r){return !r.complete && r.count<r.target;});
    categories.push({
      id:'program',name:'Program / Accelerator',
      status:behind?'needs_attention':(prog.percent===100?'on_track':'in_progress'),
      reason:prog.why,
      evidenceIds:(prog.requirements||[]).flatMap(function(r){return r.evidenceIds||[];}),
      missing:(prog.requirements||[]).filter(function(r){return !r.complete;}).map(function(r){return r.title;}),
      recommendedAction:behind?'Focus on the active stage’s missing evidence requirements.':'Continue executing active stage deliverables.'
    });
  }

  categories.push({
    id:'operations',name:'Operations',
    status:overdueTasks.length?'needs_attention':(openTasks.length?'in_progress':'on_track'),
    reason:overdueTasks.length
      ? overdueTasks.length+' overdue task(s); '+openTasks.length+' open.'
      : openTasks.length+' open task(s); none overdue.',
    evidenceIds:[],
    missing:overdueTasks.map(function(t){return t.title;}),
    recommendedAction:overdueTasks.length?'Reschedule or complete overdue tasks this week.':'Work the highest-priority open tasks.'
  });

  return {
    generatedAt:nowISO(),program:prog,experiments,categories,
    openTaskCount:openTasks.length,overdueTaskCount:overdueTasks.length
  };
}
function explainStatus(st, subject){
  const health=businessHealth(st);
  if(!subject || subject==='program') return {kind:'program',...health.program};
  if(String(subject).indexOf('category:')===0){
    const id=String(subject).slice('category:'.length);
    return health.categories.find(function(c){return c.id===id;})||{kind:'unknown',why:'Category not found.'};
  }
  if(String(subject).indexOf('experiment:')===0){
    const id=String(subject).slice('experiment:'.length);
    return health.experiments.find(function(e){return e.id===id;})||{kind:'unknown',why:'Experiment not found.'};
  }
  if(String(subject).indexOf('stage:')===0){
    const id=String(subject).slice('stage:'.length);
    const stage=(health.program.stageStatuses||[]).find(function(s){return s.id===id;});
    return stage||{kind:'unknown',why:'Stage not found.'};
  }
  return {kind:'unknown',why:'Unknown subject.'};
}
function topRecommendation(st){
  const health=businessHealth(st);
  const attn=health.categories.find(function(c){return c.status==='needs_attention';})
    || health.categories.find(function(c){return c.status==='in_progress';})
    || health.categories[0];
  if(!attn){
    return {
      title:'Set up your workspace',
      body:'Apply the E3 / PAVE template or add a goal so health and recommendations have real signal.',
      actions:[{label:'Open Programs',view:'programs'},{label:'Add evidence',view:'evidence'}]
    };
  }
  return {
    title:attn.name,
    body:attn.recommendedAction+' — '+attn.reason,
    categoryId:attn.id,
    actions:[
      {label:'Create task',action:'create-task-from-rec',payload:attn.recommendedAction},
      {label:'Open evidence',view:'evidence'},
      {label:'WHY?',action:'why',payload:'category:'+attn.id}
    ]
  };
}

/* ---------- 7. Persistence + cloud sync ---------- */
function persistLocal(){
  try{ window.storage.setItem('workspace', JSON.stringify(state)); }catch(e){}
}
function scheduleSave(){
  persistLocal();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){ pushRemoteWorkspace().catch(function(){}); },600);
}
function loadLocal(){
  try{
    const raw=window.storage.getItem('workspace');
    if(raw) state=sanitizeState(JSON.parse(raw));
  }catch(e){ state=emptyState(); }
}
function readVisitorSession(){
  try{
    const raw=localStorage.getItem('denizen-visitor-session');
    if(!raw) return null;
    const d=JSON.parse(raw);
    if(d && d.session_id) return d;
  }catch(e){}
  return null;
}
function authHeaders(sess){
  return {
    'X-Session-Id':sess.session_id,
    'X-Session-Token':sess.session_token||'',
    'Authorization':'Bearer '+(sess.session_token||'')
  };
}
async function fetchRemoteWorkspace(){
  const sess=readVisitorSession();
  if(!sess) return null;
  try{
    const url='/api/business-studio/workspace?session_id='+encodeURIComponent(sess.session_id);
    const res=await fetch(url,{headers:authHeaders(sess)});
    if(!res.ok) return null;
    const data=await res.json();
    if(!data || !data.ok || !data.state) return null;
    remoteSyncEnabled=true;
    remoteUpdatedAt=data.updated_at||null;
    return data;
  }catch(e){ return null; }
}
async function pushRemoteWorkspace(){
  const sess=readVisitorSession();
  if(!sess || !remoteSyncEnabled) return;
  if(isAdvisorMode()) return; // mentors use scoped POST endpoints, never overwrite workspace
  try{
    const res=await fetch('/api/business-studio/workspace',{
      method:'PUT',
      headers:Object.assign({'Content-Type':'application/json'}, authHeaders(sess)),
      body:JSON.stringify({
        session_id:sess.session_id,
        session_token:sess.session_token,
        if_updated_at:remoteUpdatedAt,
        state:state
      })
    });
    const data=await res.json().catch(function(){return {};});
    if(res.ok && data.ok){
      remoteUpdatedAt=data.updated_at||remoteUpdatedAt;
    } else if(res.status===409 && data.state){
      state=sanitizeState(data.state);
      remoteUpdatedAt=data.updated_at||remoteUpdatedAt;
      persistLocal();
      render();
    }
  }catch(e){}
}
async function bootstrapSync(){
  const remote=await fetchRemoteWorkspace();
  if(remote && remote.state){
    const remoteHas=remote.state.business || (remote.state.programs&&remote.state.programs.length);
    const localHas=state.business || (state.programs&&state.programs.length);
    if(remoteHas || !localHas){
      state=sanitizeState(remote.state);
      persistLocal();
    } else if(localHas){
      await pushRemoteWorkspace();
    }
    if(remote.viewer && remote.viewer.role && /mentor|advisor|investor|viewer/i.test(remote.viewer.role)){
      state.config=state.config||{};
      state.config.advisorMode=true;
    }
  }
}
async function postStudioApi(path, payload){
  const sess=readVisitorSession();
  if(!sess || !remoteSyncEnabled) return null;
  const res=await fetch(path,{
    method:'POST',
    headers:Object.assign({'Content-Type':'application/json'}, authHeaders(sess)),
    body:JSON.stringify(Object.assign({
      session_id:sess.session_id,
      session_token:sess.session_token
    }, payload||{}))
  });
  const data=await res.json().catch(function(){return {};});
  if(!res.ok || data.ok===false){
    throw new Error(data.error||('API '+res.status));
  }
  if(data.updated_at) remoteUpdatedAt=data.updated_at;
  return data;
}

function applyE3Template(opts){
  const built=buildE3Template(opts||{
    businessName:(state.business&&state.business.name)||'My Business',
    founderName:(state.business&&state.business.founderName)||'Founder'
  });
  if(!state.business){

      id:uid('biz'),
      name:opts&&opts.businessName||'My Business',

      createdAt:nowISO()
    };
  }
  state.programs=state.programs.filter(function(p){return p.templateId!=='i2e-e3-pave';});
  state.programs.push(built.program);
  ui.selectedProgramId=built.program.id;
  state.milestones=state.milestones.concat(built.milestones);
  state.tasks=state.tasks.concat(built.tasks);
  state.assumptions=state.assumptions.concat(built.assumptions);
  state.experiments=state.experiments.concat(built.experiments);
  state.goals=state.goals.concat(built.goals);
  // merge metrics by key
  built.metrics.forEach(function(m){
    const existing=state.metrics.find(function(x){return x.key===m.key;});
    if(!existing) state.metrics.push(m);
  });
  if(!state.strategyNodes.length){
    state.strategyNodes=built.strategyNodes;
    state.strategyEdges=built.strategyEdges;
  }
  logActivity('Applied E3 / PAVE template');
  scheduleSave();
  toast('Applied E3 / PAVE template');
}

/* ---------- 9. WHY modal (createPortal-style) ---------- */
function createPortal(contentHtml, opts){
  opts=opts||{};
  const root=document.getElementById('modalRoot');
  root.hidden=false;
  root.innerHTML='<div class="modal" role="dialog" aria-modal="true">'
    +'<h3>'+esc(opts.title||'Details')+'</h3>'
    +contentHtml
    +'<div class="modal-foot"><button type="button" class="btn" data-close-modal>Close</button></div>'
    +'</div>';
  function close(){
    root.hidden=true;
    root.innerHTML='';
    root.removeEventListener('click', onBg);
  }
  function onBg(e){
    if(e.target===root || e.target.hasAttribute('data-close-modal')) close();
  }
  root.addEventListener('click', onBg);
  return {close:close, root:root};
}
function showWhy(subject){
  const expl=explainStatus(state, subject);
  const reason=expl.reason||expl.why||'No explanation available.';
  const evidenceIds=expl.evidenceIds||[];
  const missing=expl.missing||(expl.missing!=null?[expl.missing]:[]);
  const missingList=Array.isArray(missing)?missing:[];
  const action=expl.recommendedAction||'';
  const html='<div class="why-block">'
    +'<dl>'
    +'<dt>Reason</dt><dd>'+esc(reason)+'</dd>'
    +'<dt>Evidence IDs</dt><dd>'+(evidenceIds.length?esc(evidenceIds.join(', ')):'None linked yet')+'</dd>'
    +'<dt>Missing</dt><dd>'+(missingList.length?esc(missingList.join('; ')):'Nothing missing')+'</dd>'
    +(action?'<dt>Recommended action</dt><dd>'+esc(action)+'</dd>':'')
    +'</dl></div>';
  createPortal(html,{title:'WHY?'});
}

      (f.options||[]).forEach(function(o){
        const v=typeof o==='string'?o:o.value;
        const l=typeof o==='string'?o:o.label;
        body+='<option value="'+esc(v)+'"'+(f.value===v?' selected':'')+'>'+esc(l)+'</option>';
      });
      body+='</select>';
    } else if(f.type==='textarea'){
      body+='<textarea name="'+esc(f.name)+'"'+(f.required?' required':'')+'>'+esc(f.value||'')+'</textarea>';
    } else {
      body+='<input name="'+esc(f.name)+'" type="'+(f.type||'text')+'" value="'+esc(f.value||'')+'"'+(f.required?' required':'')+' />';
    }
    if(f.hint) body+='<span class="field-hint">'+esc(f.hint)+'</span>';
    body+='</label>';
  });
  body+='<div class="actions"><button type="submit" class="btn btn-primary">Save</button>'
    +'<button type="button" class="btn" data-close-modal>Cancel</button></div></form>';
  const portal=createPortal(body,{title:title});
  const form=document.getElementById('portalForm');
  form.addEventListener('submit',function(e){
    e.preventDefault();
    const fd=new FormData(form);
    const data={};
    fields.forEach(function(f){ data[f.name]=String(fd.get(f.name)||'').trim(); });
    portal.close();
    onSubmit(data);
  });
}

function openCreateAssumption(){
  promptForm('Create assumption',[
    {name:'title',label:'Assumption',required:true,type:'textarea'},
    {name:'key',label:'Key (optional)',hint:'Stable id used to link experiments'}
  ],function(data){
    if(!data.title) return;
    const key=data.key||('asm_'+Date.now().toString(36));
    const prog=activeProgram();
    state.assumptions.unshift({
      id:uid('asm'),key:key,title:data.title,status:'testing',
      confidence:'insufficient',programId:prog&&prog.id||null,createdAt:nowISO()
    });
    logActivity('Created assumption');
    scheduleSave(); render(); toast('Assumption created — confidence stays insufficient until experiments meet target');
  });

function openCreateExperiment(){
  const asmOpts=state.assumptions.map(function(a){return {value:a.key,label:a.title};});
  if(!asmOpts.length){ toast('Create an assumption first'); return; }
  promptForm('Create experiment',[
    {name:'title',label:'Experiment title',required:true},
    {name:'assumptionKey',label:'Linked assumption',type:'select',options:asmOpts},
    {name:'targetCount',label:'Target evidence count',type:'number',value:'10',required:true}
  ],function(data){
    const target=Math.max(1,parseInt(data.targetCount,10)||1);
    const prog=activeProgram();
    state.experiments.unshift({
      id:uid('exp'),title:data.title,assumptionKey:data.assumptionKey,
      status:'active',targetCount:target,completedCount:0,
      programId:prog&&prog.id||null,method:'manual',createdAt:nowISO()
    });
    // Never auto-validate assumption
    const asm=state.assumptions.find(function(a){return a.key===data.assumptionKey;});
    if(asm){ asm.confidence='insufficient'; asm.status='testing'; }
    logActivity('Created experiment: '+data.title);
    scheduleSave(); render(); toast('Experiment created');
  });
}
function openCreateEvidence(){
  const expOpts=[{value:'',label:'— none —'}].concat(state.experiments.map(function(e){return {value:e.id,label:e.title};}));
  const prog=activeProgram();
  const reqOpts=[{value:'',label:'— none —'}].concat(
    ((prog&&prog.requirements)||[]).map(function(r){return {value:r.id,label:r.title};})
  );
  promptForm('Add evidence',[
    {name:'title',label:'Title / summary',required:true},
    {name:'type',label:'Type',type:'select',options:['interview','document','metric','meeting','manual']},
    {name:'experimentId',label:'Link to experiment',type:'select',options:expOpts},
    {name:'requirementId',label:'Link to requirement',type:'select',options:reqOpts},
    {name:'notes',label:'Notes',type:'textarea'}
  ],function(data){
    const ev={
      id:uid('ev'),title:data.title,type:data.type||'manual',notes:data.notes||'',
      experimentId:data.experimentId||null,
      linkedExperimentIds:data.experimentId?[data.experimentId]:[],
      linkedRequirementIds:data.requirementId?[data.requirementId]:[],
      requirementKey:null,
      linkedAssumptionKeys:[],
      createdAt:nowISO()
    };
    if(data.requirementId && prog){
      const req=(prog.requirements||[]).find(function(r){return r.id===data.requirementId;});
      if(req){
        ev.requirementKey=req.key;
        if(req.linkedAssumptionKey) ev.linkedAssumptionKeys=[req.linkedAssumptionKey];
      }
    }
    if(data.experimentId){
      const exp=state.experiments.find(function(e){return e.id===data.experimentId;});
      if(exp && exp.assumptionKey) ev.linkedAssumptionKeys=[exp.assumptionKey];
      // bump completedCount but NEVER auto-validate assumption
      if(exp){
        const ep=experimentProgress(exp, Object.assign({},state,{evidence:state.evidence.concat([ev])}));
        exp.completedCount=ep.count;
        const asm=state.assumptions.find(function(a){return a.key===exp.assumptionKey;});
        if(asm){
          asm.confidence=ep.complete?'sufficient_to_decide':'insufficient';
          // status stays testing — founder must decide
        }
      }
    }
    state.evidence.unshift(ev);
    syncMetricFromEvidence();
    logActivity('Added evidence: '+data.title);
    scheduleSave(); render(); toast('Evidence added');
  });
}

function renderStrategy(){
  let html='<div class="page-head"><div><h2>Strategy map</h2><p>Vision → outcome chain. Click a node to edit.</p></div></div>';
  if(!state.strategyNodes.length){
    html+='<div class="empty"><strong>No strategy nodes</strong>Apply E3 / PAVE to generate a vertical strategy graph.</div>';
    return html;
  }
  const nodes=state.strategyNodes;
  const edges=state.strategyEdges||[];
  const maxY=Math.max.apply(null, nodes.map(function(n){return n.y||0;}))+80;
  const width=360;
  const height=maxY;

  let svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'">';
  edges.forEach(function(e){
    const a=nodes.find(function(n){return n.id===e.from;});
    const b=nodes.find(function(n){return n.id===e.to;});
    if(!a||!b) return;
    const x1=(a.x||40)+140, y1=(a.y||0)+28, x2=(b.x||40)+140, y2=(b.y||0)+8;
    svg+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="rgba(184,204,220,.28)" stroke-width="2"/>';
  });
  nodes.forEach(function(n){
    const x=n.x||40, y=n.y||0;
    const sel=ui.selectedNodeId===n.id;
    svg+='<g class="node-hit" data-node="'+esc(n.id)+'" transform="translate('+x+','+y+')">'
      +'<rect width="280" height="56" rx="10" fill="'+(sel?'#243447':'#1c2a3c')+'" stroke="'+(sel?'#f0b429':'rgba(184,204,220,.2)')+'" stroke-width="1.5"/>'
      +'<text x="14" y="22" fill="#f0b429" font-size="11" font-weight="700">'+esc(n.label||n.type)+'</text>'
      +'<text x="14" y="42" fill="#e8eef4" font-size="12">'+esc((n.text||'').slice(0,42))+((n.text||'').length>42?'…':'')+'</text>'
      +'</g>';
  });
  svg+='</svg>';
  html+='<div class="strategy-wrap">'+svg+'</div>';
  if(ui.selectedNodeId){
    const n=nodes.find(function(x){return x.id===ui.selectedNodeId;});
    if(n){
      html+='<div class="panel" style="margin-top:14px"><h3>Edit node</h3><div class="form-grid">'
        +'<label>Label<input id="nodeLabel" value="'+esc(n.label||'')+'"/></label>'
        +'<label>Text<textarea id="nodeText">'+esc(n.text||'')+'</textarea></label>'
        +'<button type="button" class="btn btn-primary" data-save-node="'+esc(n.id)+'">Save node</button>'
        +'</div></div>';
    }
  }
  return html;
}

function setView(id){
  ui.view=id;
  try{
    const u=new URL(location.href);
    if(id==='overview') u.searchParams.delete('tab');
    else u.searchParams.set('tab', id);
    history.replaceState(null,'',u);
  }catch(e){}
  document.getElementById('moreSheet').classList.remove('open');
  document.getElementById('moreSheet').hidden=true;
  render();
}

/* ---------- 14. Event wiring ---------- */
function setNested(obj, path, value){
  const parts=path.split('.');
  let cur=obj;
  for(let i=0;i<parts.length-1;i++){
    if(!cur[parts[i]] || typeof cur[parts[i]]!=='object') cur[parts[i]]={};
    cur=cur[parts[i]];
  }
  cur[parts[parts.length-1]]=value;
}

document.addEventListener('click', function(e){
  const t=e.target.closest('[data-nav],[data-action],[data-why],[data-task-done],[data-del-task],[data-del-goal],[data-goal-status],[data-del-evidence],[data-select-program],[data-save-pave],[data-node],[data-save-node],[data-accept-rec],[data-decline-rec],[data-del-advisor],[data-update-metric],[data-close-more],[data-share]');
  if(!t) {
    // bottom nav handled below
  }

  const bn=e.target.closest('.bottom-nav [data-view]');
  if(bn){ setView(bn.getAttribute('data-view')); return; }
  const bnAct=e.target.closest('.bottom-nav [data-action]');
  if(bnAct){
    const a=bnAct.getAttribute('data-action');
    if(a==='quickadd') quickAddMenu();
    if(a==='more'){
      const sheet=document.getElementById('moreSheet');
      renderMoreSheet();
      sheet.hidden=false;
      sheet.classList.add('open');
    }
    return;
  }
  if(e.target.closest('[data-close-more]') || e.target.id==='moreSheet'){
    if(e.target.id==='moreSheet' || e.target.closest('[data-close-more]')){
      document.getElementById('moreSheet').classList.remove('open');
      document.getElementById('moreSheet').hidden=true;
    }
  }

  const nav=e.target.closest('[data-nav]');
  if(nav){ setView(nav.getAttribute('data-nav')); return; }

  const why=e.target.closest('[data-why]');
  if(why){ showWhy(why.getAttribute('data-why')); return; }

  const act=e.target.closest('[data-action]');
  if(act){
    const a=act.getAttribute('data-action');
    if(a==='start-business'){
      promptForm('Start your business',[
        {name:'name',label:'Business name',required:true},
        {name:'founder',label:'Founder name',required:true,value:'Founder'}
      ],function(d){ startBusiness(d.name,d.founder); });
    }
    if(a==='apply-e3' || a==='apply-e3-onboard'){
      if(!state.business){
        promptForm('Apply E3 / PAVE',[
          {name:'name',label:'Business name',required:true},
          {name:'founder',label:'Founder name',required:true,value:'Founder'}
        ],function(d){
          startBusiness(d.name,d.founder);
          applyE3Template({businessName:d.name,founderName:d.founder});
          setView('programs');
        });
      } else {
        applyE3Template();
        setView('programs');
      }
    }
    if(a==='import-stub') toast('Import is Phase 2 — not built yet');
    if(a==='quickadd') quickAddMenu();
    if(a==='create-task') openCreateTask();
    if(a==='create-goal') openCreateGoal();
    if(a==='create-evidence') openCreateEvidence();
    if(a==='create-assumption') openCreateAssumption();
    if(a==='create-experiment') openCreateExperiment();
    if(a==='create-task-from-rec') openCreateTask({title:act.getAttribute('data-payload')||''});
    if(a==='create-metric'){
      promptForm('Add metric',[
        {name:'name',label:'Name',required:true},
        {name:'target',label:'Target',type:'number',value:'1'},
        {name:'current',label:'Current',type:'number',value:'0'},
        {name:'unit',label:'Unit',value:'count'}
      ],function(d){
        state.metrics.push({
          id:uid('met'),key:uid('key'),name:d.name,category:'manual',
          current:Number(d.current)||0,target:Number(d.target)||1,unit:d.unit||'count',
          source:'manual',sharedWithAdvisors:true,updatedAt:nowISO()
        });
        scheduleSave(); render(); toast('Metric added');
      });
    }
    if(a==='invite-advisor'){
      const form=document.getElementById('inviteAdvisor');
      if(!form) return;
      const name=form.querySelector('[name=name]').value.trim();
      const email=form.querySelector('[name=email]').value.trim();
      const role=form.querySelector('[name=role]').value;
      if(!name||!email){ toast('Name and email required'); return; }
      const advisor={
        id:uid('adv'),name:name,email:email,role:role,
        share:Object.assign({}, (state.config&&state.config.mentorShareDefaults)||{}),
        invitedAt:nowISO()
      };
      if(remoteSyncEnabled){
        postStudioApi('/api/business-studio/advisors',{name:name,email:email,role:role,share:advisor.share})
          .then(function(data){
            if(data.advisors) state.advisors=data.advisors;
            else state.advisors.unshift(advisor);
            persistLocal(); render(); toast('Advisor invited');
          })
          .catch(function(err){ toast(err.message||'Invite failed'); });
        return;
      }
      state.advisors.push(advisor);
      logActivity('Invited advisor '+name);
      scheduleSave(); render(); toast('Advisor invited');
    }
    if(a==='add-recommendation'){
      const title=(document.getElementById('recTitle')||{}).value||'';
      const body=(document.getElementById('recBody')||{}).value||'';
      if(!title.trim()){ toast('Title required'); return; }
      if(remoteSyncEnabled){
        postStudioApi('/api/business-studio/recommendations',{title:title.trim(),body:body.trim()})
          .then(function(data){
            if(data.recommendation) state.recommendations.unshift(data.recommendation);
            persistLocal(); render(); toast('Recommendation added');
          })
          .catch(function(err){ toast(err.message||'Recommendation failed'); });
        return;
      }
      state.recommendations.unshift({
        id:uid('rec'),title:title.trim(),body:body.trim(),
        advisorName:'Advisor',advisorEmail:'',status:'pending',
        toRole:'founder',createdAt:nowISO()
      });
      scheduleSave(); render(); toast('Recommendation added');
    }
    if(a==='save-business'){
      if(!state.business) return;
      state.business.name=(document.getElementById('setBizName')||{}).value||state.business.name;
      state.business.founderName=(document.getElementById('setFounderName')||{}).value||state.business.founderName;
      scheduleSave(); toast('Saved'); render();
    }
    if(a==='sync-now'){
      pushRemoteWorkspace().then(function(){ toast('Sync attempted'); }).catch(function(){ toast('Sync failed — local only'); });
    }
    if(a==='reset-workspace'){
      if(confirm('Reset local Business Studio workspace?')){
        state=emptyState();
        window.storage.removeItem('workspace');
        scheduleSave(); render(); toast('Workspace reset');
      }
    }
    return;
  }

  const td=e.target.closest('[data-task-done]');
  if(td){
    const id=td.getAttribute('data-task-done');
    const task=state.tasks.find(function(x){return x.id===id;});
    if(task){ task.status='done'; task.completedAt=nowISO(); scheduleSave(); render(); }
    return;
  }
  const dt=e.target.closest('[data-del-task]');
  if(dt){
    state.tasks=state.tasks.filter(function(x){return x.id!==dt.getAttribute('data-del-task');});
    scheduleSave(); render(); return;
  }
  const dg=e.target.closest('[data-del-goal]');
  if(dg){
    state.goals=state.goals.filter(function(x){return x.id!==dg.getAttribute('data-del-goal');});
    scheduleSave(); render(); return;
  }
  const gs=e.target.closest('[data-goal-status]');
  if(gs){
    const g=state.goals.find(function(x){return x.id===gs.getAttribute('data-goal-status');});
    if(g){ g.status=gs.getAttribute('data-status')||'done'; scheduleSave(); render(); }
    return;
  }
  const de=e.target.closest('[data-del-evidence]');
  if(de){
    state.evidence=state.evidence.filter(function(x){return x.id!==de.getAttribute('data-del-evidence');});
    syncMetricFromEvidence();
    scheduleSave(); render(); return;
  }
  const sp=e.target.closest('[data-select-program]');
  if(sp){
    ui.selectedProgramId=sp.getAttribute('data-select-program');
    const p=state.programs.find(function(x){return x.id===ui.selectedProgramId;});
    state.programs.forEach(function(x){ x.status = (p && x.id===p.id) ? 'active' : (x.status==='active'?'paused':x.status); });
    scheduleSave(); render(); return;
  }
  const savePave=e.target.closest('[data-save-pave]');
  if(savePave){
    const pid=savePave.getAttribute('data-save-pave');
    const prog=state.programs.find(function(x){return x.id===pid;});
    const wrap=document.querySelector('[data-pave-program="'+pid+'"]');
    if(prog && wrap){
      if(!prog.pave) prog.pave={};
      wrap.querySelectorAll('[data-pave]').forEach(function(inp){
        setNested(prog.pave, inp.getAttribute('data-pave'), inp.value);
      });
      scheduleSave(); toast('PAVE saved');
    }
    return;
  }
  const node=e.target.closest('[data-node]');
  if(node){
    ui.selectedNodeId=node.getAttribute('data-node');
    render(); return;
  }
  const sn=e.target.closest('[data-save-node]');
  if(sn){
    const n=state.strategyNodes.find(function(x){return x.id===sn.getAttribute('data-save-node');});
    if(n){
      n.label=(document.getElementById('nodeLabel')||{}).value||n.label;
      n.text=(document.getElementById('nodeText')||{}).value||n.text;
      scheduleSave(); toast('Node saved'); render();
    }
    return;
  }
  const ar=e.target.closest('[data-accept-rec]');
  if(ar){
    const id=ar.getAttribute('data-accept-rec');
    const r=state.recommendations.find(function(x){return x.id===id;});
    if(!r) return;
    if(remoteSyncEnabled){
      postStudioApi('/api/business-studio/recommendations/respond',{id:id,decision:'accepted'})
        .then(function(data){
          r.status='accepted';
          if(data.task) state.tasks.unshift(data.task);
          persistLocal(); render(); toast('Accepted — task created');
        })
        .catch(function(err){ toast(err.message||'Accept failed'); });
      return;
    }
    r.status='accepted';
    state.tasks.unshift({
      id:uid('task'),title:r.title,status:'todo',priority:'medium',due:null,
      source:'mentor_recommendation',recommendationId:r.id,createdAt:nowISO(),
      notes:r.body
    });
    logActivity('Accepted mentor recommendation');
    scheduleSave(); render(); toast('Accepted — task created');
    return;
  }
  const dr=e.target.closest('[data-decline-rec]');
  if(dr){
    const id=dr.getAttribute('data-decline-rec');
    const r=state.recommendations.find(function(x){return x.id===id;});
    if(!r) return;
    if(remoteSyncEnabled){
      postStudioApi('/api/business-studio/recommendations/respond',{id:id,decision:'declined'})
        .then(function(){
          r.status='declined'; persistLocal(); render(); toast('Declined');
        })
        .catch(function(err){ toast(err.message||'Decline failed'); });
      return;
    }
    r.status='declined'; scheduleSave(); render(); toast('Declined');
    return;
  }
  const da=e.target.closest('[data-del-advisor]');
  if(da){
    state.advisors=state.advisors.filter(function(x){return x.id!==da.getAttribute('data-del-advisor');});
    scheduleSave(); render(); return;
  }
  const um=e.target.closest('[data-update-metric]');
  if(um){
    const m=state.metrics.find(function(x){return x.id===um.getAttribute('data-update-metric');});
    if(!m) return;
    promptForm('Update metric',[
      {name:'current',label:'Current value',type:'number',value:String(m.current),required:true}
    ],function(d){
      m.current=Number(d.current)||0;
      m.updatedAt=nowISO();
      scheduleSave(); render(); toast('Metric updated');
    });
    return;
  }
});

document.addEventListener('change', function(e){
  if(e.target && e.target.id==='advisorModeToggle'){
    state.config=state.config||emptyConfig();
    state.config.advisorMode=!!e.target.checked;
    try{
      const u=new URL(location.href);
      if(state.config.advisorMode) u.searchParams.set('view','advisor');
      else u.searchParams.delete('view');
      history.replaceState(null,'',u);
    }catch(err){}
    scheduleSave(); render();
  }
  if(e.target && e.target.id==='setAdvisorMode'){
    state.config=state.config||emptyConfig();
    state.config.advisorMode=!!e.target.checked;
    scheduleSave(); render();
  }
  const share=e.target.closest('[data-share]');
  if(share && e.target.matches('input[type=checkbox]')){
    const id=share.getAttribute('data-share');
    const key=share.getAttribute('data-key');
    const adv=state.advisors.find(function(a){return a.id===id;});
    if(adv){
      adv.share=adv.share||{};
      adv.share[key]=!!e.target.checked;
      scheduleSave();
    }
  }
});

/* ---------- 15. Boot ---------- */
(function boot(){
  loadLocal();
  try{
    const q=new URLSearchParams(location.search);
    if(q.get('tab') && NAV.some(function(n){return n.id===q.get('tab');})) ui.view=q.get('tab');
    if(q.get('view')==='advisor'){
      state.config=state.config||emptyConfig();
      state.config.advisorMode=true;
      ui.view='mentors';
    }
  }catch(e){}
  render();
  bootstrapSync().then(function(){ render(); }).catch(function(){});
})();
</script>
</body>
