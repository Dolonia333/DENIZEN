<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Business Studio · Founder OS · Denizen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --canvas:#E6E3D8;
  --bg:#E6E3D8;
  --bg-2:#F4F1E8;
  --surface:#FBF9F3;
  --surface-2:#F3F0E6;
  --surface-3:#EAE6DA;
  --ink:#10231C;
  --ink-2:#33463E;
  --muted:#5C6E64;
  --muted-2:#8A9A90;
  --line:rgba(16,35,28,.12);
  --line-2:rgba(16,35,28,.06);
  --gold:#B8871B;
  --gold-dim:rgba(184,135,27,.12);
  --gold-press:#946C12;
  --forest:#2A6A55;
  --forest-2:#163A2F;
  --forest-tint:rgba(42,106,85,.11);
  --forest-deep:#0D1F1A;
  --danger:#C94F38;
  --danger-tint:rgba(201,79,56,.12);
  --warn:#C4841D;
  --ok:#2F7A5B;
  --info:#3F6FA8;
  --font-ui:'Figtree',ui-sans-serif,system-ui,sans-serif;
  --font-display:'Syne',ui-sans-serif,system-ui,sans-serif;
  --font-sheet:'Arimo','Arial','Helvetica Neue',Helvetica,sans-serif;
  --shadow:0 1px 2px rgba(16,35,28,.05),0 8px 24px rgba(16,35,28,.06);
  --shadow-lift:0 10px 30px rgba(16,35,28,.10),0 2px 8px rgba(16,35,28,.05);
  --shadow-modal:0 28px 70px rgba(16,35,28,.28),0 8px 20px rgba(16,35,28,.10);
  --radius:14px;
  --sidebar-w:248px;
  --bottom-nav-h:64px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--canvas)}
body{
  font-family:var(--font-ui);color:var(--ink);
  background:
    radial-gradient(900px 480px at 0% -8%, rgba(42,106,85,.14), transparent 55%),
    radial-gradient(700px 420px at 100% 0%, rgba(184,135,27,.10), transparent 50%),
    linear-gradient(180deg, #EDEADE 0%, var(--canvas) 42%, #DDD8C8 100%);
  background-attachment:fixed;
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100vh;min-height:100dvh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/%3E%3C/svg%3E");
  mix-blend-mode:multiply;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{
  font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;
  transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 3px var(--forest-tint)}
textarea{min-height:92px;resize:vertical}
:focus-visible{outline:2px solid var(--forest);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== App chrome ===== */
.dz-app-chrome,.shell,.toast-wrap,.bottom-nav,.more-sheet,.modal-backdrop{position:relative;z-index:1}
.dz-app-chrome{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));
  background:rgba(13,31,26,.94);color:#F4F2EA;
  border-bottom:1px solid rgba(13,31,26,.4);
  -webkit-backdrop-filter:saturate(140%) blur(16px);backdrop-filter:saturate(140%) blur(16px)}
.dz-app-chrome a{
  color:#F4F2EA;text-decoration:none;font-size:12.5px;font-weight:600;
  padding:7px 12px;border-radius:980px;border:1px solid rgba(244,242,234,.18);white-space:nowrap;
  transition:background .15s var(--ease), border-color .15s var(--ease)
}
.dz-app-chrome a:hover{background:rgba(244,242,234,.08);border-color:rgba(244,242,234,.35)}
.dz-app-chrome .dz-app-title{
  display:flex;flex-direction:column;gap:1px;min-width:0;margin-left:2px
}
.dz-app-chrome .dz-app-title strong{
  font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:-.03em;
  color:#F4F2EA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.dz-app-chrome .dz-app-title span{font-size:11px;color:#8FAE9F;letter-spacing:.02em}
.dz-app-chrome .dz-app-spacer{flex:1;min-width:8px}
html.embed .dz-app-chrome{display:none}

/* ===== Shell ===== */
.shell{display:flex;min-height:calc(100vh - 52px);min-height:calc(100dvh - 52px)}
.sidebar{
  width:var(--sidebar-w);flex:none;
  background:linear-gradient(180deg, rgba(251,249,243,.92), rgba(243,240,230,.88));
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 14px 24px;gap:2px;
  position:sticky;top:52px;height:calc(100vh - 52px);height:calc(100dvh - 52px);overflow:auto;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)
}
.side-brand{padding:6px 10px 18px;margin-bottom:8px;border-bottom:1px solid var(--line-2)}
.side-brand .mark{
  width:36px;height:36px;border-radius:11px;margin-bottom:12px;
  background:var(--forest-deep);display:grid;place-items:center;
  box-shadow:var(--shadow)
}
.side-brand .mark i{
  width:14px;height:14px;border-radius:4px;
  background:conic-gradient(from 210deg, #2A6A55, #B8871B, #8FAE9F, #2A6A55);
  display:block
}
.side-brand h1{
  margin:0;font-size:18px;font-weight:750;letter-spacing:-.04em;color:var(--ink);
  font-family:var(--font-display);line-height:1.1
}
.side-brand small{display:block;color:var(--muted);font-size:12px;margin-top:4px;letter-spacing:.01em}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;
  color:var(--ink-2);font-size:13.5px;font-weight:550;text-align:left;width:100%;
  transition:background .15s var(--ease), color .15s var(--ease), transform .15s var(--ease);
  position:relative
}
.nav-item:hover{background:rgba(42,106,85,.08);color:var(--ink)}
.nav-item.active{
  background:var(--forest-tint);color:var(--forest-2);font-weight:650;
  box-shadow:inset 3px 0 0 var(--forest)
}
.nav-item .ico{
  width:22px;height:22px;border-radius:7px;display:grid;place-items:center;
  background:rgba(16,35,28,.05);font-size:12px;opacity:.9;flex:none
}
.nav-item.active .ico{background:rgba(42,106,85,.16)}
.nav-sec{
  font-size:10px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted-2);padding:16px 11px 6px;font-family:var(--font-display)
}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.main-scroll{
  flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:28px clamp(16px,3vw,36px) 48px;
}
.main-scroll.page-enter{animation:pageIn .38s var(--ease) both}
@keyframes pageIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-kicker{
  font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--forest);margin:0 0 8px
}
.page-head h2{
  margin:0;font-size:clamp(26px,3vw,34px);font-weight:750;letter-spacing:-.045em;
  font-family:var(--font-display);line-height:1.08;color:var(--forest-deep)
}
.page-head p{margin:8px 0 0;color:var(--muted);font-size:14.5px;max-width:54ch;line-height:1.45}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 15px;border-radius:980px;font-size:13px;font-weight:650;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  transition:transform .12s var(--ease), background .12s var(--ease), border-color .12s var(--ease), box-shadow .12s var(--ease);
  white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.55) inset
}
.btn:hover{border-color:rgba(16,35,28,.22);background:#fff;transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:none}
.btn-primary{background:var(--forest);color:#F4F2EA;border-color:var(--forest);box-shadow:none}
.btn-primary:hover{background:var(--forest-2);border-color:var(--forest-2);color:#F4F2EA}
.btn-forest{background:var(--forest-deep);color:#F4F2EA;border-color:var(--forest-deep);box-shadow:none}
.btn-forest:hover{background:#163A2F;border-color:#163A2F;color:#F4F2EA}
.btn-ghost{background:transparent;box-shadow:none}
.btn-danger{background:var(--danger-tint);color:#9A3424;border-color:rgba(201,79,56,.28)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-why{color:var(--gold-press);border-color:rgba(184,135,27,.35);background:var(--gold-dim);font-size:11.5px;padding:5px 10px}

.panel{
  background:linear-gradient(180deg, rgba(251,249,243,.96), rgba(243,240,230,.9));
  border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;
  box-shadow:var(--shadow);position:relative;overflow:hidden
}
.panel::before{
  content:"";position:absolute;left:0;top:0;right:0;height:2px;
  background:linear-gradient(90deg, rgba(42,106,85,.55), rgba(184,135,27,.35), transparent 70%);
  opacity:.7
}
.panel h3{margin:0 0 12px;font-size:13px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-family:var(--font-display)}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:980px){.grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

.health-card{
  padding:16px 16px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);box-shadow:var(--shadow);
  transition:transform .18s var(--ease), box-shadow .18s var(--ease)
}
.health-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.health-card .hc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.health-card .hc-name{font-weight:700;font-size:14px;font-family:var(--font-display);letter-spacing:-.02em}
.health-card .hc-reason{color:var(--ink-2);font-size:13px;line-height:1.45}

/* Funding Readiness checklist board */
.fr-board{padding:20px 20px 18px}
.fr-board-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.fr-kicker{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--forest);font-family:var(--font-display)}
.fr-rule{height:2px;margin-top:10px;background:linear-gradient(90deg,rgba(42,106,85,.55),transparent);max-width:280px;border-radius:2px}
.fr-section{margin:0 0 18px}
.fr-sec-title{font-size:11px;font-weight:750;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;font-family:var(--font-display)}
.fr-row{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;width:100%;
  padding:9px 4px;border:0;border-bottom:1px dotted rgba(16,35,28,.12);
  background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;
  transition:background .12s var(--ease)
}
.fr-row:hover{background:rgba(42,106,85,.05)}
.fr-title{font-size:14px;color:var(--ink);flex:1;min-width:0}
.fr-status{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.fr-complete .fr-status{color:var(--ok)}
.fr-needs_work .fr-status{color:var(--warn)}
.fr-not_started .fr-status{color:var(--muted-2)}
.fr-overall{margin-top:8px;padding-top:14px;border-top:1px solid var(--line)}
.fr-overall-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.fr-overall-grid .fr-n{display:block;font-size:26px;font-weight:800;letter-spacing:-.04em;color:var(--forest);font-family:var(--font-display)}
@media (max-width:640px){
  .fr-overall-grid{grid-template-columns:1fr}
  .fr-row{padding:10px 0}
}

/* Nested TAM / SAM / SOM diagram */
.ms-nest{display:flex;justify-content:center;padding:8px 0 18px}
.ms-tam,.ms-sam,.ms-som{
  border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative
}
.ms-tam{background:rgba(184,135,27,.08);width:min(100%,420px)}
.ms-sam{background:rgba(42,106,85,.10);margin:14px 10px 4px;width:auto}
.ms-som{background:rgba(47,122,91,.16);margin:12px 8px 2px}
.ms-label{font-size:11px;font-weight:750;letter-spacing:.08em;color:var(--forest);font-family:var(--font-display)}
.ms-value{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:4px;font-family:var(--font-display)}
.ms-hint{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.35}
.jenny-box{border:1px solid rgba(184,135,27,.28);background:rgba(184,135,27,.07);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.jenny-box h3{margin:0 0 8px;font-size:13px;color:var(--gold-press);font-family:var(--font-display)}
.jenny-box li{margin:0 0 6px;color:var(--ink-2);font-size:13px;line-height:1.4}
.moat-flow{display:grid;gap:8px;margin:12px 0}
.moat-flow .step{padding:12px 14px;border-left:3px solid var(--forest);background:var(--surface);border-radius:0 12px 12px 0}
.moat-flow .step .k{font-size:10px;letter-spacing:.08em;font-weight:750;color:var(--muted);font-family:var(--font-display)}
.pathway-rail{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.pathway-rail .step{
  padding:7px 12px;border-radius:980px;border:1px solid var(--line);font-size:12px;font-weight:650;color:var(--muted)
}
.pathway-rail .step.on{border-color:var(--forest);color:var(--forest);background:var(--forest-tint)}
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.check-grid label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.dr-sec{margin-bottom:12px}
.dr-sec h3{display:flex;justify-content:space-between;gap:8px;align-items:center}
.status{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:980px;
  font-size:11px;font-weight:700;text-transform:capitalize;letter-spacing:.01em
}
.status::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.status-on_track,.status-complete,.status-done,.status-accepted{color:var(--ok);background:rgba(47,122,91,.12)}
.status-needs_attention,.status-blocked,.status-declined{color:#9A3424;background:var(--danger-tint)}
.status-in_progress,.status-active,.status-testing,.status-pending{color:var(--gold-press);background:var(--gold-dim)}
.status-unknown,.status-not_started,.status-todo{color:var(--muted);background:rgba(92,110,100,.12)}
.status-insufficient{color:#9A3424;background:var(--danger-tint)}
.status-sufficient_to_decide{color:var(--ok);background:rgba(47,122,91,.12)}

.list{display:flex;flex-direction:column;gap:8px}
.row-item{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:13px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);
  transition:border-color .15s var(--ease), box-shadow .15s var(--ease)
}
.row-item:hover{border-color:var(--line);box-shadow:var(--shadow)}
.row-item .rt{font-weight:650;font-size:14px;letter-spacing:-.015em}
.row-item .rm{color:var(--muted);font-size:12.5px;margin-top:3px}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;flex:none}

.empty{
  padding:32px 20px;text-align:center;color:var(--muted);border:1px dashed rgba(16,35,28,.18);
  border-radius:var(--radius);background:rgba(251,249,243,.55)
}
.empty strong{display:block;color:var(--ink-2);margin-bottom:6px;font-size:15px;font-family:var(--font-display)}
.stub-phase2{
  padding:36px 22px;text-align:center;border:1px dashed rgba(42,106,85,.35);
  border-radius:var(--radius);background:rgba(42,106,85,.05);color:var(--ink-2)
}
.stub-phase2 h3{margin:0 0 8px;color:var(--forest);font-size:17px;font-family:var(--font-display)}
.form-grid{display:grid;gap:12px;margin-top:12px}
.form-grid label{display:grid;gap:6px;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.form-row{grid-template-columns:1fr}}
.field-hint{font-size:12px;color:var(--muted);font-weight:400}

.progress-bar{height:10px;border-radius:999px;background:rgba(16,35,28,.08);overflow:hidden;border:1px solid var(--line-2)}
.progress-bar > span{
  display:block;height:100%;
  background:linear-gradient(90deg,var(--forest), #4C8F73 55%, var(--gold));
  border-radius:999px;transition:width .5s var(--ease)
}
.meta-line{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px;margin-top:8px}

/* Roadmap stages */
.stage-rail{display:flex;gap:0;overflow-x:auto;padding:8px 0 4px;-webkit-overflow-scrolling:touch}
.stage-node{
  flex:1 0 128px;min-width:118px;position:relative;padding:16px 14px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);text-align:left;
  transition:transform .15s var(--ease), background .15s var(--ease), border-color .15s var(--ease)
}
.stage-node:first-child{border-radius:12px 0 0 12px}
.stage-node:last-child{border-radius:0 12px 12px 0}
.stage-node:hover,.stage-node:focus{background:#fff;z-index:1;transform:translateY(-2px)}
.stage-node .sn-name{font-weight:700;font-size:13.5px;font-family:var(--font-display);letter-spacing:-.02em}
.stage-node .sn-status{margin-top:8px}
.stage-node.complete{border-color:rgba(47,122,91,.4);background:rgba(47,122,91,.08)}
.stage-node.active{border-color:rgba(42,106,85,.5);background:var(--forest-tint)}

/* Strategy SVG */
.strategy-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);max-height:70vh;box-shadow:var(--shadow)}
.strategy-wrap svg{display:block;min-width:320px}
.strategy-wrap .node-hit{cursor:pointer}
.strategy-wrap .node-hit:hover rect{stroke:var(--forest)}

/* Copilot */
.copilot{
  border:1px solid rgba(42,106,85,.22);
  background:
    linear-gradient(135deg, rgba(42,106,85,.10), rgba(184,135,27,.06) 55%, rgba(251,249,243,.9));
  border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)
}
.copilot .cp-label{
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--forest);margin-bottom:8px;font-family:var(--font-display)
}
.copilot .cp-body{font-size:15px;line-height:1.5;color:var(--ink)}
.copilot .cp-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* Toggle */
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.toggle input{width:auto;accent-color:var(--forest)}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;z-index:100;background:rgba(13,31,26,.55);
  display:flex;align-items:center;justify-content:center;padding:16px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  animation:fadeIn .18s ease
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-backdrop[hidden]{display:none!important}
.modal{
  width:min(520px,100%);max-height:min(88vh,720px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow-modal);padding:22px 22px;animation:pageIn .28s var(--ease)
}
.modal h3{margin:0 0 8px;font-size:20px;letter-spacing:-.03em;font-family:var(--font-display)}
.modal .why-block{margin-top:12px;padding:14px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line-2)}
.modal .why-block dt{font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:10px;font-family:var(--font-display)}
.modal .why-block dt:first-child{margin-top:0}
.modal .why-block dd{margin:4px 0 0;color:var(--ink-2);font-size:13.5px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* Toast */
.toast-wrap{position:fixed;bottom:24px;right:16px;z-index:120;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  pointer-events:auto;padding:12px 14px;border-radius:12px;background:var(--forest-deep);color:#F4F2EA;
  border:1px solid rgba(244,242,234,.12);box-shadow:var(--shadow-lift);font-size:13px;max-width:320px;
  animation:pageIn .28s var(--ease)
}
@media(max-width:720px){.toast-wrap{bottom:calc(var(--bottom-nav-h) + 16px + env(safe-area-inset-bottom,0px));left:12px;right:12px}}

/* Onboarding */
.welcome-shell{
  min-height:min(78vh,720px);display:grid;place-items:center;padding:12px 0 28px
}
.welcome{
  width:min(640px,100%);padding:0;border-radius:22px;overflow:hidden;text-align:left;
  border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-lift);
  animation:pageIn .45s var(--ease)
}
.welcome-hero{
  padding:34px 32px 28px;color:#F4F2EA;
  background:
    radial-gradient(500px 220px at 90% 0%, rgba(184,135,27,.28), transparent 55%),
    linear-gradient(145deg, #0D1F1A 0%, #163A2F 48%, #2A6A55 100%);
}
.welcome-hero .eyebrow{
  font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:#8FAE9F;margin:0 0 14px
}
.welcome-hero h2{
  margin:0;font-size:clamp(30px,5vw,40px);letter-spacing:-.045em;line-height:1.05;
  font-family:var(--font-display);font-weight:800;color:#F4F2EA
}
.welcome-hero p{color:rgba(244,242,234,.78);margin:12px 0 0;font-size:15px;max-width:38ch;line-height:1.5}
.welcome-body{padding:22px 28px 28px}
.welcome-body .actions{justify-content:flex-start;margin-top:4px}
.welcome-body .field-hint{margin-top:16px}

/* Overview hero band */
.overview-hero{
  display:grid;grid-template-columns:1.4fr .9fr;gap:16px;margin-bottom:18px
}
@media(max-width:900px){.overview-hero{grid-template-columns:1fr}}
.overview-hero .hero-copy{
  padding:26px 26px 24px;border-radius:20px;border:1px solid rgba(244,242,234,.08);
  background:
    radial-gradient(420px 180px at 100% 0%, rgba(184,135,27,.22), transparent 55%),
    linear-gradient(145deg, #0D1F1A, #1A3D32 60%, #245A48);
  color:#F4F2EA;box-shadow:var(--shadow-lift);min-height:180px
}
.overview-hero .hero-copy .page-kicker{color:#8FAE9F}
.overview-hero .hero-copy h2{color:#F4F2EA;font-size:clamp(28px,3.4vw,36px)}
.overview-hero .hero-copy p{color:rgba(244,242,234,.72);margin-top:10px}
.overview-hero .hero-stat{
  padding:22px;border-radius:20px;border:1px solid var(--line);background:var(--surface);
  box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;gap:16px
}
.overview-hero .hero-stat .big{
  font-family:var(--font-display);font-size:42px;font-weight:800;letter-spacing:-.05em;color:var(--forest-deep);line-height:1
}
.overview-hero .hero-stat .label{color:var(--muted);font-size:13px;margin-top:6px}

/* Bottom nav (mobile) */
.bottom-nav{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:45;
  height:calc(var(--bottom-nav-h) + env(safe-area-inset-bottom,0px));
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  background:rgba(251,249,243,.94);border-top:1px solid var(--line);
  grid-template-columns:repeat(5,1fr);gap:2px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)
}
.bn-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;font-weight:650;color:var(--muted);border-radius:12px;padding:4px 2px;touch-action:manipulation
}
.bn-item.active{color:var(--forest);background:var(--forest-tint)}
.bn-item .bn-ico{font-size:16px;line-height:1}
.bn-plus{
  width:44px;height:44px;border-radius:50%;background:var(--forest);color:#F4F2EA;
  display:grid;place-items:center;font-size:24px;font-weight:700;margin:-10px auto 0;
  box-shadow:0 6px 16px rgba(42,106,85,.28)
}
.more-sheet{
  position:fixed;inset:0;z-index:60;background:rgba(13,31,26,.45);display:none;align-items:flex-end
}
.more-sheet.open{display:flex}
.more-panel{
  width:100%;max-height:78vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;
  border:1px solid var(--line);padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));
}
.more-panel h3{margin:0 0 10px;font-size:16px;font-family:var(--font-display)}
.more-panel .nav-item{padding:12px 10px}

.crm-frame{width:100%;height:min(70vh,640px);border:1px solid var(--line);border-radius:14px;background:var(--surface)}

/* ===== Lean Canvas (classic 9-box tablet) ===== */
.lean-wrap{display:flex;flex-direction:column;gap:12px}
.lean-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:12.5px}
.lean-meta strong{color:var(--forest);font-weight:700}
.lean-stage{
  width:100%;
  overflow:hidden;
  border-radius:16px;
  /* height filled by fitBoardToStage() on narrow screens */
}
.lean-canvas{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  grid-template-rows:minmax(160px,1.35fr) minmax(110px,.85fr) minmax(130px,1fr);
  gap:0;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  background:var(--line);
  min-height:min(72vh,720px);
  box-shadow:var(--shadow-lift);
  width:100%;
  transform-origin:top left;
}
.lean-cell{
  background:var(--surface);
  display:flex;flex-direction:column;min-height:0;min-width:0;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);
}
.lean-cell:nth-child(5n){border-right:none}
.lean-cell.lc-problem{grid-column:1;grid-row:1 / span 2}
.lean-cell.lc-solution{grid-column:2;grid-row:1}
.lean-cell.lc-metrics{grid-column:2;grid-row:2}
.lean-cell.lc-uvp{grid-column:3;grid-row:1 / span 2;background:linear-gradient(180deg,rgba(42,106,85,.10),var(--surface))}
.lean-cell.lc-unfair{grid-column:4;grid-row:1}
.lean-cell.lc-channels{grid-column:4;grid-row:2}
.lean-cell.lc-customers{grid-column:5;grid-row:1 / span 2}
.lean-cell.lc-cost{grid-column:1 / span 3;grid-row:3;border-bottom:none}
.lean-cell.lc-revenue{grid-column:4 / span 2;grid-row:3;border-bottom:none;border-right:none}
.lean-cell-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding:10px 12px 4px;flex:none
}
.lean-cell-head h3{
  margin:0;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--forest);font-family:var(--font-display)
}
.lean-cell-head span{font-size:10.5px;color:var(--muted-2);text-align:right;max-width:55%}
.lean-cell textarea{
  flex:1;min-height:0;border:none;border-radius:0;background:transparent;
  padding:4px 12px 12px;font-size:12.5px;line-height:1.45;resize:none;
  color:var(--ink)
}
.lean-cell textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--forest-tint)}
.lean-cell.lc-uvp textarea{font-size:13.5px;font-weight:550}
/* Mobile: keep classic 5×3 tablet — scale to fit so all 9 boxes stay in view (no card stack). */
@media (max-width:900px){
  .lean-fit-hint{
    display:block;font-size:11.5px;color:var(--muted);margin:0 0 6px;font-weight:600
  }
  .lean-stage{
    border:1px solid var(--line);
    box-shadow:var(--shadow-lift);
    background:var(--line);
  }
  .lean-canvas{
    width:820px;
    min-width:820px;
    min-height:540px;
    border:none;border-radius:0;box-shadow:none;
  }
  .lean-cell-head{padding:6px 8px 2px}
  .lean-cell-head h3{font-size:9.5px;letter-spacing:.04em}
  .lean-cell-head span{display:none}
  .lean-cell textarea{padding:2px 8px 8px;font-size:10.5px;line-height:1.35}
  .lean-cell.lc-uvp textarea{font-size:11px}
}
@media (min-width:901px){
  .lean-fit-hint{display:none}
}

/* ===== Living PAVE workbook ===== */
.pave-wrap{display:flex;flex-direction:column;gap:14px}
.pave-banner{
  padding:16px 18px;border-radius:var(--radius);border:1px solid rgba(42,106,85,.22);
  background:linear-gradient(135deg,rgba(42,106,85,.10), rgba(184,135,27,.06));
  box-shadow:var(--shadow)
}
.pave-banner strong{color:var(--forest)}
.pave-tabs{display:flex;gap:6px;flex-wrap:wrap}
.pave-tab{
  padding:9px 13px;border-radius:980px;border:1px solid var(--line);background:var(--surface);
  font-size:12.5px;font-weight:650;color:var(--ink-2);
  transition:background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease)
}
.pave-tab:hover{border-color:rgba(16,35,28,.22);color:var(--ink)}
.pave-tab.active{background:var(--forest-tint);border-color:rgba(42,106,85,.35);color:var(--forest-2)}
.pave-tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted-2);margin-right:6px}
.pave-tab.done .dot{background:var(--ok)}
.pave-tab.living .dot{background:var(--gold)}
.pave-section{padding:4px 2px 8px}
.pave-section-head{margin-bottom:14px}
.pave-section-head h3{margin:0 0 4px;font-size:20px;font-family:var(--font-display);letter-spacing:-.03em}
.pave-section-head p{margin:0;color:var(--muted);font-size:13.5px}
.pave-field{
  margin-bottom:14px;padding:14px 15px;border-radius:14px;border:1px solid var(--line-2);
  background:rgba(251,249,243,.75);transition:border-color .15s var(--ease), box-shadow .15s var(--ease)
}
.pave-field:focus-within{border-color:rgba(42,106,85,.35);box-shadow:0 0 0 3px var(--forest-tint)}
.pave-field-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.pave-field-head label{font-size:13px;font-weight:700;color:var(--ink-2);margin:0}
.pave-field textarea,.pave-field input{width:100%;background:#fff}
.pave-field.has-review{border-color:rgba(184,135,27,.4);box-shadow:inset 3px 0 0 var(--gold)}
.pave-reviews{margin-top:10px;display:grid;gap:8px}
.pave-review{
  padding:12px 13px;border-radius:12px;background:#fff;border:1px solid rgba(184,135,27,.25)
}
.pave-review .pr-kind{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-press);font-family:var(--font-display)}
.pave-review .pr-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.pave-review .pr-text{margin-top:6px;font-size:13.5px;color:var(--ink);line-height:1.45}
.pave-review.resolved{opacity:.65;border-color:var(--line)}
.pave-risk-table,.pave-market-table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:12.5px}
.pave-risk-table th,.pave-market-table th,.pave-risk-table td,.pave-market-table td{
  border:1px solid var(--line);padding:8px;vertical-align:top;background:var(--surface)
}
.pave-risk-table th,.pave-market-table th{background:var(--surface-2);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;font-family:var(--font-display)}
.pave-risk-table input,.pave-risk-table textarea,.pave-market-table input{
  width:100%;border:none;background:transparent;padding:4px;min-height:0;border-radius:0
}
.pave-risk-table textarea{min-height:56px}
.pave-living-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  background:var(--gold-dim);color:var(--gold-press);font-size:11px;font-weight:750}
.pave-discovery-bar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:14px 15px;margin-bottom:14px;border-radius:14px;border:1px dashed rgba(42,106,85,.3);
  background:rgba(42,106,85,.06)
}

/* Worksheet document contrast: Arial-family body vs app chrome */
.pave-sheet{
  font-family:var(--font-sheet);
  background:#F7F4EC;
  border:1px solid rgba(16,35,28,.14);
  border-radius:18px;
  padding:18px 18px 22px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), var(--shadow);
}
.pave-sheet .pave-section-head h3{
  font-family:var(--font-sheet);font-weight:700;letter-spacing:-.01em;text-transform:none;font-size:22px;color:#1B2A4A
}
.pave-sheet .pave-section-head p{font-family:var(--font-sheet);color:#4A5568}
.pave-sheet .pave-field{
  background:#FFFEFA;border-color:rgba(27,42,74,.12);border-radius:4px;padding:12px 12px 10px
}
.pave-sheet .pave-field-head label{
  font-family:var(--font-sheet);font-size:13px;font-weight:700;color:#1B2A4A;letter-spacing:0
}
.pave-sheet .pave-field textarea,
.pave-sheet .pave-field input,
.pave-sheet .pave-risk-table textarea,
.pave-sheet .pave-risk-table input,
.pave-sheet .pave-market-table input{
  font-family:var(--font-sheet);font-size:14.5px;line-height:1.45;color:#1A1A1A;background:#fff;border-radius:2px
}
.pave-sheet .pave-risk-table th,
.pave-sheet .pave-market-table th{
  font-family:var(--font-sheet);font-weight:700;color:#1B2A4A;background:#EEEAE0;text-transform:none;letter-spacing:0
}

/* Sales cycle diagram — matches E3 Workshop A worksheet */
.sc-diagram{
  margin:4px 0 20px;padding:22px 22px 20px;
  border:1px solid #D5D0C4;border-radius:4px;
  background:#FBF8F1;font-family:var(--font-sheet);color:#1B2A4A
}
.sc-diagram-head{margin-bottom:8px}
.sc-diagram-head .sc-title-input{
  width:100%;border:none;background:transparent;font-family:var(--font-sheet);
  font-size:22px;font-weight:700;color:#1B2A4A;padding:0;letter-spacing:-.015em
}
.sc-diagram-head .sc-sub-input{
  width:100%;border:none;background:transparent;font-family:var(--font-sheet);
  font-size:14px;color:#4A5568;padding:6px 0 0;font-weight:400
}
.sc-map-stage{
  width:100%;
  overflow:hidden;
  margin:8px auto 22px;
  display:flex;
  justify-content:center;
}
.sc-map{
  position:relative;width:100%;max-width:760px;margin:0 auto;
  height:420px;
  transform-origin:top left;
}
.sc-spokes{
  position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0
}
.sc-spokes line{stroke:#9AA3AD;stroke-width:1.5}
.sc-hub{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:168px;height:168px;border-radius:50%;
  background:#1B2A4A;color:#F7F4EC;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:16px 14px;
  box-shadow:0 8px 24px rgba(27,42,74,.18)
}
.sc-hub input,.sc-hub textarea{
  width:100%;border:none;background:transparent;color:#F7F4EC;text-align:center;
  font-family:var(--font-sheet);padding:1px 4px;border-radius:4px
}
.sc-hub input{font-size:18px;font-weight:700;letter-spacing:.01em}
.sc-hub textarea{font-size:12px;min-height:32px;resize:none;opacity:.9;line-height:1.25;font-weight:400}
.sc-role{
  position:absolute;z-index:2;width:200px;
  background:#fff;border:2px solid #8FAE9F;border-radius:14px;
  padding:11px 12px 10px;box-shadow:0 2px 8px rgba(27,42,74,.06)
}
.sc-role[data-tone="sage"]{border-color:#6F9B7E;background:linear-gradient(180deg,#F4FAF6,#fff)}
.sc-role[data-tone="blue"]{border-color:#6E88BC;background:linear-gradient(180deg,#F3F6FC,#fff)}
.sc-role[data-tone="tan"]{border-color:#C09A5E;background:linear-gradient(180deg,#FBF6EE,#fff)}
.sc-role[data-tone="teal"]{border-color:#5B9A8E;background:linear-gradient(180deg,#F1F9F7,#fff)}
.sc-role[data-tone="red"]{border-color:#C47A74;background:linear-gradient(180deg,#FCF4F3,#fff)}
.sc-role .sc-role-label{
  font-size:12px;font-weight:700;letter-spacing:.02em;color:#1B2A4A;margin-bottom:6px;
  font-family:var(--font-sheet)
}
.sc-role textarea{
  width:100%;min-height:78px;border:none;border-radius:0;background:transparent;
  font-family:var(--font-sheet);font-size:12.5px;line-height:1.35;padding:0;resize:vertical;color:#243044
}
.sc-hub input:focus,.sc-hub textarea:focus,.sc-role textarea:focus,
.sc-diagram-head input:focus,.sc-step input:focus,.sc-flow-label input:focus{
  outline:none;box-shadow:0 0 0 2px rgba(27,42,74,.18);border-radius:4px
}
/* Radial positions around hub — mirror original worksheet */
.sc-role.pos-uses{left:50%;top:8px;transform:translateX(-50%)}
.sc-role.pos-saboteur{left:4%;top:56px}
.sc-role.pos-recommends{right:4%;top:56px;left:auto}
.sc-role.pos-decides{left:8%;bottom:18px;top:auto}
.sc-role.pos-influences{right:8%;bottom:18px;top:auto;left:auto}
.sc-flow-wrap{
  border-top:1px solid #E0DBD0;padding-top:16px;margin-top:4px
}
.sc-flow-label{margin:0 0 12px}
.sc-flow-label input{
  width:100%;border:none;background:transparent;font-family:var(--font-sheet);
  font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#1B2A4A;padding:0
}
.sc-flow{display:flex;flex-wrap:nowrap;gap:0;align-items:stretch;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.sc-step{
  flex:1 1 0;min-width:148px;background:#fff;border:2px solid #1B2A4A;border-radius:14px;
  padding:16px 14px 14px;display:flex;flex-direction:column;justify-content:center
}
.sc-step .sc-step-n{font-size:12px;font-weight:700;color:#1B2A4A;margin-bottom:4px;font-family:var(--font-sheet)}
.sc-step input{
  width:100%;border:none;background:transparent;font-family:var(--font-sheet);font-size:14px;
  font-weight:600;color:#1B2A4A;padding:0;line-height:1.3
}
.sc-arrow{
  flex:none;width:28px;display:flex;align-items:center;justify-content:center;
  color:#1B2A4A;font-weight:700;font-size:20px;line-height:1
}
.sc-ref{display:none}
/* Mobile: keep hub-and-spoke + horizontal deal flow — scale map to fit (no vertical stack). */
@media(max-width:820px){
  .sc-diagram{padding:14px 12px 16px}
  .sc-diagram-head .sc-title-input{font-size:17px}
  .sc-diagram-head .sc-sub-input{font-size:12.5px}
  .sc-map-stage{margin:6px 0 14px;justify-content:flex-start}
  .sc-map{
    width:640px;
    max-width:none;
    height:400px;
  }
  .sc-hub{width:132px;height:132px;padding:12px 10px}
  .sc-hub input{font-size:14px}
  .sc-hub textarea{font-size:10.5px;min-height:28px}
  .sc-role{width:168px;padding:8px 9px 8px;border-radius:12px}
  .sc-role .sc-role-label{font-size:10.5px;margin-bottom:4px}
  .sc-role textarea{min-height:64px;font-size:11px;line-height:1.3}
  .sc-flow{flex-wrap:nowrap}
  .sc-arrow{width:22px;transform:none;height:auto;font-size:16px}
  .sc-step{min-width:120px;padding:12px 10px}
  .sc-step input{font-size:12.5px}
}

.chip{display:inline-flex;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--forest-tint);color:var(--forest)}
.kbd{font-size:11px;color:var(--muted)}

@media (max-width:720px){
  html,body{height:100%;height:100dvh;overflow:hidden}
  body.standalone{display:flex;flex-direction:column;min-height:100dvh;height:100dvh;overflow:hidden}
  .dz-app-chrome{position:relative;flex-shrink:0;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));gap:8px}
  .dz-app-chrome a{padding:6px 10px;font-size:12px}
  .dz-app-chrome .dz-app-title strong{font-size:12.5px}

/* ---------- 0. Embed / standalone + phone session handoff ---------- */
(function(){
  try{
    var q = new URLSearchParams(location.search);
    if(q.get('embed')==='1' || q.get('embed')==='true') document.documentElement.classList.add('embed');
    else document.body.classList.add('standalone');
    // Phone navigate apps pass dz_sid / dz_stok (same as CRM).
    var sid = q.get('dz_sid') || q.get('dz_session') || q.get('session_id');
    var tok = q.get('dz_stok') || q.get('dz_token') || q.get('session_token');
    if(sid || tok){
      var raw = {};
      try{ raw = JSON.parse(localStorage.getItem('denizen-visitor-session') || '{}') || {}; }catch(e){}
      if(sid){ raw.session_id = sid; raw.sessionId = sid; }
      if(tok){ raw.session_token = tok; raw.sessionToken = tok; }
      localStorage.setItem('denizen-visitor-session', JSON.stringify(raw));
      ['dz_sid','dz_session','dz_stok','dz_token','session_id','session_token'].forEach(function(k){ q.delete(k); });
      var next = location.pathname + (q.toString() ? ('?' + q.toString()) : '') + location.hash;
      history.replaceState({}, '', next);
    }
  }catch(e){}
})();

/* ---------- 1. Storage shim (dz-bs:) ---------- */

function uid(prefix){

}
function nowISO(){ return new Date().toISOString(); }
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtDate(iso){
  if(!iso) return '—';
  try{
    const d=new Date(iso);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }catch(e){ return '—'; }
}
function toast(msg){
  const wrap=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast';
  el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); },3200);
}
function weekBounds(){
  const d=new Date();
  const day=d.getDay();
  const start=new Date(d); start.setHours(0,0,0,0); start.setDate(d.getDate()-(day===0?6:day-1));
  const end=new Date(start); end.setDate(start.getDate()+7);
  return {start,end};
}

function coercePaveStr(v){
  if(v==null) return '';

  if(Array.isArray(v)) return v.map(function(x){return typeof x==='string'?x:String((x&&(x.name||x.title))||x||'');}).filter(Boolean).join('\n');
  if(typeof v==='object') return String(v.text||v.label||'');
  return String(v);
}
function sanitizePaveRisks(raw, legacyText){

  while(rows.length<3) rows.push(emptyRiskRow());
  if(!rows.some(function(r){return r.risk||r.why||r.mitigate;}) && legacyText){

/* ---------- 5. Progress & health (explainable — no fake %) ---------- */
function evidenceForRequirement(st, req){
  const evidence=Array.isArray(st.evidence)?st.evidence:[];
  return evidence.filter(function(e){
    if(!e) return false;
    if(Array.isArray(e.linkedRequirementIds) && e.linkedRequirementIds.indexOf(req.id)>=0) return true;
    if(Array.isArray(e.linkedAssumptionKeys) && req.linkedAssumptionKey
      && e.linkedAssumptionKeys.indexOf(req.linkedAssumptionKey)>=0) return true;
    if(e.requirementKey && e.requirementKey===req.key) return true;
    return false;
  });
}
function requirementProgress(st, req){
  const linked=evidenceForRequirement(st, req);
  const count=linked.length;
  const target=Math.max(1, Number(req.targetCount)||1);
  const complete=count>=target;
  return {
    id:req.id,key:req.key,title:req.title,count,target,complete,
    evidenceIds:linked.map(function(e){return e.id;}),
    missing:Math.max(0,target-count),
    why: complete
      ? count+'/'+target+' required evidence items attached.'
      : count+' of '+target+' required evidence items attached; '+Math.max(0,target-count)+' still missing.'
  };
}
function programProgress(st, program){
  if(!program){
    return {percent:null,label:'No program',why:'No active program selected.',requirements:[],stageStatuses:[]};
  }
  const reqs=Array.isArray(program.requirements)?program.requirements:[];
  const reqProgress=reqs.map(function(r){ return requirementProgress(st,r); });
  const done=reqProgress.filter(function(r){return r.complete;}).length;
  const total=reqProgress.length;
  const percent=total===0?null:Math.round((done/total)*100);
  const stages=Array.isArray(program.stages)?program.stages:[];
  const stageStatuses=stages.map(function(stage){
    const stageReqs=reqProgress.filter(function(r){
      const raw=reqs.find(function(x){return x.id===r.id;});
      return raw && raw.stageId===stage.id;
    });
    var status=stage.status||'not_started';
    var why='Stage marked '+status+'.';
    if(stageReqs.length){
      const sDone=stageReqs.filter(function(r){return r.complete;}).length;
      if(sDone===stageReqs.length){ status='complete'; why='All '+stageReqs.length+' requirements have enough evidence.'; }
      else if(sDone>0 || stage.status==='active'){ status='active'; why=sDone+'/'+stageReqs.length+' requirements evidenced.'; }
      else if(stage.status==='complete'){ status='complete'; why='Marked complete (no requirements gated).'; }
      else { status=stage.status||'not_started'; why='0/'+stageReqs.length+' requirements evidenced.'; }
    }
    return {id:stage.id,name:stage.name,status,why,requirements:stageReqs};
  });
  return {
    programId:program.id,programName:program.name,percent,
    label:percent==null?'No gated requirements':done+'/'+total+' requirements evidenced',
    why:total===0?'Program has no evidence-gated requirements yet.':done+' of '+total+' program requirements have sufficient linked evidence.',
    requirements:reqProgress,stageStatuses
  };
}
function experimentProgress(exp, st){
  const evidence=(st.evidence||[]).filter(function(e){
    return (Array.isArray(e.linkedExperimentIds)&&e.linkedExperimentIds.indexOf(exp.id)>=0) || e.experimentId===exp.id;
  });
  const count=Math.max(Number(exp.completedCount)||0, evidence.length);
  const target=Math.max(1, Number(exp.targetCount)||1);
  const complete=count>=target;
  return {
    id:exp.id,title:exp.title,count,target,complete,
    confidence:complete?'sufficient_to_decide':'insufficient',
    why:complete
      ? count+'/'+target+' experiment samples collected — ready for a decision (not auto-validated).'
      : count+'/'+target+' samples — insufficient evidence to validate the linked assumption.',
    evidenceIds:evidence.map(function(e){return e.id;})
  };
}
function businessHealth(st){
  const programs=Array.isArray(st.programs)?st.programs:[];
  const activeProgram=programs.find(function(p){return p.status==='active';})||programs[0]||null;
  const prog=programProgress(st, activeProgram);
  const experiments=(st.experiments||[]).map(function(e){return experimentProgress(e,st);});
  const openTasks=(st.tasks||[]).filter(function(t){return t && t.status!=='done' && t.status!=='cancelled';});
  const overdueTasks=openTasks.filter(function(t){return t.due && new Date(t.due)<new Date();});
  const categories=[];

  const discoveryExp=experiments.find(function(e){return /interview|discovery/i.test(e.title);})||experiments[0];
  if(discoveryExp){
    categories.push({
      id:'customer_discovery',name:'Customer Discovery',
      status:discoveryExp.complete?'on_track':'needs_attention',
      reason:discoveryExp.why,evidenceIds:discoveryExp.evidenceIds,
      missing:discoveryExp.complete?[]:[ (discoveryExp.target-discoveryExp.count)+' more interviews/evidence' ],
      recommendedAction:discoveryExp.complete?'Record a decision on the linked assumption.':'Schedule additional discovery interviews and attach evidence.'
    });
  } else {
    categories.push({
      id:'customer_discovery',name:'Customer Discovery',status:'unknown',
      reason:'No discovery experiment defined.',evidenceIds:[],
      missing:['Create a discovery experiment'],
      recommendedAction:'Create an experiment tied to a core assumption.'
    });
  }

  if(activeProgram){
    const behind=(prog.requirements||[]).some(function(r){return !r.complete && r.count<r.target;});
    categories.push({
      id:'program',name:'Program / Accelerator',
      status:behind?'needs_attention':(prog.percent===100?'on_track':'in_progress'),
      reason:prog.why,
      evidenceIds:(prog.requirements||[]).flatMap(function(r){return r.evidenceIds||[];}),
      missing:(prog.requirements||[]).filter(function(r){return !r.complete;}).map(function(r){return r.title;}),
      recommendedAction:behind?'Focus on the active stage’s missing evidence requirements.':'Continue executing active stage deliverables.'
    });
  }

  categories.push({
    id:'operations',name:'Operations',
    status:overdueTasks.length?'needs_attention':(openTasks.length?'in_progress':'on_track'),
    reason:overdueTasks.length
      ? overdueTasks.length+' overdue task(s); '+openTasks.length+' open.'
      : openTasks.length+' open task(s); none overdue.',
    evidenceIds:[],
    missing:overdueTasks.map(function(t){return t.title;}),
    recommendedAction:overdueTasks.length?'Reschedule or complete overdue tasks this week.':'Work the highest-priority open tasks.'
  });

  return {
    generatedAt:nowISO(),program:prog,experiments,categories,
    openTaskCount:openTasks.length,overdueTaskCount:overdueTasks.length
  };
}
function explainStatus(st, subject){
  const health=businessHealth(st);
  if(!subject || subject==='program') return {kind:'program',...health.program};
  if(subject==='funding'){
    const fr=evaluateFundingReadiness();
    return {
      kind:'funding',
      why:fr.overall.why,
      reason:fr.overall.summaryLine||fr.overall.summary,
      missing:fr.sections.flatMap(function(s){return s.items.filter(function(i){return !i.complete;}).map(function(i){return i.title+' — '+i.display;});}).slice(0,12),
      evidenceIds:[],
      recommendedAction:'Open Funding Readiness and attach evidence to gap items.'
    };
  }
  if(String(subject).indexOf('category:')===0){
    const id=String(subject).slice('category:'.length);
    return health.categories.find(function(c){return c.id===id;})||{kind:'unknown',why:'Category not found.'};
  }
  if(String(subject).indexOf('experiment:')===0){
    const id=String(subject).slice('experiment:'.length);
    return health.experiments.find(function(e){return e.id===id;})||{kind:'unknown',why:'Experiment not found.'};
  }
  if(String(subject).indexOf('stage:')===0){
    const id=String(subject).slice('stage:'.length);
    const stage=(health.program.stageStatuses||[]).find(function(s){return s.id===id;});
    return stage||{kind:'unknown',why:'Stage not found.'};
  }
  return {kind:'unknown',why:'Unknown subject.'};
}
function topRecommendation(st){
  const health=businessHealth(st);
  const attn=health.categories.find(function(c){return c.status==='needs_attention';})

function fundingEvidenceFor(item){
  return (state.evidence||[]).filter(function(e){
    if(!e) return false;
    if(Array.isArray(e.linkedFundingKeys) && e.linkedFundingKeys.includes(item.key)) return true;
    if(e.fundingKey===item.key) return true;
    if(item.evidenceTypes && item.evidenceTypes.includes(e.type)
      && (e.fundingKey===item.key || (Array.isArray(e.tags)&&e.tags.includes(item.key)))) return true;
    return false;
  });
}
function evaluateFundingItem(item){
  const funding=state.funding||emptyFunding();
  const linked=fundingEvidenceFor(item);
  const override=(funding.items&&funding.items[item.key])||{};
  const target=Math.max(1, Number(item.targetCount)||1);
  const count=Math.max(linked.length, Number(override.manualCount)||0);
  const autoComplete=item.warnMode==='validation'
    ? !!(override.markedComplete||override.validated)
    : (count>=target);
  const complete=!!override.markedComplete || autoComplete;
  let status='not_started', mark='○', label='';
  if(item.targetCount){
    label=count+' / '+target;
    if(complete){ status='complete'; mark='✓'; }
    else if(count>0){ status='in_progress'; mark='◐'; }
    else { status='not_started'; mark='○'; }
  } else if(complete){
    status='complete'; mark='✓';
    label=override.completeLabel||item.completeLabel||'Evidence';
  } else if(override.needsValidation || item.warnMode==='validation'){
    if(count>0){ status='needs_validation'; mark='⚠'; label='Needs validation'; }
    else { status='not_started'; mark='○'; label=''; }
  } else if(count>0){
    status='in_progress'; mark='◐'; label='In progress';
  } else if(override.needsEvidence){
    status='needs_evidence'; mark='⚠'; label='Needs evidence';
  } else {
    status='not_started'; mark='○'; label='';
  }
  if(!complete && override.needsEvidence && count===0 && !item.targetCount){
    status='needs_evidence'; mark='⚠'; label='Needs evidence';
  }
  const display=label ? (mark+' '+label) : mark;
  return {
    key:item.key,title:item.title,status:status,mark:mark,label:label,display:display,
    count:count,target:item.targetCount?target:null,complete:complete,
    evidenceIds:linked.map(function(e){return e.id;}),
    why:complete
      ? (count||1)+' linked evidence — '+(label||'complete')+'.'
      : (count>0
        ? (item.targetCount ? count+'/'+target+' evidence linked; still insufficient.' : count+' evidence linked — in progress.')
        : 'No evidence linked for "'+item.title+'".'),
    recommendedAction:complete?'Keep evidence current.':'Attach evidence for '+item.title+'.'
  };
}
function classifyFundingBucket(item){
  if(item.complete) return 'complete';
  if(item.status==='not_started') return 'not_started';
  return 'needs_work';
}
function evaluateFundingReadiness(){
  const sections=FUNDING_SECTIONS.map(function(sec){
    const items=sec.items.map(evaluateFundingItem);
    return {
      id:sec.id,name:sec.name,items:items,
      completeCount:items.filter(function(i){return i.complete;}).length,
      needsWorkCount:items.filter(function(i){return classifyFundingBucket(i)==='needs_work';}).length,
      notStartedCount:items.filter(function(i){return classifyFundingBucket(i)==='not_started';}).length
    };
  });
  const all=sections.reduce(function(a,s){return a.concat(s.items);},[]);
  const complete=all.filter(function(i){return classifyFundingBucket(i)==='complete';}).length;
  const needsWork=all.filter(function(i){return classifyFundingBucket(i)==='needs_work';}).length;
  const notStarted=all.filter(function(i){return classifyFundingBucket(i)==='not_started';}).length;
  return {
    sections:sections,
    overall:{
      complete:complete,needsWork:needsWork,notStarted:notStarted,total:all.length,
      summary:complete+' complete\n'+needsWork+' need work\n'+notStarted+' not started',
      summaryLine:complete+' complete · '+needsWork+' need work · '+notStarted+' not started',
      why:'Counts items with linked evidence (or founder mark). Tasks alone never count.'
    }
  };
}
function calcMarketSizing(ms){
  const tamOrgs=Number(ms.tamOrgs), samOrgs=Number(ms.samOrgs), somPct=Number(ms.somPct), acv=Number(ms.acv);
  const out={tamValue:null,samValue:null,somOrgs:null,somValue:null,warnings:[],jenny:[]};
  if(isFinite(tamOrgs)&&isFinite(acv)) out.tamValue=tamOrgs*acv;
  if(isFinite(samOrgs)&&isFinite(acv)) out.samValue=samOrgs*acv;
  if(isFinite(samOrgs)&&isFinite(somPct)){
    out.somOrgs=samOrgs*(somPct/100);
    if(isFinite(acv)) out.somValue=out.somOrgs*acv;
  }
  if(isFinite(somPct)&&somPct>5) out.warnings.push('SOM capture >5% needs supporting evidence.');
  if(!(ms.sources&&ms.sources.tam)) out.warnings.push('TAM source missing.');
  if(!(ms.sources&&ms.sources.sam)) out.warnings.push('SAM source missing.');
  if(!(ms.sources&&ms.sources.som)) out.warnings.push('SOM assumption source missing.');
  if(!ms.buyerWho) out.warnings.push('Buyer definition missing — who exactly buys this?');
  if(!ms.geography) out.warnings.push('Geography missing — where can you sell today?');
  out.jenny=out.warnings.map(function(w){
    if(/TAM source/i.test(w)) return 'Jenny: Your TAM number is not sourced yet — investors will ask where it came from.';
    if(/SAM source/i.test(w)) return 'Jenny: SAM needs a source (geography + segment definition).';
    if(/SOM/i.test(w)) return 'Jenny: Your TAM may be sourced, but your SOM assumes a capture rate without supporting evidence.';
    if(/Buyer/i.test(w)) return 'Jenny: Who exactly writes the check? Name the economic buyer.';
    if(/Geography/i.test(w)) return 'Jenny: What geography can you currently sell into?';
    return 'Jenny: '+w;
  });
  return out;
}

/* ---------- 7. Persistence + cloud sync ---------- */
function persistLocal(){
  try{ window.storage.setItem('workspace', JSON.stringify(state)); }catch(e){}
}
function scheduleSave(){
  persistLocal();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){ pushRemoteWorkspace().catch(function(){}); },600);
}
function loadLocal(){
  try{
    const raw=window.storage.getItem('workspace');
    if(raw) state=sanitizeState(JSON.parse(raw));
  }catch(e){ state=emptyState(); }
}
function readVisitorSession(){
  try{
    const raw=localStorage.getItem('denizen-visitor-session');
    if(!raw) return null;
    const d=JSON.parse(raw);
    if(!d) return null;
    const sid=d.session_id||d.sessionId||null;
    const tok=d.session_token||d.sessionToken||null;
    if(!sid) return null;
    return Object.assign({}, d, { session_id:sid, session_token:tok });
  }catch(e){}
  return null;
}
function authHeaders(sess){
  return {
    'X-Session-Id':sess.session_id,
    'X-Session-Token':sess.session_token||'',
    'Authorization':'Bearer '+(sess.session_token||'')
  };
}
async function fetchRemoteWorkspace(){
  const sess=readVisitorSession();
  if(!sess) return null;
  try{
    const url='/api/business-studio/workspace?session_id='+encodeURIComponent(sess.session_id);
    const res=await fetch(url,{headers:authHeaders(sess)});
    if(!res.ok) return null;
    const data=await res.json();
    if(!data || !data.ok || !data.state) return null;
    remoteSyncEnabled=true;
    remoteUpdatedAt=data.updated_at||null;
    return data;
  }catch(e){ return null; }
}
async function pushRemoteWorkspace(){
  const sess=readVisitorSession();
  if(!sess || !remoteSyncEnabled) return;
  if(isAdvisorMode()) return; // mentors use scoped POST endpoints, never overwrite workspace
  try{
    const res=await fetch('/api/business-studio/workspace',{
      method:'PUT',
      headers:Object.assign({'Content-Type':'application/json'}, authHeaders(sess)),
      body:JSON.stringify({
        session_id:sess.session_id,
        session_token:sess.session_token,
        if_updated_at:remoteUpdatedAt,
        state:state
      })
    });
    const data=await res.json().catch(function(){return {};});
    if(res.ok && data.ok){
      remoteUpdatedAt=data.updated_at||remoteUpdatedAt;
    } else if(res.status===409 && data.state){
      state=sanitizeState(data.state);
      remoteUpdatedAt=data.updated_at||remoteUpdatedAt;
      persistLocal();
      render();
    }
  }catch(e){}
}
async function bootstrapSync(){
  const remote=await fetchRemoteWorkspace();
  if(remote && remote.state){
    const remoteHas=remote.state.business || (remote.state.programs&&remote.state.programs.length);
    const localHas=state.business || (state.programs&&state.programs.length);
    if(remoteHas || !localHas){
      state=sanitizeState(remote.state);
      persistLocal();
    } else if(localHas){
      await pushRemoteWorkspace();
    }
    if(remote.viewer && remote.viewer.role && /mentor|advisor|investor|viewer/i.test(remote.viewer.role)){
      state.config=state.config||{};
      state.config.advisorMode=true;
    }
  }
}
async function postStudioApi(path, payload){
  const sess=readVisitorSession();
  if(!sess || !remoteSyncEnabled) return null;
  const res=await fetch(path,{
    method:'POST',
    headers:Object.assign({'Content-Type':'application/json'}, authHeaders(sess)),
    body:JSON.stringify(Object.assign({
      session_id:sess.session_id,
      session_token:sess.session_token
    }, payload||{}))
  });
  const data=await res.json().catch(function(){return {};});
  if(!res.ok || data.ok===false){
    throw new Error(data.error||('API '+res.status));
  }
  if(data.updated_at) remoteUpdatedAt=data.updated_at;
  return data;
}

/* ---------- 9. WHY modal (createPortal-style) ---------- */
function createPortal(contentHtml, opts){
  opts=opts||{};
  const root=document.getElementById('modalRoot');
  root.hidden=false;
  root.innerHTML='<div class="modal" role="dialog" aria-modal="true">'
    +'<h3>'+esc(opts.title||'Details')+'</h3>'
    +contentHtml
    +'<div class="modal-foot"><button type="button" class="btn" data-close-modal>Close</button></div>'
    +'</div>';
  function close(){
    root.hidden=true;
    root.innerHTML='';
    root.removeEventListener('click', onBg);
  }
  function onBg(e){
    if(e.target===root || e.target.hasAttribute('data-close-modal')) close();
  }
  root.addEventListener('click', onBg);
  return {close:close, root:root};
}
function showWhy(subject){
  const expl=explainStatus(state, subject);
  const reason=expl.reason||expl.why||'No explanation available.';
  const evidenceIds=expl.evidenceIds||[];
  const missing=expl.missing||(expl.missing!=null?[expl.missing]:[]);
  const missingList=Array.isArray(missing)?missing:[];
  const action=expl.recommendedAction||'';
  const html='<div class="why-block">'
    +'<dl>'
    +'<dt>Reason</dt><dd>'+esc(reason)+'</dd>'
    +'<dt>Evidence IDs</dt><dd>'+(evidenceIds.length?esc(evidenceIds.join(', ')):'None linked yet')+'</dd>'
    +'<dt>Missing</dt><dd>'+(missingList.length?esc(missingList.join('; ')):'Nothing missing')+'</dd>'
    +(action?'<dt>Recommended action</dt><dd>'+esc(action)+'</dd>':'')
    +'</dl></div>';
  createPortal(html,{title:'WHY?'});
}

/* ---------- 10. Forms / dialogs ---------- */
function promptForm(title, fields, onSubmit){
  // fields: [{name,label,type,value,options,required}]
  let body='<form class="form-grid" id="portalForm">';
  fields.forEach(function(f){
    body+='<label>'+esc(f.label);
    if(f.type==='select'){
      body+='<select name="'+esc(f.name)+'">';
      (f.options||[]).forEach(function(o){
        const v=typeof o==='string'?o:o.value;
        const l=typeof o==='string'?o:o.label;
        body+='<option value="'+esc(v)+'"'+(f.value===v?' selected':'')+'>'+esc(l)+'</option>';
      });
      body+='</select>';
    } else if(f.type==='textarea'){
      body+='<textarea name="'+esc(f.name)+'"'+(f.required?' required':'')+'>'+esc(f.value||'')+'</textarea>';
    } else {
      body+='<input name="'+esc(f.name)+'" type="'+(f.type||'text')+'" value="'+esc(f.value||'')+'"'+(f.required?' required':'')+' />';
    }
    if(f.hint) body+='<span class="field-hint">'+esc(f.hint)+'</span>';
    body+='</label>';
  });
  body+='<div class="actions"><button type="submit" class="btn btn-primary">Save</button>'
    +'<button type="button" class="btn" data-close-modal>Cancel</button></div></form>';
  const portal=createPortal(body,{title:title});
  const form=document.getElementById('portalForm');
  form.addEventListener('submit',function(e){
    e.preventDefault();
    const fd=new FormData(form);
    const data={};
    fields.forEach(function(f){ data[f.name]=String(fd.get(f.name)||'').trim(); });
    portal.close();
    onSubmit(data);
  });
}

  if(!asmOpts.length){ toast('Create an assumption first'); return; }
  promptForm('Create experiment',[

    {name:'targetCount',label:'Target evidence count',type:'number',value:'10',required:true}
  ],function(data){

      status:'active',targetCount:target,completedCount:0,
      programId:prog&&prog.id||null,method:'manual',createdAt:nowISO()
    });
    // Never auto-validate assumption
    const asm=state.assumptions.find(function(a){return a.key===data.assumptionKey;});
    if(asm){ asm.confidence='insufficient'; asm.status='testing'; }
    logActivity('Created experiment: '+data.title);

  });

function openCreateEvidence(){
  const expOpts=[{value:'',label:'— none —'}].concat(state.experiments.map(function(e){return {value:e.id,label:e.title};}));
  const prog=activeProgram();
  const reqOpts=[{value:'',label:'— none —'}].concat(
    ((prog&&prog.requirements)||[]).map(function(r){return {value:r.id,label:r.title};})
  );
  promptForm('Add evidence',[
    {name:'title',label:'Title / summary',required:true},
    {name:'type',label:'Type',type:'select',options:['interview','document','metric','meeting','manual']},
    {name:'experimentId',label:'Link to experiment',type:'select',options:expOpts},
    {name:'requirementId',label:'Link to requirement',type:'select',options:reqOpts},
    {name:'fundingKey',label:'Funding readiness key (optional)',hint:'e.g. customer_discovery — interviews auto-link when type=interview'},
    {name:'contactId',label:'CRM contact id (optional)'},
    {name:'notes',label:'Notes',type:'textarea'}
  ],function(data){
    const isInterview=data.type==='interview';
    let experimentId=data.experimentId||null;
    let requirementKey=null;
    let linkedRequirementIds=data.requirementId?[data.requirementId]:[];
    let linkedAssumptionKeys=[];
    let fundingKey=data.fundingKey||null;
    if(isInterview && !experimentId){
      const exp=(state.experiments||[]).find(function(x){return /interview|discovery/i.test(x.title);});
      if(exp) experimentId=exp.id;
    }
    if(data.requirementId && prog){
      const req=(prog.requirements||[]).find(function(r){return r.id===data.requirementId;});
      if(req){
        requirementKey=req.key;
        if(req.linkedAssumptionKey) linkedAssumptionKeys=[req.linkedAssumptionKey];
      }
    } else if(isInterview){
      const req=((prog&&prog.requirements)||[]).find(function(r){return r.key==='discovery_interviews';});
      if(req){
        requirementKey=req.key;
        linkedRequirementIds=[req.id];
        if(req.linkedAssumptionKey) linkedAssumptionKeys=[req.linkedAssumptionKey];
      }
    }
    if(isInterview && !fundingKey) fundingKey='customer_discovery';
    const ev={
      id:uid('ev'),title:data.title,type:data.type||'manual',notes:data.notes||'',
      experimentId:experimentId,
      linkedExperimentIds:experimentId?[experimentId]:[],
      linkedRequirementIds:linkedRequirementIds,
      requirementKey:requirementKey,
      linkedAssumptionKeys:linkedAssumptionKeys,
      fundingKey:fundingKey,
      linkedFundingKeys:fundingKey?[fundingKey]:[],
      contactId:data.contactId||null,
      createdAt:nowISO()
    };
    if(experimentId){
      const exp=state.experiments.find(function(e){return e.id===experimentId;});
      if(exp && exp.assumptionKey && !ev.linkedAssumptionKeys.length) ev.linkedAssumptionKeys=[exp.assumptionKey];
      if(exp){
        const ep=experimentProgress(exp, Object.assign({},state,{evidence:state.evidence.concat([ev])}));
        exp.completedCount=ep.count;
        const asm=state.assumptions.find(function(a){return a.key===exp.assumptionKey;});
        if(asm){
          asm.confidence=ep.complete?'sufficient_to_decide':'insufficient';
        }
      }
    }
    if(ev.contactId){
      state.relations=state.relations||[];
      state.relations.unshift({
        id:uid('rel'),kind:'crm_contact',contactId:ev.contactId,evidenceId:ev.id,createdAt:ev.createdAt
      });
    }
    state.evidence.unshift(ev);
    syncMetricFromEvidence();
    logActivity('Added evidence: '+data.title);
    scheduleSave(); render(); toast('Evidence added');
  });
}

    return html;
  }
  html+='<div class="list">';
  state.goals.forEach(function(g){
    const keys=g.metricKeys||[];
    const bits=[];
    keys.forEach(function(k){
      const met=(state.metrics||[]).find(function(m){return m.key===k;});
      if(met) bits.push(met.name+': '+(met.current||0)+'/'+(met.target||1));
      else {
        const prog=activeProgram();
        const req=((prog&&prog.requirements)||[]).find(function(r){return r.key===k;});
        if(req){
          const rp=requirementProgress(state,req);
          bits.push(req.title+': '+rp.count+'/'+rp.target);
        }
      }
    });
    html+='<div class="row-item"><div><div class="rt">'+esc(g.title)+'</div>'
      +'<div class="rm">'+(bits.length?esc(bits.join(' · ')):fmtDate(g.createdAt))+'</div></div>'
      +'<div class="row-actions">'+statusChip(g.status)
      +'<button type="button" class="btn btn-sm" data-goal-status="'+esc(g.id)+'" data-status="done">Done</button>'
      +'<button type="button" class="btn btn-sm btn-danger" data-del-goal="'+esc(g.id)+'">Delete</button></div></div>';

  html+='</div>';
  return html;
}

function renderRoadmap(){
  const prog=activeProgram();
  const pp=programProgress(state,prog);
  let html='<div class="page-head"><div><h2>Roadmap</h2><p>Stage timeline derived from requirements and evidence — not decorative percentages.</p></div></div>';
  if(!prog){
    html+='<div class="empty"><strong>No active program</strong>Apply E3 / PAVE from Programs.</div>';
    return html;
  }
  html+='<div class="panel"><h3>'+esc(prog.name)+'</h3><div class="stage-rail" style="flex-wrap:nowrap">';
  (pp.stageStatuses||[]).forEach(function(s){
    html+='<button type="button" class="stage-node '+esc(s.status)+'" data-why="stage:'+esc(s.id)+'">'
      +'<div class="sn-name">'+esc(s.name)+'</div>'
      +'<div class="sn-status">'+statusChip(s.status)+'</div>'
      +'<div class="rm" style="margin-top:8px;font-size:11.5px;color:var(--muted)">'+esc(s.why)+'</div></button>';
  });
  html+='</div><p class="field-hint" style="margin-top:10px">Click any stage for full WHY (reason, evidence ids, missing, action).</p></div>';

  html+='<div class="panel" style="margin-top:14px"><h3>Milestones</h3>';
  const ms=state.milestones.filter(function(m){return !prog||m.programId===prog.id;});
  if(!ms.length) html+='<div class="empty">No milestones.</div>';
  else {
    html+='<div class="list">';
    ms.forEach(function(m){
      const keys=m.requirementKeys||[];
      const reqs=(prog.requirements||[]).filter(function(r){return keys.indexOf(r.key)>=0;});
      const rps=reqs.map(function(r){return requirementProgress(state,r);});
      let derived=m.status;
      let why='';
      if(rps.length){
        if(rps.every(function(r){return r.complete;})){ derived='complete'; why='All linked requirements evidenced.'; }
        else if(rps.some(function(r){return r.count>0;})){ derived='active'; why=rps.filter(function(r){return !r.complete;}).map(function(r){return r.title+' '+r.count+'/'+r.target;}).join('; '); }
        else { why='Waiting on: '+rps.map(function(r){return r.title;}).join(', '); }
      }
      html+='<div class="row-item"><div><div class="rt">'+esc(m.title)+'</div>'
        +(why?'<div class="rm">'+esc(why)+'</div>':'')
        +(m.blockedReason && derived==='blocked'?'<div class="rm">'+esc(m.blockedReason)+'</div>':'')
        +'</div>'+statusChip(derived)+'</div>';
    });
    html+='</div>';
  }
  html+='</div>';
  return html;
}

function renderStrategy(){
  let html='<div class="page-head"><div><h2>Strategy map</h2><p>Vision → outcome chain. Click a node to edit.</p></div></div>';
  if(!state.strategyNodes.length){
    html+='<div class="empty"><strong>No strategy nodes</strong>Apply E3 / PAVE to generate a vertical strategy graph.</div>';
    return html;
  }
  const nodes=state.strategyNodes;
  const edges=state.strategyEdges||[];
  const maxY=Math.max.apply(null, nodes.map(function(n){return n.y||0;}))+80;
  const width=360;
  const height=maxY;

  let svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'">';
  edges.forEach(function(e){
    const a=nodes.find(function(n){return n.id===e.from;});
    const b=nodes.find(function(n){return n.id===e.to;});
    if(!a||!b) return;
    const x1=(a.x||40)+140, y1=(a.y||0)+28, x2=(b.x||40)+140, y2=(b.y||0)+8;
    svg+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="rgba(16,35,28,.18)" stroke-width="2"/>';
  });
  nodes.forEach(function(n){
    const x=n.x||40, y=n.y||0;
    const sel=ui.selectedNodeId===n.id;
    svg+='<g class="node-hit" data-node="'+esc(n.id)+'" transform="translate('+x+','+y+')">'
      +'<rect width="280" height="56" rx="12" fill="'+(sel?'#E8F2ED':'#FBF9F3')+'" stroke="'+(sel?'#2A6A55':'rgba(16,35,28,.14)')+'" stroke-width="1.5"/>'
      +'<text x="14" y="22" fill="#2A6A55" font-size="11" font-weight="700" font-family="Syne, sans-serif">'+esc(n.label||n.type)+'</text>'
      +'<text x="14" y="42" fill="#10231C" font-size="12" font-family="Figtree, sans-serif">'+esc((n.text||'').slice(0,42))+((n.text||'').length>42?'…':'')+'</text>'
      +'</g>';
  });
  svg+='</svg>';
  html+='<div class="strategy-wrap">'+svg+'</div>';
  if(ui.selectedNodeId){
    const n=nodes.find(function(x){return x.id===ui.selectedNodeId;});
    if(n){
      html+='<div class="panel" style="margin-top:14px"><h3>Edit node</h3><div class="form-grid">'
        +'<label>Label<input id="nodeLabel" value="'+esc(n.label||'')+'"/></label>'
        +'<label>Text<textarea id="nodeText">'+esc(n.text||'')+'</textarea></label>'
        +'<button type="button" class="btn btn-primary" data-save-node="'+esc(n.id)+'">Save node</button>'
        +'</div></div>';
    }
  }
  return html;
}

function renderSalesCycleDiagram(diagram, advisor){
  diagram=sanitizeSalesCycleDiagram(diagram);
  const rolePos={uses:'pos-uses',recommends:'pos-recommends',influences:'pos-influences',decides:'pos-decides',saboteur:'pos-saboteur'};
  const order=['saboteur','uses','recommends','decides','influences'];
  const ro=advisor?' readonly':'';
  // Spoke endpoints as % of map box — tuned to card anchors around the hub
  const spokes=[
    {x2:'18%',y2:'28%'},  // saboteur
    {x2:'50%',y2:'14%'},  // uses
    {x2:'82%',y2:'28%'},  // recommends
    {x2:'22%',y2:'78%'},  // decides
    {x2:'78%',y2:'78%'}   // influences

  let html='<div class="sc-diagram" data-sc-diagram="1">'
    +'<div class="sc-diagram-head">'
    +'<input class="sc-title-input" data-sc="title" value="'+esc(diagram.title||'')+'" aria-label="Diagram title"'+ro+'/>'
    +'<input class="sc-sub-input" data-sc="subtitle" value="'+esc(diagram.subtitle||'')+'" aria-label="Diagram subtitle"'+ro+'/>'
    +'</div>';

  html+='<div class="sc-map-stage" data-fit-stage data-fit-design-width="640">'
    +'<div class="sc-map" data-fit-board aria-label="Buying center diagram">'
    +'<svg class="sc-spokes" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">';
  spokes.forEach(function(s){
    html+='<line x1="50" y1="50" x2="'+parseFloat(s.x2)+'" y2="'+parseFloat(s.y2)+'"/>';
  });
  html+='</svg>';

  html+='<div class="sc-hub">'
    +'<input data-sc="productTitle" value="'+esc(diagram.productTitle||'')+'"'+ro+'/>'
    +'<textarea data-sc="productSubtitle" rows="2"'+ro+'>'+esc(diagram.productSubtitle||'')+'</textarea>'
    +'</div>';

  order.forEach(function(id){
    const role=(diagram.roles||[]).find(function(r){return r.id===id;})||{id:id,label:id,tone:'sage',text:''};
    html+='<div class="sc-role '+rolePos[id]+'" data-tone="'+esc(role.tone||'sage')+'">'
      +'<div class="sc-role-label">'+esc(role.label||id.toUpperCase())+'</div>'
      +'<textarea data-sc-role="'+esc(id)+'" rows="4"'+ro+'>'+esc(role.text||'')+'</textarea>'
      +'</div>';

    +'<div class="sc-flow-label"><input data-sc="cycleNote" value="'+esc(diagram.cycleNote||'')+'"'+ro+'/></div>'
    +'<div class="sc-flow">';

    if(i) html+='<span class="sc-arrow" aria-hidden="true">→</span>';
    html+='<div class="sc-step"><div class="sc-step-n">'+(i+1)+'.</div>'
      +'<input data-sc-step="'+esc(step.id)+'" value="'+esc(step.label||'')+'"'+ro+'/>'
      +'</div>';
  });
  html+='</div></div></div>';
  return html;
}

function readPaveFromDom(prog){
  var pave=sanitizePave((prog&&prog.pave)||{});
  var wrap=document.querySelector('[data-pave-program]');
  if(!wrap) return pave;
  wrap.querySelectorAll('[data-pave]').forEach(function(inp){
    setNested(pave, inp.getAttribute('data-pave'), inp.value);
  });
  wrap.querySelectorAll('[data-pave-risk]').forEach(function(inp){
    var i=Number(inp.getAttribute('data-pave-risk'));
    var col=inp.getAttribute('data-col');
    if(!pave.partC.risks[i]) pave.partC.risks[i]=emptyRiskRow();
    pave.partC.risks[i][col]=inp.value;
  });
  wrap.querySelectorAll('[data-pave-market]').forEach(function(inp){
    var layer=inp.getAttribute('data-pave-market');
    var col=inp.getAttribute('data-col');
    if(!pave.partC.marketSizing[layer]) pave.partC.marketSizing[layer]=emptyMarketRow();
    pave.partC.marketSizing[layer][col]=inp.value;
  });
  var sc=wrap.querySelector('[data-sc-diagram]');
  if(sc){
    var diagram=sanitizeSalesCycleDiagram(pave.partA.salesCycleDiagram||{});
    sc.querySelectorAll('[data-sc]').forEach(function(inp){
      diagram[inp.getAttribute('data-sc')]=inp.value;
    });
    sc.querySelectorAll('[data-sc-role]').forEach(function(inp){
      var id=inp.getAttribute('data-sc-role');
      var role=diagram.roles.find(function(r){return r.id===id;});
      if(role) role.text=inp.value;
    });
    sc.querySelectorAll('[data-sc-step]').forEach(function(inp){
      var id=inp.getAttribute('data-sc-step');
      var step=diagram.cycle.find(function(s){return s.id===id;});
      if(step) step.label=inp.value;
    });
    pave.partA.salesCycleDiagram=sanitizeSalesCycleDiagram(diagram);
  }
  if(pave.partB.summaryOfCalls && !pave.partB.customerDiscovery){
    pave.partB.customerDiscovery=pave.partB.summaryOfCalls;
  }
  pave.updatedAt=nowISO();
  return sanitizePave(pave);
}

function saveActivePave(opts){
  opts=opts||{};
  var prog=activeProgram();
  if(!prog){ toast('Apply E3 / PAVE first'); return null; }
  prog.pave=readPaveFromDom(prog);
  if(opts.syncDiscovery) prog.pave=syncPartBFromDiscovery(prog.pave, state, opts.syncDiscovery);
  syncPavePartBEvidence(prog);
  // Mark deliverables loosely when sections have substance
  (prog.deliverables||[]).forEach(function(d){
    var map={snapshot:'snapshot',part_a:'partA',part_b:'partB',part_c:'partC',part_d:'partD',final:'final'};
    var sid=map[d.section];
    if(!sid) return;
    var sp=paveSectionProgress(prog.pave, sid);
    if(sp.complete && d.status!=='done') d.status='in_progress';
    if(sp.filled>=sp.total && sp.total>0) d.status='done';
  });
  logActivity(opts.activity||'Saved PAVE workbook');
  scheduleSave();
  return prog;
}

function syncLeanCanvasEvidence(canvas){
  const text=leanCanvasPlainText(canvas);

  state.evidence=state.evidence||[];
  let ev=state.evidence.find(function(e){return e && e.source==='lean_canvas' && !e.revoked;});
  if(!substantial){
    if(ev){
      ev.revoked=true; ev.status='revoked'; ev.revokedAt=nowISO();
      ev.revokeReason='Lean Canvas core boxes cleared';
    }
    return;
  }
  if(ev){
    ev.title='Lean Canvas';
    ev.notes=text;
    ev.description=text;
    ev.fundingKey='lean_canvas';
    ev.linkedFundingKeys=['lean_canvas'];
    ev.type='document';
    ev.updatedAt=nowISO();
  } else {
    state.evidence.unshift({
      id:uid('ev'),
      title:'Lean Canvas',
      type:'document',
      notes:text,
      description:text,
      fundingKey:'lean_canvas',
      linkedFundingKeys:['lean_canvas'],
      source:'lean_canvas',
      createdAt:nowISO(),
      status:'active',
      revoked:false
    });
  }
}

function renderDiscovery(){
  const interviews=(state.evidence||[]).filter(function(e){return e.type==='interview';});
  const tags={};
  let pricingAsked=0, pilotRequested=0, economicBuyers=0;
  interviews.forEach(function(ev){
    const list=[].concat(ev.insightTags||[], ev.findings||[]);
    list.forEach(function(t){
      const key=String(t).trim();
      if(!key) return;
      if(!tags[key]) tags[key]={tag:key,count:0,evidenceIds:[]};
      tags[key].count+=1;
      tags[key].evidenceIds.push(ev.id);
      if(/pric/i.test(key)) pricingAsked+=1;
      if(/pilot/i.test(key)) pilotRequested+=1;
    });
    if(ev.economicBuyer || /economic|buyer|writes the check/i.test(String(ev.persona||''))) economicBuyers+=1;
  });
  const patterns=Object.keys(tags).map(function(k){return tags[k];}).sort(function(a,b){return b.count-a.count;});
  const exp=(state.experiments||[]).find(function(e){return /interview|discovery/i.test(e.title);});
  const target=exp?Math.max(1,Number(exp.targetCount)||10):10;
  const lab=(state.funding&&state.funding.discoveryLab)||{personas:[],hypotheses:[]};
  const hypotheses=(lab.hypotheses&&lab.hypotheses.length)?lab.hypotheses:state.assumptions;

  let html='<div class="page-head"><div><h2>Customer Discovery Lab</h2>'
    +'<p>Persona → hypothesis → interview → insights → evidence → pattern detection → assumption update. DENIZEN organizes counts — you decide.</p></div>'
    +'<div class="actions">'
    +'<button type="button" class="btn" data-action="add-persona">+ Persona</button>'
    +'<button type="button" class="btn" data-action="add-hypothesis">+ Hypothesis</button>'
    +'<button type="button" class="btn btn-primary" data-action="add-interview">+ Interview</button></div></div>';

  html+='<div class="panel" style="margin-bottom:14px"><h3>Pipeline</h3>'
    +'<div class="pathway-rail">'
    +['Persona','Hypothesis','Interview target','Interview','Insights','Evidence','Patterns','Assumption update']
      .map(function(s,i){return '<span class="step'+(i<=Math.min(7, interviews.length?5:1)?' on':'')+'">'+s+'</span>';}).join('')
    +'</div>'
    +'<div class="meta-line"><span class="num">'+interviews.length+' / '+target+' interviews</span>'
