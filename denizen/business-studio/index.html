function fitBoardToStage(stage){
  if(!stage) return;
  var board=stage.querySelector('[data-fit-board]');
  if(!board) return;
  var designW=Number(stage.getAttribute('data-fit-design-width'))||820;
  var avail=stage.clientWidth;
  if(!avail){
    avail=(stage.parentElement&&stage.parentElement.clientWidth)||Math.max(0, window.innerWidth-28);
  }
  board.style.transform='none';
  if(avail>=designW-4){
    board.style.width='';
    board.style.minWidth='';
    stage.style.height='';
    return;
  }
  board.style.width=designW+'px';
  board.style.minWidth=designW+'px';
  var naturalH=board.offsetHeight||540;
  var scale=Math.max(0.4, Math.min(1, avail/designW));
  board.style.transform='scale('+scale+')';
  board.style.transformOrigin='top left';
  stage.style.height=Math.ceil(naturalH*scale)+'px';
}

function fitAllBoards(){
  document.querySelectorAll('[data-fit-stage]').forEach(fitBoardToStage);
}

function setNested(obj, path, value){
  const parts=path.split('.');
  let cur=obj;
  for(let i=0;i<parts.length-1;i++){
    if(!cur[parts[i]] || typeof cur[parts[i]]!=='object') cur[parts[i]]={};
    cur=cur[parts[i]];
  }
  cur[parts[parts.length-1]]=value;
}

document.addEventListener('click', function(e){
  const t=e.target.closest('[data-nav],[data-action],[data-why],[data-task-done],[data-del-task],[data-del-goal],[data-goal-status],[data-del-evidence],[data-select-program],[data-save-pave],[data-node],[data-save-node],[data-accept-rec],[data-decline-rec],[data-del-advisor],[data-update-metric],[data-close-more],[data-share],[data-link-funding],[data-save-moat]');
  if(!t) {
    // bottom nav handled below
  }

  const bn=e.target.closest('.bottom-nav [data-view]');
  if(bn){ setView(bn.getAttribute('data-view')); return; }
  const bnAct=e.target.closest('.bottom-nav [data-action]');
  if(bnAct){
    const a=bnAct.getAttribute('data-action');
    if(a==='quickadd') quickAddMenu();
    if(a==='more'){
      const sheet=document.getElementById('moreSheet');
      renderMoreSheet();
      sheet.hidden=false;
      sheet.classList.add('open');
    }
    return;
  }
  if(e.target.closest('[data-close-more]') || e.target.id==='moreSheet'){
    if(e.target.id==='moreSheet' || e.target.closest('[data-close-more]')){
      document.getElementById('moreSheet').classList.remove('open');
      document.getElementById('moreSheet').hidden=true;
    }
  }

  const nav=e.target.closest('[data-nav]');
  if(nav){ setView(nav.getAttribute('data-nav')); return; }

  const why=e.target.closest('[data-why]');
  if(why){ showWhy(why.getAttribute('data-why')); return; }

  const act=e.target.closest('[data-action]');
  if(act){
    const a=act.getAttribute('data-action');
    if(a==='start-business'){
      promptForm('Start your business',[
        {name:'name',label:'Business name',required:true},
        {name:'founder',label:'Founder name',required:true,value:'Founder'}
      ],function(d){ startBusiness(d.name,d.founder); });
    }
    if(a==='fill-dolonia-pack'){
      applyDoloniaFounderPack();
    }
    if(a==='apply-e3' || a==='apply-e3-onboard'){
      if(!state.business){
        promptForm('Apply E3 / PAVE',[
          {name:'name',label:'Business name',required:true},
          {name:'founder',label:'Founder name',required:true,value:'Founder'}
        ],function(d){
          startBusiness(d.name,d.founder);
          applyE3Template({businessName:d.name,founderName:d.founder});
          setView('pave');
        });
      } else {
        applyE3Template();
        setView('pave');
      }
    }
    if(a==='lean-save'){
      state.funding=state.funding||emptyFunding();
      state.funding.leanCanvas=readLeanCanvasFromDom();
      syncLeanCanvasEvidence(state.funding.leanCanvas);
      logActivity('Saved Lean Canvas ('+leanCanvasFilledCount(state.funding.leanCanvas)+'/9 boxes)');
      scheduleSave(); render();
      toast(leanCanvasIsSubstantial(state.funding.leanCanvas)
        ? 'Lean Canvas saved — linked to Funding Readiness'
        : 'Lean Canvas saved');
    }
    if(a==='lean-load-denizen'){
      state.funding=state.funding||emptyFunding();
      state.funding.leanCanvas=Object.assign(emptyLeanCanvas(), denizenLeanCanvasDraft(), {updatedAt:nowISO()});
      syncLeanCanvasEvidence(state.funding.leanCanvas);
      logActivity('Loaded DENIZEN Lean Canvas draft');
      scheduleSave(); render(); toast('DENIZEN draft loaded — edit any box, then Save');
    }
    if(a==='lean-clear'){
      state.funding=state.funding||emptyFunding();
      state.funding.leanCanvas=emptyLeanCanvas();
      syncLeanCanvasEvidence(state.funding.leanCanvas);
      scheduleSave(); render(); toast('Canvas cleared');
    }
    if(a==='pave-section'){
      saveActivePave({activity:'Autosaved PAVE before section change'});
      ui.paveSection=act.getAttribute('data-payload')||'snapshot';
      render();
    }
    if(a==='pave-save'){
      const prog=saveActivePave({activity:'Saved PAVE workbook ('+paveFilledCount((activeProgram()||{}).pave)+' fields)'});
      render();
      toast(prog && pavePartBIsSubstantial(prog.pave)
        ? 'PAVE saved — Part B linked to discovery evidence'
        : 'PAVE saved');
    }
    if(a==='pave-load-denizen'){
      const prog=activeProgram();
      if(!prog){ toast('Apply E3 / PAVE first'); return; }
      prog.pave=Object.assign(emptyPave(), denizenPaveDraft(), {updatedAt:nowISO(), reviews:(prog.pave&&prog.pave.reviews)||[]});
      prog.pave=syncPartBFromDiscovery(prog.pave, state, {force:true});
      syncPavePartBEvidence(prog);
      logActivity('Loaded DENIZEN PAVE draft');
      scheduleSave(); render(); toast('DENIZEN PAVE draft loaded — edit any section, then Save');
    }
    if(a==='pave-sync-discovery'){
      const prog=saveActivePave({
        syncDiscovery:{force:true, refreshSummary:true},
        activity:'Refreshed PAVE Part B from discovery evidence'
      });
      render();
      toast(prog ? ('Part B updated from '+countDiscoveryInterviews(state)+' interviews') : 'No program');
    }
    if(a==='pave-ask-why' || a==='pave-suggest'){
      const fieldPath=act.getAttribute('data-payload')||'';
      const kind=a==='pave-ask-why'?'why':'suggest';
      promptForm(kind==='why'?'Ask WHY on this field':'Suggest a change',[
        {name:'text',label:kind==='why'?'Why are you thinking this way? What evidence?':'Suggestion for the founder',required:true}
      ],function(d){
        const prog=activeProgram();
        if(!prog) return;
        prog.pave=readPaveFromDom(prog);
        const review={
          id:uid('prv'), fieldPath:fieldPath, kind:kind, text:d.text,
          authorName:'Mentor', authorRole:'mentor', createdAt:nowISO(), resolved:false, founderReply:''
        };
        prog.pave.reviews=[review].concat(prog.pave.reviews||[]);
        prog.pave.updatedAt=nowISO();
        state.comments=state.comments||[];
        state.comments.unshift({
          id:uid('cmt'), text:d.text, targetType:'pave_field', targetId:prog.id+':'+fieldPath,
          authorName:'Mentor', authorRole:'mentor', visibility:'shared', resolved:false, createdAt:nowISO(),
          kind:kind
        });
        logActivity((kind==='why'?'Mentor WHY on ':'Mentor suggestion on ')+fieldPath);
        scheduleSave(); render(); toast(kind==='why'?'WHY question added':'Suggestion added');
      });
    }
    if(a==='pave-reply-review'){
      const rid=act.getAttribute('data-payload');
      promptForm('Reply to mentor',[
        {name:'reply',label:'Your reply (why you think this way / what you’ll change)',required:true}
      ],function(d){
        const prog=activeProgram();
        if(!prog||!prog.pave) return;
        prog.pave=readPaveFromDom(prog);
        const r=(prog.pave.reviews||[]).find(function(x){return x.id===rid;});
        if(r){ r.founderReply=d.reply; r.resolved=true; }
        prog.pave.updatedAt=nowISO();
        logActivity('Replied to mentor PAVE review');
        scheduleSave(); render(); toast('Reply saved — direction can change anytime');
      });
    }
    if(a==='pave-resolve-review'){
      const prog=activeProgram();
      if(!prog||!prog.pave) return;
      prog.pave=readPaveFromDom(prog);
      const r=(prog.pave.reviews||[]).find(function(x){return x.id===act.getAttribute('data-payload');});
      if(r) r.resolved=true;
      prog.pave.updatedAt=nowISO();
      scheduleSave(); render(); toast('Review marked resolved');
    }
    if(a==='import-stub') toast('Import is Phase 2 — not built yet');
    if(a==='quickadd') quickAddMenu();
    if(a==='create-task') openCreateTask();
    if(a==='create-goal') openCreateGoal();
    if(a==='create-evidence') openCreateEvidence();
    if(a==='create-assumption') openCreateAssumption();
    if(a==='create-experiment') openCreateExperiment();
    if(a==='create-task-from-rec') openCreateTask({title:act.getAttribute('data-payload')||''});
    if(a==='create-metric'){
      promptForm('Add metric',[
        {name:'name',label:'Name',required:true},
        {name:'target',label:'Target',type:'number',value:'1'},
        {name:'current',label:'Current',type:'number',value:'0'},
        {name:'unit',label:'Unit',value:'count'}
      ],function(d){
        state.metrics.push({
          id:uid('met'),key:uid('key'),name:d.name,category:'manual',
          current:Number(d.current)||0,target:Number(d.target)||1,unit:d.unit||'count',
          source:'manual',sharedWithAdvisors:true,updatedAt:nowISO()
        });
        scheduleSave(); render(); toast('Metric added');
      });
    }
    if(a==='save-capital-plan'){
      state.funding=state.funding||emptyFunding();
      const form=document.getElementById('capitalPlanForm');
      if(!form) return;
      const useBox=document.getElementById('capitalUses');
      const typeBox=document.getElementById('capitalTypes');
      state.funding.capitalPlan={
        stage:(form.querySelector('[name=stage]')||{}).value||'pre_revenue',
        amountNeeded:Number((form.querySelector('[name=amountNeeded]')||{}).value)||null,
        uses:useBox?Array.prototype.map.call(useBox.querySelectorAll('input:checked'),function(el){return el.value;}):(state.funding.capitalPlan.uses||[]),
        types:typeBox?Array.prototype.map.call(typeBox.querySelectorAll('input:checked'),function(el){return el.value;}):(state.funding.capitalPlan.types||[]),
        notes:(form.querySelector('[name=notes]')||{}).value||'',
        pathwayStep:(state.funding.capitalPlan&&state.funding.capitalPlan.pathwayStep)||'readiness'
      };
      scheduleSave(); toast('Capital plan saved'); render();
    }
    if(a==='set-pathway-step'){
      state.funding=state.funding||emptyFunding();
      state.funding.capitalPlan=state.funding.capitalPlan||emptyFunding().capitalPlan;
      state.funding.capitalPlan.pathwayStep=act.getAttribute('data-payload')||'readiness';
      scheduleSave(); render();
    }
    if(a==='save-market-sizing'){
      state.funding=state.funding||emptyFunding();
      const form=document.getElementById('marketSizingForm');
      if(!form) return;
      const next={
        tamOrgs:Number((form.querySelector('[name=tamOrgs]')||{}).value)||null,
        samOrgs:Number((form.querySelector('[name=samOrgs]')||{}).value)||null,
        somPct:Number((form.querySelector('[name=somPct]')||{}).value)||null,
        acv:Number((form.querySelector('[name=acv]')||{}).value)||null,
        geography:(form.querySelector('[name=geography]')||{}).value||'',
        buyerWho:(form.querySelector('[name=buyerWho]')||{}).value||'',
        sources:{
          tam:(form.querySelector('[name=srcTam]')||{}).value||'',
          sam:(form.querySelector('[name=srcSam]')||{}).value||'',
          som:(form.querySelector('[name=srcSom]')||{}).value||''
        }
      };
      next.calculated=calcMarketSizing(next);
      state.funding.marketSizing=next;
      scheduleSave(); toast('Market sizing saved'); render();
    }
    if(a==='save-moat-claim'){
      state.funding=state.funding||emptyFunding();
      state.funding.moat=state.funding.moat||emptyFunding().moat;
      state.funding.moat.primaryClaim=(document.getElementById('moatPrimaryClaim')||{}).value||'';
      state.funding.moat.primaryWhy=(document.getElementById('moatPrimaryWhy')||{}).value||'';
      state.funding.moat.primaryCopyDifficulty=(document.getElementById('moatPrimaryCopy')||{}).value||'';
      const monthsRaw=(document.getElementById('moatPrimaryMonths')||{}).value;
      state.funding.moat.primaryMonthsToCopy=monthsRaw!==''&&monthsRaw!=null?Number(monthsRaw):null;
      scheduleSave(); toast('Moat claim flow saved'); render();
    }
    if(a==='link-moat-primary'){
      const opts=(state.evidence||[]).map(function(ev){return {value:ev.id,label:ev.title+' ('+ev.type+')'};});
      if(!opts.length){ toast('Add evidence first'); setView('evidence'); return; }
      promptForm('Link evidence to primary moat claim',[
        {name:'evidenceId',label:'Evidence',type:'select',options:opts,required:true}
      ],function(d){
        const ev=state.evidence.find(function(x){return x.id===d.evidenceId;});
        if(!ev) return;
        ev.moatKey='primary';
        ev.linkedMoatKeys=Array.from(new Set([].concat(ev.linkedMoatKeys||[],['primary'])));
        scheduleSave(); render(); toast('Evidence linked to moat claim');
      });
    }
    if(a==='add-persona'){
      promptForm('Add persona',[
        {name:'name',label:'Persona name',required:true},
        {name:'notes',label:'Notes',type:'textarea'}
      ],function(d){
        state.funding=state.funding||emptyFunding();
        state.funding.discoveryLab=state.funding.discoveryLab||{personas:[],hypotheses:[]};
        state.funding.discoveryLab.personas.push({id:uid('per'),name:d.name,notes:d.notes||'',createdAt:nowISO()});
        scheduleSave(); render(); toast('Persona added');
      });
    }
    if(a==='add-hypothesis'){
      promptForm('Add discovery hypothesis',[
        {name:'title',label:'Hypothesis',required:true},
        {name:'notes',label:'Notes',type:'textarea'}
      ],function(d){
        state.funding=state.funding||emptyFunding();
        state.funding.discoveryLab=state.funding.discoveryLab||{personas:[],hypotheses:[]};
        state.funding.discoveryLab.hypotheses.push({id:uid('hyp'),title:d.title,notes:d.notes||'',createdAt:nowISO()});
        scheduleSave(); render(); toast('Hypothesis added');
      });
    }
    if(a==='add-interview'){
      promptForm('Add discovery interview',[
        {name:'title',label:'Interview title',required:true,value:'Interview — '},
        {name:'persona',label:'Persona / role'},
        {name:'contactId',label:'CRM contact id (optional)',hint:'Links this interview to a CRM contact without inventing CRM data'},
        {name:'contactName',label:'Contact name (optional)'},
        {name:'insights',label:'Insight tags (comma-separated)',hint:'e.g. Problem A, pricing asked, wants pilot'},
        {name:'notes',label:'Notes',type:'textarea'}
      ],function(d){
        const tags=String(d.insights||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
        const exp=(state.experiments||[]).find(function(x){return /interview|discovery/i.test(x.title);})
          ||(state.experiments||[]).find(function(x){return x.method==='customer_interview';});
        const prog=activeProgram();
        const req=((prog&&prog.requirements)||[]).find(function(r){return r.key==='discovery_interviews';});
        const assumptionKey=(exp&&exp.assumptionKey)||(req&&req.linkedAssumptionKey)||null;
        const ev={
          id:uid('ev'),title:d.title,type:'interview',notes:d.notes||'',
          persona:d.persona||'',insightTags:tags,findings:tags,
          fundingKey:'customer_discovery',linkedFundingKeys:['customer_discovery'],
          experimentId:exp?exp.id:null,
          linkedExperimentIds:exp?[exp.id]:[],
          requirementKey:req?req.key:'discovery_interviews',
          linkedRequirementIds:req?[req.id]:[],
          linkedAssumptionKeys:assumptionKey?[assumptionKey]:[],
          contactId:d.contactId||null,
          contactName:d.contactName||null,
          createdAt:nowISO(),
          source:'discovery_lab'
        };
        state.evidence.unshift(ev);
        if(ev.contactId){
          state.relations=state.relations||[];
          state.relations.unshift({
            id:uid('rel'),kind:'crm_contact',contactId:ev.contactId,contactName:ev.contactName,
            evidenceId:ev.id,createdAt:ev.createdAt
          });
        }
        if(exp){
          const ep=experimentProgress(exp, state);
          exp.completedCount=ep.count;
          const asm=(state.assumptions||[]).find(function(a){return a.key===exp.assumptionKey;});
          if(asm){
            asm.confidence=ep.complete?'sufficient_to_decide':'insufficient';
            if(asm.status!=='validated') asm.status='testing';
          }
        }
        // Derive milestone status from requirement evidence
        (state.milestones||[]).forEach(function(m){
          const keys=m.requirementKeys||[];
          if(!keys.length||!prog) return;
          const reqs=(prog.requirements||[]).filter(function(r){return keys.indexOf(r.key)>=0;});
          const rps=reqs.map(function(r){return requirementProgress(state,r);});
          if(rps.length && rps.every(function(r){return r.complete;})) m.status='complete';
          else if(rps.some(function(r){return r.count>0;})) m.status='active';
        });
        (state.goals||[]).forEach(function(g){
          const keys=g.metricKeys||[];
          if(!keys.length) return;
          const metOk=keys.every(function(k){
            const met=(state.metrics||[]).find(function(m){return m.key===k;});
            if(met){
              const n=(state.evidence||[]).filter(function(e){return e.type==='interview';}).length;
              if(met.source==='evidence' && met.key==='discovery_interviews'){
                return n>=Math.max(1,Number(met.target)||1);
              }
              return Number(met.current)>=Math.max(1,Number(met.target)||1);
            }
            const rq=((prog&&prog.requirements)||[]).find(function(r){return r.key===k;});
            return rq?requirementProgress(state,rq).complete:true;
          });
          if(metOk) g.status='complete';
        });
        syncMetricFromEvidence();
        logActivity('Interview evidence: '+d.title);
        scheduleSave(); render(); toast('Interview added — chain updated');
      });
    }
    if(a==='mark-unanswered'){
      state.funding=state.funding||emptyFunding();
      const q=act.getAttribute('data-payload')||'';
      const npc=act.getAttribute('data-npc')||'NPC';
      if(!q) return;
      state.funding.unansweredInvestorQuestions=state.funding.unansweredInvestorQuestions||[];
      if(!state.funding.unansweredInvestorQuestions.some(function(u){return u.question===q && !u.answered;})){
        state.funding.unansweredInvestorQuestions.unshift({
          id:uid('iq'),npc:npc,question:q,answered:false,createdAt:nowISO()
        });
      }
      scheduleSave(); render(); toast('Added to gap list');
    }
    if(a==='answer-investor-q'){
      const q=act.getAttribute('data-payload')||'';
      promptForm('Record answer',[
        {name:'answer',label:'Your answer / evidence note',type:'textarea',required:true}
      ],function(d){
        state.funding=state.funding||emptyFunding();
        state.funding.unansweredInvestorQuestions=(state.funding.unansweredInvestorQuestions||[]).map(function(u){
          if(u.question===q) return Object.assign({},u,{answered:true,answer:d.answer,answeredAt:nowISO()});
          return u;
        });
        state.evidence.unshift({
          id:uid('ev'),title:'Investor Q: '+q.slice(0,60),type:'document',
          notes:d.answer,fundingKey:'investor_qa',linkedFundingKeys:['investor_qa'],createdAt:nowISO()
        });
        scheduleSave(); render(); toast('Answer recorded as evidence');
      });
    }
    if(a==='invite-advisor'){
      const form=document.getElementById('inviteAdvisor');
      if(!form) return;
      const name=form.querySelector('[name=name]').value.trim();
      const email=form.querySelector('[name=email]').value.trim();
      const role=form.querySelector('[name=role]').value;
      if(!name||!email){ toast('Name and email required'); return; }
      const advisor={
        id:uid('adv'),name:name,email:email,role:role,
        share:Object.assign({}, (state.config&&state.config.mentorShareDefaults)||{}),
        invitedAt:nowISO()
      };
      if(remoteSyncEnabled){
        postStudioApi('/api/business-studio/advisors',{name:name,email:email,role:role,share:advisor.share})
          .then(function(data){
            if(data.advisors) state.advisors=data.advisors;
            else state.advisors.unshift(advisor);
            persistLocal(); render(); toast('Advisor invited');
          })
          .catch(function(err){ toast(err.message||'Invite failed'); });
        return;
      }
      state.advisors.push(advisor);
      logActivity('Invited advisor '+name);
      scheduleSave(); render(); toast('Advisor invited');
    }
    if(a==='add-recommendation'){
      const title=(document.getElementById('recTitle')||{}).value||'';
      const body=(document.getElementById('recBody')||{}).value||'';
      if(!title.trim()){ toast('Title required'); return; }
      if(remoteSyncEnabled){
        postStudioApi('/api/business-studio/recommendations',{title:title.trim(),body:body.trim()})
          .then(function(data){
            if(data.recommendation) state.recommendations.unshift(data.recommendation);
            persistLocal(); render(); toast('Recommendation added');
          })
          .catch(function(err){ toast(err.message||'Recommendation failed'); });
        return;
      }
      state.recommendations.unshift({
        id:uid('rec'),title:title.trim(),body:body.trim(),
        advisorName:'Advisor',advisorEmail:'',status:'pending',
        toRole:'founder',createdAt:nowISO()
      });
      scheduleSave(); render(); toast('Recommendation added');
    }
    if(a==='save-business'){
      if(!state.business) return;
      state.business.name=(document.getElementById('setBizName')||{}).value||state.business.name;
      state.business.founderName=(document.getElementById('setFounderName')||{}).value||state.business.founderName;
      scheduleSave(); toast('Saved'); render();
    }
    if(a==='sync-now'){
      pushRemoteWorkspace().then(function(){ toast('Sync attempted'); }).catch(function(){ toast('Sync failed — local only'); });
    }
    if(a==='reset-workspace'){
      if(confirm('Reset local Business Studio workspace?')){
        state=emptyState();
        window.storage.removeItem('workspace');
        scheduleSave(); render(); toast('Workspace reset');
      }
    }
    return;
  }

  const td=e.target.closest('[data-task-done]');
  if(td){
    const id=td.getAttribute('data-task-done');
    const task=state.tasks.find(function(x){return x.id===id;});
    if(task){ task.status='done'; task.completedAt=nowISO(); scheduleSave(); render(); }
    return;
  }
  const dt=e.target.closest('[data-del-task]');
  if(dt){
    state.tasks=state.tasks.filter(function(x){return x.id!==dt.getAttribute('data-del-task');});
    scheduleSave(); render(); return;
  }
  const dg=e.target.closest('[data-del-goal]');
  if(dg){
    state.goals=state.goals.filter(function(x){return x.id!==dg.getAttribute('data-del-goal');});
    scheduleSave(); render(); return;
  }
  const gs=e.target.closest('[data-goal-status]');
  if(gs){
    const g=state.goals.find(function(x){return x.id===gs.getAttribute('data-goal-status');});
    if(g){ g.status=gs.getAttribute('data-status')||'done'; scheduleSave(); render(); }
    return;
  }
  const de=e.target.closest('[data-del-evidence]');
  if(de){
    state.evidence=state.evidence.filter(function(x){return x.id!==de.getAttribute('data-del-evidence');});
    syncMetricFromEvidence();
    scheduleSave(); render(); return;
  }
  const sp=e.target.closest('[data-select-program]');
  if(sp){
    ui.selectedProgramId=sp.getAttribute('data-select-program');
    const p=state.programs.find(function(x){return x.id===ui.selectedProgramId;});
    state.programs.forEach(function(x){ x.status = (p && x.id===p.id) ? 'active' : (x.status==='active'?'paused':x.status); });
    scheduleSave(); render(); return;
  }
  const savePave=e.target.closest('[data-save-pave]');
  if(savePave){
    setView('pave');
    return;
  }
  const node=e.target.closest('[data-node]');
  if(node){
    ui.selectedNodeId=node.getAttribute('data-node');
    render(); return;
  }
  const sn=e.target.closest('[data-save-node]');
  if(sn){
    const n=state.strategyNodes.find(function(x){return x.id===sn.getAttribute('data-save-node');});
    if(n){
      n.label=(document.getElementById('nodeLabel')||{}).value||n.label;
      n.text=(document.getElementById('nodeText')||{}).value||n.text;
      scheduleSave(); toast('Node saved'); render();
    }
    return;
  }
  const ar=e.target.closest('[data-accept-rec]');
  if(ar){
    const id=ar.getAttribute('data-accept-rec');
    const r=state.recommendations.find(function(x){return x.id===id;});
    if(!r) return;
    if(remoteSyncEnabled){
      postStudioApi('/api/business-studio/recommendations/respond',{id:id,decision:'accepted'})
        .then(function(data){
          r.status='accepted';
          if(data.task) state.tasks.unshift(data.task);
          persistLocal(); render(); toast('Accepted — task created');
        })
        .catch(function(err){ toast(err.message||'Accept failed'); });
      return;
    }
    r.status='accepted';
    state.tasks.unshift({
      id:uid('task'),title:r.title,status:'todo',priority:'medium',due:null,
      source:'mentor_recommendation',recommendationId:r.id,createdAt:nowISO(),
      notes:r.body
    });
    logActivity('Accepted mentor recommendation');
    scheduleSave(); render(); toast('Accepted — task created');
    return;
  }
  const dr=e.target.closest('[data-decline-rec]');
  if(dr){
    const id=dr.getAttribute('data-decline-rec');
    const r=state.recommendations.find(function(x){return x.id===id;});
    if(!r) return;
    if(remoteSyncEnabled){
      postStudioApi('/api/business-studio/recommendations/respond',{id:id,decision:'declined'})
        .then(function(){
          r.status='declined'; persistLocal(); render(); toast('Declined');
        })
        .catch(function(err){ toast(err.message||'Decline failed'); });
      return;
    }
    r.status='declined'; scheduleSave(); render(); toast('Declined');
    return;
  }
  const da=e.target.closest('[data-del-advisor]');
  if(da){
    state.advisors=state.advisors.filter(function(x){return x.id!==da.getAttribute('data-del-advisor');});
    scheduleSave(); render(); return;
  }
  const um=e.target.closest('[data-update-metric]');
  if(um){
    const m=state.metrics.find(function(x){return x.id===um.getAttribute('data-update-metric');});
    if(!m) return;
    promptForm('Update metric',[
      {name:'current',label:'Current value',type:'number',value:String(m.current),required:true}
    ],function(d){
      m.current=Number(d.current)||0;
      m.updatedAt=nowISO();
      scheduleSave(); render(); toast('Metric updated');
    });
    return;
  }
  const lf=e.target.closest('[data-link-funding]');
  if(lf){
    const key=lf.getAttribute('data-link-funding');
    const opts=(state.evidence||[]).map(function(ev){return {value:ev.id,label:ev.title+' ('+ev.type+')'};});
    if(!opts.length){
      toast('Add evidence first, then link it here');
      setView('evidence');
      return;
    }
    promptForm('Link evidence to '+key,[
      {name:'evidenceId',label:'Evidence',type:'select',options:opts,required:true}
    ],function(d){
      const ev=state.evidence.find(function(x){return x.id===d.evidenceId;});
      if(!ev) return;
      ev.fundingKey=key;
      ev.linkedFundingKeys=Array.from(new Set([].concat(ev.linkedFundingKeys||[],[key])));
      scheduleSave(); render(); toast('Evidence linked to '+key);
    });
    return;
  }
  const sm=e.target.closest('[data-save-moat]');
  if(sm){
    const key=sm.getAttribute('data-save-moat');
    state.funding=state.funding||emptyFunding();
    state.funding.moat=state.funding.moat||{sources:{},primaryClaim:''};
    state.funding.moat.sources=state.funding.moat.sources||{};
    const statusEl=document.querySelector('[data-moat-status="'+key+'"]');
    const monthsEl=document.querySelector('[data-moat-months="'+key+'"]');
    const claimEl=document.querySelector('[data-moat-claim="'+key+'"]');
    state.funding.moat.sources[key]={
      status:(statusEl&&statusEl.value)||'none',
      monthsToCopy:monthsEl&&monthsEl.value!==''?Number(monthsEl.value):null,
      claim:(claimEl&&claimEl.value)||'',
      evidenceIds:(state.funding.moat.sources[key]&&state.funding.moat.sources[key].evidenceIds)||[]
    };
    scheduleSave(); toast('Moat source saved'); render();
    return;
  }
});

document.addEventListener('change', function(e){
  if(e.target && e.target.id==='advisorModeToggle'){
    state.config=state.config||emptyConfig();
    state.config.advisorMode=!!e.target.checked;
    if(state.config.advisorMode) state.config.investorMode=false;
    try{
      const u=new URL(location.href);
      if(state.config.advisorMode) u.searchParams.set('view','advisor');
      else u.searchParams.delete('view');
      history.replaceState(null,'',u);
    }catch(err){}
    scheduleSave(); render();
  }
  if(e.target && e.target.id==='investorViewToggle'){
    state.config=state.config||emptyConfig();
    state.config.investorMode=!!e.target.checked;
    if(state.config.investorMode) state.config.advisorMode=false;
    try{
      const u=new URL(location.href);
      if(state.config.investorMode) u.searchParams.set('view','investor');
      else u.searchParams.delete('view');
      history.replaceState(null,'',u);
    }catch(err){}
    scheduleSave(); render(); toast(state.config.investorMode?'Investor view on — only shared diligence':'Investor view off');
  }
  if(e.target && e.target.id==='setAdvisorMode'){
    state.config=state.config||emptyConfig();
    state.config.advisorMode=!!e.target.checked;
    scheduleSave(); render();
  }
  const share=e.target.closest('[data-share]');
  if(share && e.target.matches('input[type=checkbox]')){
    const id=share.getAttribute('data-share');
    const key=share.getAttribute('data-key');
    const adv=state.advisors.find(function(a){return a.id===id;});
    if(adv){
      adv.share=adv.share||{};
      adv.share[key]=!!e.target.checked;
      scheduleSave();
    }
  }
  if(e.target && e.target.hasAttribute('data-investor-share')){
    const key=e.target.getAttribute('data-investor-share');
    state.funding=state.funding||emptyFunding();
    state.funding.dataRoom=state.funding.dataRoom||{sharedWithInvestors:{}};
    state.funding.dataRoom.sharedWithInvestors=state.funding.dataRoom.sharedWithInvestors||{};
    state.funding.dataRoom.sharedWithInvestors[key]=!!e.target.checked;
    scheduleSave();
  }
});

/* ---------- 15. Boot ---------- */
(function boot(){
  loadLocal();
  try{
    const q=new URLSearchParams(location.search);
    if(q.get('view')==='advisor'){
      state.config=state.config||emptyConfig();
      state.config.advisorMode=true;
      ui.view='mentors';
    }
    if(q.get('view')==='investor'){
      state.config=state.config||emptyConfig();
      state.config.investorMode=true;
      ui.view='dataroom';
    }
    // tab wins so mentors can deep-link into PAVE / Lean Canvas while in advisor mode
    if(q.get('tab') && NAV.some(function(n){return n.id===q.get('tab');})) ui.view=q.get('tab');
  }catch(e){}
  render();
  bootstrapSync().then(function(){ render(); }).catch(function(){});
  var fitTimer=null;
  window.addEventListener('resize', function(){
    clearTimeout(fitTimer);
    fitTimer=setTimeout(fitAllBoards, 80);
  });
  window.addEventListener('orientationchange', function(){
    setTimeout(fitAllBoards, 120);
  });
})();
</script>
</body>
