<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send feedback</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #020617;
      color: #e2e8f0;
    }
    .card {
      width: min(420px, calc(100vw - 24px));
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      background: rgba(15, 23, 42, 0.98);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 17px;
      line-height: 1.3;
    }
    p {
      margin: 0 0 14px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: #cbd5e1;
    }
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #0b1220;
      color: #f8fafc;
      font: inherit;
      font-size: 13px;
    }
    select {
      padding: 9px 10px;
      margin-bottom: 12px;
    }
    textarea {
      min-height: 120px;
      padding: 10px;
      resize: vertical;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 16px;
    }
    button {
      border: 1px solid #475569;
      background: #1e293b;
      color: #f8fafc;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    button.primary { background: #2563eb; border-color: #3b82f6; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: #fca5a5; font-size: 12px; min-height: 16px; margin-top: 8px; }
    .success { color: #86efac; font-size: 12px; min-height: 16px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Send feedback</h1>
    <p>Tell us what happened. We include your app version and platform to help investigate.</p>

    <label for="feedback-event">Topic</label>
    <select id="feedback-event">
      <option value="bug">Bug</option>
      <option value="pairing">Pairing</option>
      <option value="wizard">Setup wizard</option>
      <option value="permission">Permission</option>
      <option value="other">Other</option>
    </select>

    <label for="feedback-message">Message</label>
    <textarea id="feedback-message" placeholder="What went wrong or what would you like to see improved?"></textarea>

    <div class="actions">
      <button id="btn-cancel" type="button">Cancel</button>
      <button id="btn-send" class="primary" type="button">Send</button>
    </div>
    <div class="error" id="feedback-error"></div>
    <div class="success" id="feedback-success"></div>
  </div>

  <script>
    function setError(msg) {
      const el = document.getElementById('feedback-error');
      const ok = document.getElementById('feedback-success');
      if (ok) ok.textContent = '';
      if (el) el.textContent = msg || '';
    }

    function setSuccess(msg) {
      const el = document.getElementById('feedback-success');
      const err = document.getElementById('feedback-error');
      if (err) err.textContent = '';
      if (el) el.textContent = msg || '';
    }

    async function sendFeedback() {
      const messageEl = document.getElementById('feedback-message');
      const eventEl = document.getElementById('feedback-event');
      const sendBtn = document.getElementById('btn-send');
      const cancelBtn = document.getElementById('btn-cancel');
      const message = String(messageEl?.value || '').trim();
      const event = String(eventEl?.value || 'other');

      if (!message) {
        setError('Please enter a message.');
        return;
      }

      if (sendBtn) sendBtn.disabled = true;
      if (cancelBtn) cancelBtn.disabled = true;
      setError('');
      setSuccess('');

      try {
        const result = await window.DenizenDesktop?.sendFeedback?.({ message, event });
        if (result?.ok) {
          setSuccess('Thanks — your feedback was sent.');
          setTimeout(() => window.close(), 800);
          return;
        }
        setError(result?.error || 'Could not send feedback.');
      } catch (err) {
        setError(err?.message || String(err));
      }

      if (sendBtn) sendBtn.disabled = false;
      if (cancelBtn) cancelBtn.disabled = false;
    }

    document.getElementById('btn-send')?.addEventListener('click', () => { void sendFeedback(); });
    document.getElementById('btn-cancel')?.addEventListener('click', () => window.close());
  </script>
</body>
</html>
