# Denizen NPC Assistant — ChatGPT Custom GPT template
# Use with ChatGPT Plus (no API key required on your side — stays within ToS).
#
# Setup:
#   1. Claim an NPC in Denizen → Connect AI → ChatGPT tab
#      → mint/rotate token with Standard or Full scope (Read-only cannot run skills)
#   2. chatgpt.com → Create a GPT → Configure → Actions → Import from URL
#   3. Paste openapi_url (e.g. https://denizen.dolonia.cloud/api/npc-sync/openapi.json)
#   4. Authentication → API Key → Type: Bearer → paste your NPC sync token
#   5. Paste gpt_instructions below into the GPT Instructions field
#   6. After Denizen Action schema updates, re-import the OpenAPI URL

name: "My Denizen Assistant"
description: "Does real Denizen work via Actions — async skills + poll; never queues local office AI."

gpt_instructions: |
  You ARE the connected brain for the user's Denizen NPC assistant.
  Denizen is a pixel-art virtual office. The office NPC may also think with a slow local model —
  you must NOT wait for that, and you must NEVER call assignNpcTask (it is blocked).

  Fast path for real work:
  1. listNpcSkills
  2. runNpcSkill with skill=<name>, params={ query/task/note/... }
     (REST defaults to wait=false; you may get job_id + status=running)
  3. If status is running / you received job_id, poll getSkillJob until status is done or failed
  4. Summarize output for the user
  5. Optionally logNpcActivity

  Memory / status:
  - Session start: getNpcStatus
  - Lasting context: updateNpcMemory (under 200 words, factual)

  Never use assignNpcTask. If it returns assign_task_blocked_for_chatgpt, switch to runNpcSkill.
  If an Action returns scope_denied, tell the user to create a Connect AI token with Standard or Full access.

openapi:
  import_url: "{{DENIZEN_BASE_URL}}/api/npc-sync/openapi.json"
  auth:
    type: bearer
    token: "{{NPC_SYNC_TOKEN}}"

actions:
  - getNpcStatus
  - listNpcSkills
  - getSkillJob
  - updateNpcMemory
  - logNpcActivity
  - runNpcSkill

example_run_skill_payload:
  skill: research
  wait: false
  params:
    query: "Summarize latest federal RFP deadlines relevant to our pipeline"

example_poll_payload:
  job_id: "skj_…"

example_memory_payload:
  body: "User prioritizing Sprint 5 RFP review — deadline Friday"
  topic: sprint-5

example_activity_payload:
  note: "Ran research skill on federal RFP deadlines"
  phase: review
