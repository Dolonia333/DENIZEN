<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NPC Work Anim Mock — Denizen</title>
<style>
  :root {
    --bg: #1a2332;
    --panel: #243044;
    --line: #3d4f66;
    --text: #e8eef6;
    --muted: #8fa3b8;
    --accent: #5bb8a0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 14px "IBM Plex Sans", "Segoe UI", sans-serif;
  }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
    padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 16px; color: var(--accent); letter-spacing: .02em; }
  header .caption {
    flex: 1; min-width: 220px; color: var(--muted); font-size: 13px;
  }
  header .caption strong { color: var(--text); font-weight: 600; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    appearance: none; border: 1px solid var(--line); background: #152033;
    color: var(--text); border-radius: 8px; padding: 7px 12px; font: inherit;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.active { background: var(--accent); border-color: var(--accent); color: #082018; }
  #stage-wrap {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    padding: 16px; background:
      radial-gradient(ellipse at 50% 30%, #2a3a52 0%, transparent 55%),
      var(--bg);
  }
  #game-host {
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
    background: #2d3f2f;
  }
  footer {
    padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel);
    color: var(--muted); font-size: 12px;
  }
  footer code { color: #b7c9db; }
</style>
</head>
<body>
<header>
  <h1>NPC work anim mock</h1>
  <div class="caption" id="caption"><strong>Booting…</strong></div>
  <div class="btns">
    <button type="button" data-scene="compare" class="active">1 · Before / after water</button>
    <button type="button" data-scene="water">2 · Pour plant</button>
    <button type="button" data-scene="work">3 · Work chips</button>
    <button type="button" data-scene="coffee">4 · Pick up coffee</button>
    <button type="button" data-scene="loop">▶ Auto loop</button>
  </div>
</header>
<div id="stage-wrap"><div id="game-host"></div></div>
<footer>
  Uses LimeZu garden watering can (tip + stream) and LimeZu steaming mug + modern-office coffee machine.
  Demo only — press scenes or leave on Auto loop.
</footer>

<script src="/vendor/phaser/phaser.min.js"></script>
<script>
(() => {
  const W = 720, H = 420;
  const CAPTIONS = {
    compare: '<strong>Before vs after</strong> — left: emoji-only 💧. Right: tip can + pour stream.',
    water: '<strong>Plant pour</strong> — walk up, lift LimeZu can, tip spout, stream into soil, empty can.',
    work: '<strong>Work chips</strong> — same XP body, clearer job labels for code / research / terminal.',
    coffee: '<strong>Coffee pickup</strong> — brew at machine, lift steaming LimeZu mug, walk away holding it.',
    loop: '<strong>Auto loop</strong> — cycling all mock scenes.',
  };

  let api = null;

  function setCaption(key) {
    document.getElementById('caption').innerHTML = CAPTIONS[key] || '';
    document.querySelectorAll('button[data-scene]').forEach((b) => {
      b.classList.toggle('active', b.dataset.scene === key);
    });
  }

  function makeChip(scene, text, color, x, y) {
    const bg = color || '#e0f2fe';
    const ink = color === '#4ade80' ? '#052e16'
      : color === '#22d3ee' ? '#083344'
      : color === '#60a5fa' ? '#0c4a6e'
      : color === '#fbbf24' ? '#422006'
      : '#0c4a6e';
    const t = scene.add.text(x, y, text, {
      fontSize: '12px',
      fontFamily: 'monospace',
      fontStyle: 'bold',
      color: ink,
      backgroundColor: bg + 'ee',
      padding: { x: 6, y: 3 },
    });
    t.setOrigin(0.5, 1);
    t.setDepth(50);
    return t;
  }

  function makeEmote(scene, symbol, x, y) {
    return makeChip(scene, symbol, '#e0f2fe', x, y);
  }

  class MockScene extends Phaser.Scene {
    constructor() {
      super('mock');
      this._cleanup = [];
      this._npc = null;
      this._plant = null;
      this._machine = null;
      this._desk = null;
      this._can = null;
      this._mug = null;
      this._mugCup = null;
      this._playing = null;
      this._holdFollow = null;
      this._sceneGen = 0;
    }

    preload() {
      this.load.spritesheet('abby', '/assets/Abby.png', { frameWidth: 32, frameHeight: 48 });
      this.load.image('plant', '/assets/modern_office/named/plant_floor_leafy.png');
      this.load.image('can_full', '/assets/limezu/ext/singles/17_garden/ME_Singles_Garden_16x16_Green_Watering_Can_Left_Full.png');
      this.load.image('can_empty', '/assets/limezu/ext/singles/17_garden/ME_Singles_Garden_16x16_Green_Watering_Can_Left_Empty.png');
      this.load.image('machine', '/assets/modern_office/named/coffee_machine_desk.png');
      this.load.spritesheet('mug', '/assets/limezu/animated/coffee.png', { frameWidth: 16, frameHeight: 32 });
      this.load.image('mug_cup', '/assets/limezu/animated/coffee_cup_only.png');
    }

    create() {
      const g = this.add.graphics();
      g.fillStyle(0x3a4d3a, 1);
      g.fillRect(0, 0, W, H);
      g.lineStyle(1, 0x2a382a, 0.5);
      for (let x = 0; x < W; x += 32) g.lineBetween(x, 0, x, H);
      for (let y = 0; y < H; y += 32) g.lineBetween(0, y, W, y);

      this._desk = this.add.rectangle(520, 250, 90, 48, 0x6b5344).setDepth(2);
      this.add.rectangle(520, 228, 70, 10, 0x89a4b8).setDepth(3);

      this._plant = this.add.image(200, 210, 'plant').setOrigin(0.5, 1).setDepth(5).setScale(1.4);
      this.add.text(200, 220, 'office plant', {
        fontSize: '10px', fontFamily: 'monospace', color: '#c5d4c5',
      }).setOrigin(0.5, 0).setDepth(5);

      this.anims.create({
        key: 'walk_down',
        frames: this.anims.generateFrameNumbers('abby', { start: 0, end: 3 }),
        frameRate: 10, repeat: -1,
      });
      this.anims.create({
        key: 'walk_left',
        frames: this.anims.generateFrameNumbers('abby', { start: 4, end: 7 }),
        frameRate: 10, repeat: -1,
      });
      this.anims.create({
        key: 'walk_right',
        frames: this.anims.generateFrameNumbers('abby', { start: 8, end: 11 }),
        frameRate: 10, repeat: -1,
      });
      this.anims.create({
        key: 'walk_up',
        frames: this.anims.generateFrameNumbers('abby', { start: 12, end: 15 }),
        frameRate: 10, repeat: -1,
      });
      this.anims.create({
        key: 'mug_steam',
        frames: this.anims.generateFrameNumbers('mug', { start: 0, end: 5 }),
        frameRate: 6, repeat: -1,
      });

      // Coffee machine (modern office) + resting mug on top
      this._machine = this.add.image(120, 300, 'machine').setOrigin(0.5, 1).setDepth(6).setScale(2.4);
      this.add.text(120, 310, 'coffee machine', {
        fontSize: '10px', fontFamily: 'monospace', color: '#c5d4c5',
      }).setOrigin(0.5, 0).setDepth(6);

      this._mug = this.add.sprite(120, 286, 'mug', 0).setOrigin(0.5, 0.72).setDepth(8).setScale(1.4).setVisible(false);
      this._mugCup = this.add.image(0, 0, 'mug_cup').setOrigin(0.5, 0.55).setDepth(21).setScale(1.7).setVisible(false);

      this._npc = this.add.sprite(420, 280, 'abby', 0).setOrigin(0.5, 1).setDepth(10).setScale(1.5);
      // Origin near the handle (right side) so the can body sits in her hands, spout out front
      this._can = this.add.image(0, 0, 'can_full').setOrigin(0.78, 0.62).setDepth(12).setScale(1.35).setVisible(false);

      this.add.text(16, 12, 'DENIZEN · work visibility mock', {
        fontSize: '11px', fontFamily: 'monospace', color: '#9eb0a0',
      }).setDepth(100);

      api = { play: (name) => this.playScene(name) };
      window.__npcAnimMock = api;
      // Do not auto-play — avoids double-start races with button clicks / refresh.
      setCaption('water');
      setTimeout(() => { if (this._sceneGen === 0) this.playScene('water'); }, 400);
    }

    clearFx() {
      for (const o of this._cleanup) {
        try { o.destroy(); } catch (_) {}
      }
      this._cleanup = [];
      // Kill tweens only — do NOT removeAllEvents (that aborts in-flight walks).
      try { this.tweens.killAll(); } catch (_) {}
      if (this._holdFollow) {
        try { this._holdFollow.remove(false); } catch (_) {}
        this._holdFollow = null;
      }
      this._can.setVisible(false);
      this._can.setAngle(0);
      this._can.setTexture('can_full');
      this._mug.setVisible(false);
      this._mug.anims.stop();
      try { this._mug.setCrop(); } catch (_) {}
      this._mug.setOrigin(0.5, 1);
      this._mug.setFrame(0);
      this._mug.setAngle(0);
      this._mug.setScale(1.4);
      this._mug.setPosition(120, 286);
      if (this._mugCup) this._mugCup.setVisible(false);
      this._npc.anims.stop();
      this._npc.setPosition(420, 280);
      this._npc.setFrame(0);
      // Reset sit-crop from work scene
      try { this._npc.setCrop(); } catch (_) {}
      this._npc.setScale(1.5);
      this._npc.clearTint();
      this._npc.setVisible(true);
      this._npc.setAlpha(1);
    }

    track(obj) {
      this._cleanup.push(obj);
      return obj;
    }

    wait(ms) {
      const gen = this._sceneGen;
      // Wall clock — Phaser time can stall if the scene clock glitches
      return new Promise((r) => setTimeout(() => r(this._sceneGen === gen), ms));
    }

    alive(gen) {
      return this._sceneGen === gen && this._playing != null;
    }

    /** Step-walk with hard timeout so a scene can never hang mid-move. */
    walkTo(x, y, anim, ms = 1400) {
      return this._walkSpriteTo(this._npc, x, y, anim, ms);
    }

    walkSprite(sprite, x, y, anim, ms) {
      return this._walkSpriteTo(sprite, x, y, anim, ms);
    }

    _walkSpriteTo(sprite, x, y, anim, ms) {
      const gen = this._sceneGen;
      const x0 = sprite.x;
      const y0 = sprite.y;
      try { sprite.anims.play(anim, true); } catch (_) {}
      return new Promise((resolve) => {
        let done = false;
        const finish = (ok) => {
          if (done) return;
          done = true;
          try { sprite.anims.stop(); } catch (_) {}
          if (ok) { sprite.x = x; sprite.y = y; }
          resolve(ok);
        };
        const steps = Math.max(8, Math.round(ms / 32));
        let i = 0;
        const step = () => {
          if (this._sceneGen !== gen) { finish(false); return; }
          i += 1;
          const t = Math.min(1, i / steps);
          sprite.x = x0 + (x - x0) * t;
          sprite.y = y0 + (y - y0) * t;
          if (t >= 1) finish(true);
          else setTimeout(step, ms / steps);
        };
        // Hard ceiling on wall clock — never hang a scene
        setTimeout(() => finish(this._sceneGen === gen), ms + 500);
        setTimeout(step, 0);
      });
    }

    /** Face-aware mug hold — cup-only sprite parked on the mouth. */
    mugMouthOffset() {
      const f = this._npc.frame?.index ?? 0;
      // Abby 32x48 @ 1.5 → mouth between the cheek pixels (~52px above feet)
      const y = -52;
      if (f >= 4 && f <= 7) return { x: -1, y };      // facing left
      if (f >= 8 && f <= 11) return { x: 1, y };       // facing right
      if (f >= 12) return { x: 0, y: -56 };             // facing up
      return { x: 0, y };                              // facing down/camera
    }

    holdMugAtMouth() {
      // Hide the tall steaming sheet — use the tight cup-only image
      this._mug.anims.stop();
      this._mug.setVisible(false);
      this._mugCup.setVisible(true);
      this._mugCup.setDepth(21);
      this._mugCup.setScale(1.7);
      this.stopFollow();
      const tick = () => {
        if (!this._mugCup?.active || !this._npc?.active) return;
        const o = this.mugMouthOffset();
        this._mugCup.x = this._npc.x + o.x;
        this._mugCup.y = this._npc.y + o.y;
      };
      tick();
      this._holdFollow = setInterval(tick, 16);
    }

    /** Keep prop glued to NPC hand while held (wall-clock interval). */
    followHand(prop, ox, oy, also = null) {
      this.stopFollow();
      const tick = () => {
        if (!prop || !prop.active || !this._npc || !this._npc.active) return;
        prop.x = this._npc.x + ox;
        prop.y = this._npc.y + oy;
        if (also) also(prop, this._npc);
      };
      tick();
      this._holdFollow = setInterval(tick, 16);
      return this._holdFollow;
    }

    stopFollow() {
      if (this._holdFollow) {
        try { clearInterval(this._holdFollow); } catch (_) {}
        this._holdFollow = null;
      }
    }

    tweenProp(targets, props, duration) {
      return new Promise((resolve) => {
        const start = {};
        for (const k of Object.keys(props)) start[k] = targets[k];
        const t0 = performance.now();
        const step = (now) => {
          const t = Math.min(1, (now - t0) / duration);
          for (const k of Object.keys(props)) {
            targets[k] = start[k] + (props[k] - start[k]) * t;
          }
          if (t < 1) requestAnimationFrame(step);
          else resolve();
        };
        requestAnimationFrame(step);
      });
    }

    /** Spout tip in world space — handle-gripped left-facing can. */
    canSpoutWorld() {
      const ang = Phaser.Math.DegToRad(this._can.angle);
      // Local spout offset from handle origin (spout is far left of the can art)
      const lx = -20;
      const ly = -3;
      const cos = Math.cos(ang);
      const sin = Math.sin(ang);
      return {
        x: this._can.x + lx * cos - ly * sin,
        y: this._can.y + lx * sin + ly * cos,
      };
    }

    emitPourStream(targetX, targetY, bursts = 10) {
      for (let i = 0; i < bursts; i++) {
        setTimeout(() => {
          if (!this._can || !this._can.visible) return;
          const spout = this.canSpoutWorld();
          const drop = this.track(this.add.circle(
            spout.x + Phaser.Math.Between(-1, 1),
            spout.y,
            2.2 + Math.random() * 1.2,
            0x7ec8e3,
          ).setDepth(16).setAlpha(0.98));
          const x1 = drop.x;
          const y1 = drop.y;
          const x2 = targetX + Phaser.Math.Between(-6, 6);
          const y2 = targetY + Phaser.Math.Between(-2, 4);
          const dur = 360 + Math.random() * 100;
          const t0 = performance.now();
          const step = (now) => {
            if (!drop.active) return;
            const t = Math.min(1, (now - t0) / dur);
            drop.x = x1 + (x2 - x1) * t;
            drop.y = y1 + (y2 - y1) * t;
            drop.setAlpha(0.98 * (1 - t * 0.8));
            if (t < 1) requestAnimationFrame(step);
            else {
              try { drop.destroy(); } catch (_) {}
            }
          };
          requestAnimationFrame(step);
        }, i * 70);
      }
    }

    async pourOntoPlant(plantX, plantY, gen) {
      if (!this.alive(gen)) return false;
      this._can.setTexture('can_full');
      this._can.setVisible(true);
      this._can.setDepth(20);
      this._can.setAngle(0);
      this._can.setScale(1.5);
      // Grip centered on torso; when facing the plant, can sits in front of her
      this.followHand(this._can, 0, -16);
      if (!(await this.wait(350))) return false;
      // Mild tip so the can body doesn't swing up beside her head
      await this.tweenProp(this._can, { angle: -28, scale: 1.6 }, 650);
      if (!this.alive(gen)) return false;
      // Hold tipped while streaming so the pour reads clearly
      this.emitPourStream(plantX, plantY - 8, 16);
      if (!(await this.wait(1400))) return false;
      // Empty after pour
      this._can.setTexture('can_empty');
      if (!(await this.wait(500))) return false;
      // Untip
      await this.tweenProp(this._can, { angle: 0, scale: 1.5 }, 420);
      if (!(await this.wait(400))) return false;
      return true;
    }

    async playScene(name) {
      const gen = (this._sceneGen = (this._sceneGen || 0) + 1);
      this._playing = name;
      this.clearFx();
      if (name === 'compare') await this.sceneCompare(gen);
      else if (name === 'water') await this.sceneWater(gen);
      else if (name === 'work') await this.sceneWork(gen);
      else if (name === 'coffee') await this.sceneCoffee(gen);
      else if (name === 'loop') await this.sceneLoop(gen);
    }

    async sceneCompare(gen) {
      this.track(this.add.sprite(160, 300, 'abby', 12).setOrigin(0.5, 1).setScale(1.5).setDepth(10));
      this.track(this.add.image(160, 230, 'plant').setOrigin(0.5, 1).setScale(1.3).setDepth(5));
      this.track(makeEmote(this, '💧', 172, 248));
      this.track(this.add.text(160, 330, 'BEFORE\nemoji only', {
        fontSize: '12px', fontFamily: 'monospace', color: '#f0c27a', align: 'center',
      }).setOrigin(0.5, 0).setDepth(20));

      this.track(this.add.rectangle(360, 210, 2, 260, 0x5a6a5a).setDepth(4));

      const rightPlant = this.track(this.add.image(560, 210, 'plant').setOrigin(0.5, 1).setScale(1.3).setDepth(5));
      this._npc.setPosition(560, 320);
      this._npc.setFrame(0);
      if (!(await this.walkTo(560, 250, 'walk_up', 900))) return;
      if (!this.alive(gen)) return;
      this._npc.setFrame(12);
      await this.pourOntoPlant(rightPlant.x, rightPlant.y - 18, gen);
      if (!this.alive(gen)) return;
      this.track(makeEmote(this, '💦', this._npc.x + 10, this._npc.y - 54));
      this.track(this.add.text(560, 330, 'AFTER\ntip + pour', {
        fontSize: '12px', fontFamily: 'monospace', color: '#8fd6b5', align: 'center',
      }).setOrigin(0.5, 0).setDepth(20));
      if (!(await this.wait(900))) return;
      this.stopFollow();
      this._can.setVisible(false);
    }

    async sceneWater(gen) {
      try { this._npc.setCrop(); } catch (_) {}
      this._npc.setScale(1.5);
      this._npc.clearTint();
      // Start near plant, short walk in, then pour (prop tip is the point of the demo)
      this._npc.setPosition(280, 240);
      this._npc.setFrame(4);
      this.track(makeChip(this, 'grabbing can…', '#67e8f9', 280, 180));
      if (!(await this.walkTo(218, 228, 'walk_left', 500))) return;
      if (!this.alive(gen)) return;
      this._npc.setPosition(218, 228);
      this._npc.setFrame(12);
      this.track(makeChip(this, 'pouring…', '#7dd3fc', 218, 170));
      // Hard-place can in her hands (handle grip) before async pour
      this._can.setTexture('can_full');
      this._can.setVisible(true);
      this._can.setDepth(20);
      this._can.setScale(1.55);
      this._can.setAngle(0);
      this._can.setPosition(this._npc.x + 0, this._npc.y - 16);
      await this.pourOntoPlant(this._plant.x, this._plant.y - 18, gen);
      if (!this.alive(gen)) return;
      const bubble = this.track(this.add.text(this._npc.x, this._npc.y - 70, 'Looking healthy.', {
        fontSize: '11px', fontFamily: 'monospace', color: '#0c4a6e',
        backgroundColor: '#f8fafcee', padding: { x: 6, y: 4 },
      }).setOrigin(0.5, 1).setDepth(40));
      if (!(await this.wait(1400))) return;
      try { bubble.destroy(); } catch (_) {}
      this.stopFollow();
      this._can.setVisible(false);
      if (!(await this.walkTo(420, 280, 'walk_right', 900))) return;
      this._npc.setFrame(0);
    }

    async sceneWork(gen) {
      const rob = this.track(this.add.sprite(300, 280, 'abby', 0).setOrigin(0.5, 1).setScale(1.5).setDepth(10).setTint(0xc8e0ff));
      this._npc.setPosition(520, 248);
      this._npc.setFrame(0);
      this._npc.setCrop(0, 0, 32, 34);

      this.track(makeChip(this, 'Writing code', '#4ade80', 520, 198));
      this.track(makeChip(this, 'Reading', '#60a5fa', 300, 228));

      if (!(await this.walkSprite(rob, 380, 250, 'walk_right', 900))) return;
      if (!this.alive(gen)) return;
      rob.setFrame(0);
      this.track(makeChip(this, '$ terminal', '#22d3ee', 380, 198));
      this.track(makeEmote(this, '$', 396, 188));

      const dots = this.track(this.add.text(520, 210, '…', {
        fontSize: '14px', fontFamily: 'monospace', color: '#0c4a6e',
        backgroundColor: '#e0f2fede', padding: { x: 4, y: 2 },
      }).setOrigin(0.5, 1).setDepth(40));
      let n = 0;
      this.time.addEvent({
        delay: 350, loop: true,
        callback: () => {
          n = (n + 1) % 4;
          dots.setText('.'.repeat(n) || '…');
        },
      });
      await this.wait(2800);
    }

    async sceneCoffee(gen) {
      try { this._npc.setCrop(); } catch (_) {}
      this._npc.setScale(1.5);
      this._npc.setPosition(360, 300);
      this._mug.setVisible(false);
      try { this._mug.setCrop(); } catch (_) {}
      this._mug.setOrigin(0.5, 1);
      if (!(await this.walkTo(158, 308, 'walk_left', 1100))) return;
      if (!this.alive(gen)) return;
      this._npc.setFrame(4); // face the machine (left)

      this.track(makeChip(this, 'brewing…', '#fbbf24', this._machine.x, this._machine.y - 36));
      await new Promise((resolve) => {
        this.tweens.add({
          targets: this._machine,
          scale: 2.55,
          duration: 180,
          yoyo: true,
          repeat: 3,
          onComplete: resolve,
        });
      });
      if (!this.alive(gen)) return;

      // Full steaming mug on the machine first
      this._mug.setCrop();
      this._mug.setOrigin(0.5, 1);
      this._mug.setPosition(this._machine.x + 2, this._machine.y - 14);
      this._mug.setVisible(true);
      this._mug.setScale(1.35);
      this._mug.setDepth(20);
      this._mug.anims.play('mug_steam', true);
      if (!(await this.wait(700))) return;

      // Sip pose: cropped cup glued to her mouth (facing left toward machine)
      this.holdMugAtMouth();
      this.track(makeChip(this, 'Coffee break', '#fbbf24', this._npc.x, this._npc.y - 72));
      // Hold the mouth pose long enough to read clearly
      if (!(await this.wait(2200))) return;

      // Walk away still holding cup at mouth (offset tracks facing)
      if (!(await this.walkTo(420, 280, 'walk_right', 1400))) return;
      this._npc.setFrame(0);
      if (!(await this.wait(1000))) return;
    }

    async sceneLoop(gen) {
      const order = ['compare', 'water', 'work', 'coffee'];
      for (const key of order) {
        if (!this.alive(gen) || this._playing !== 'loop') return;
        setCaption('loop');
        document.getElementById('caption').innerHTML =
          CAPTIONS.loop + ' · now: <strong>' + key + '</strong>';
        // Bump gen only via clearFx path — keep same loop gen, but reset fx carefully
        this.clearFx();
        if (key === 'compare') await this.sceneCompare(gen);
        else if (key === 'water') await this.sceneWater(gen);
        else if (key === 'work') await this.sceneWork(gen);
        else if (key === 'coffee') await this.sceneCoffee(gen);
        if (!this.alive(gen) || this._playing !== 'loop') return;
        if (!(await this.wait(700))) return;
      }
      if (this.alive(gen) && this._playing === 'loop') this.playScene('loop');
    }
  }

  const game = new Phaser.Game({
    type: Phaser.AUTO,
    width: W,
    height: H,
    parent: 'game-host',
    backgroundColor: '#2d3f2f',
    scene: [MockScene],
    pixelArt: true,
    scale: { mode: Phaser.Scale.NONE },
  });
  window.__game = game;

  document.querySelectorAll('button[data-scene]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.scene;
      setCaption(key);
      if (api) api.play(key);
    });
  });

})();
</script>
</body>
</html>
