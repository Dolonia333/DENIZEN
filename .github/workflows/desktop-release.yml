name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build Windows desktop
        working-directory: denizen/desktop
        run: |
          npm ci
          npm run build:win
      - name: Stage update manifest
        working-directory: denizen/desktop
        shell: pwsh
        run: |
          ./scripts/publish-update-manifest.ps1 -DistDir dist-build -OutDir updates -Channel ${{ github.event.inputs.channel || 'stable' }}
      - uses: actions/upload-artifact@v4
        with:
          name: denizen-desktop-win
          path: |
            denizen/desktop/dist-build/**
            denizen/desktop/updates/**

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: denizen-desktop-win
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/dist-build/**
          generate_release_notes: true
