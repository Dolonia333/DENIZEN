name: Desktop Release

on:
  push:
    tags:
      - 'v0.*'
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build Windows desktop
        working-directory: apps/office/desktop
        run: |
          npm ci
          npm run build:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: denizen-desktop-win
          path: |
            apps/office/desktop/dist-build/*.exe
            apps/office/desktop/dist-build/*.blockmap
            apps/office/desktop/dist-build/latest*.yml

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build Linux desktop
        working-directory: apps/office/desktop
        run: |
          npm ci
          npm run build:linux -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: denizen-desktop-linux
          path: |
            apps/office/desktop/dist-build/*.AppImage
            apps/office/desktop/dist-build/*.blockmap
            apps/office/desktop/dist-build/latest*.yml

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build macOS desktop
        working-directory: apps/office/desktop
        run: |
          npm ci
          npm run build:mac -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: denizen-desktop-mac
          path: |
            apps/office/desktop/dist-build/*.dmg
            apps/office/desktop/dist-build/*.zip
            apps/office/desktop/dist-build/*.blockmap
            apps/office/desktop/dist-build/latest*.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v0.')
    needs: [build-win, build-linux, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: denizen-desktop-*
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
