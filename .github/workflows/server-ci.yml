name: server-ci

# Regression-gate CI: the suite has known pre-existing failures (tracked as
# a FILE LIST in .github/known-test-failures.txt and in the dossier defect
# register). The job fails ONLY if a test file NOT on that list fails —
# counts flap with runner flakiness, file identity doesn't. Remove lines
# from the list as failures get fixed; additions require justification.

on:
  push:
    branches: [master]
    paths:
      - "denizen/**"
      - ".github/workflows/server-ci.yml"
      - ".github/known-test-failures.txt"
  pull_request:
    paths:
      - "denizen/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: denizen/package-lock.json

      - name: Install deps
        working-directory: denizen
        run: npm ci --no-audit --no-fund

      - name: Run suite (regression gate vs known-failing file list)
        working-directory: denizen
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          set -e
          if ! grep -q '\[run-tests\] files=' test-output.log; then
            echo "::error::Suite never produced a summary — infrastructure failure"
            exit 1
          fi
          grep -E "FAIL " test-output.log \
            | grep -oE "(tests|desktop/tests)[/\\\\][^ ]+\.test\.(js|mjs|cjs)" \
            | tr '\\\\' '/' | sort -u > failing-files.txt
          grep -vE '^\s*(#|$)' ../.github/known-test-failures.txt | sort -u > known.txt
          NEW=$(comm -23 failing-files.txt known.txt)
          echo "--- failing files ---"; cat failing-files.txt
          if [ -n "$NEW" ]; then
            echo "::error::New failing test file(s) not on the known list:"
            echo "$NEW"
            exit 1
          fi
          echo "All failures are on the known list — pass"

      - name: List failing files (informational)
        if: always()
        working-directory: denizen
        shell: bash
        run: grep -E "FAIL tests" test-output.log || echo "no failing files"
